<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MySQL连接、访问边界与备份恢复</title>
  <style>
    :root{color-scheme:dark;--bg:#071019;--panel:rgba(14,27,43,.95);--panel2:#142a40;--text:#eff7ff;--muted:#9fb1c5;--line:#486078;--blue:#61a5ff;--cyan:#65dcf6;--green:#62e6a5;--yellow:#ffd166;--purple:#bd95ff;--red:#ff7180;--shadow:0 22px 58px rgba(0,0,0,.35)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:radial-gradient(circle at 12% 10%,rgba(97,165,255,.19),transparent 30%),radial-gradient(circle at 90% 88%,rgba(189,149,255,.15),transparent 30%),linear-gradient(145deg,#050a11,var(--bg) 56%,#0c1930)}
    button{font:inherit}.app{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;gap:14px;padding:22px clamp(18px,3vw,44px) 18px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.eyebrow{margin:0 0 6px;color:var(--blue);font-size:13px;font-weight:900;letter-spacing:.16em}h1{margin:0;font-size:clamp(26px,3vw,42px);line-height:1.1}.tag{padding:9px 13px;border:1px solid rgba(98,230,165,.3);border-radius:999px;color:var(--green);background:rgba(98,230,165,.08);font-size:13px}
    .tabs{display:flex;gap:9px;padding:9px;border:1px solid rgba(130,155,185,.22);border-radius:16px;background:rgba(7,15,27,.62);box-shadow:var(--shadow)}.tab{min-width:145px;padding:11px 16px;border:1px solid transparent;border-radius:11px;color:var(--muted);background:transparent;cursor:pointer;transition:.2s}.tab:hover{color:var(--text);background:rgba(255,255,255,.05)}.tab.active{color:#06151e;background:var(--blue);font-weight:900;box-shadow:0 8px 22px rgba(97,165,255,.22)}
    main{min-height:0;display:grid;grid-template-columns:minmax(630px,1.67fr) minmax(310px,.72fr);gap:14px}.visual-card,.lesson-card{border:1px solid rgba(130,155,185,.22);border-radius:20px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}.visual-card{min-height:570px;padding:22px}.visual-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.visual-top h2{margin:0;font-size:20px}.concept{padding:7px 10px;border:1px solid rgba(101,220,246,.28);border-radius:999px;color:var(--cyan);background:rgba(101,220,246,.08);font-size:12px;font-weight:800}#visual{min-height:475px;display:grid;align-content:center}
    .lesson-card{display:grid;grid-template-rows:auto auto 1fr auto;padding:22px}.counter{color:var(--blue);font-size:13px;font-weight:900;letter-spacing:.08em}.lesson-card h2{margin:8px 0 10px;font-size:clamp(22px,2.2vw,30px);line-height:1.22}.explain{margin:0;color:#ccd9e7;font-size:16px;line-height:1.72}.question{align-self:end;margin-top:18px;padding:16px;border-left:4px solid var(--yellow);border-radius:0 12px 12px 0;background:rgba(255,209,102,.08)}.question small{display:block;color:var(--yellow);font-weight:900;margin-bottom:5px}.question p{margin:0;color:#f7e8bc;line-height:1.55}
    .controls{display:grid;grid-template-columns:44px 44px 1fr 44px;gap:9px;margin-top:18px}.control{height:44px;border:1px solid rgba(134,158,192,.3);border-radius:11px;color:var(--text);background:var(--panel2);cursor:pointer}.control:hover{border-color:var(--blue)}.control.play{color:#06151e;background:var(--blue);border-color:var(--blue);font-weight:900}footer{display:flex;justify-content:space-between;gap:18px;color:var(--muted);font-size:12px}
    .board{display:grid;gap:15px}.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:9px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card{padding:15px;border:2px solid var(--line);border-radius:14px;background:#10243a;text-align:center;transition:.25s}.card strong{display:block;margin-bottom:5px}.card small{color:var(--muted)}.card.active{border-color:var(--green);background:rgba(98,230,165,.1);box-shadow:0 0 24px rgba(98,230,165,.18)}.card.blue{border-color:var(--blue)}.card.purple{border-color:var(--purple)}.card.warn{border-color:var(--yellow);background:rgba(255,209,102,.08)}.card.fail{border-color:var(--red);background:rgba(255,113,128,.09)}.card.dim{opacity:.32}.arrow{color:var(--green);font-size:25px;text-align:center;font-weight:900}.badge{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:7px;color:#06151e;background:var(--green);font-size:11px;font-weight:900}.badge.warn{background:var(--yellow)}.badge.fail{color:#fff;background:var(--red)}.terminal{padding:14px 17px;background:#03090f;border:1px solid #293d51;border-radius:12px;color:#dae7f3;font:13px/1.6 Consolas,monospace;white-space:normal}.terminal b{color:var(--green)}.terminal .hi{color:var(--yellow)}.terminal .bad{color:var(--red)}
    .dbtree{padding:17px;border:2px solid var(--purple);border-radius:14px;background:#10243a;font:14px/1.75 Consolas,monospace}.dbtree strong{color:var(--cyan)}.flow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}.node{min-width:112px;padding:13px;border:2px solid var(--line);border-radius:12px;text-align:center;background:#10243a}.node.active{border-color:var(--green);background:rgba(98,230,165,.08)}.node.blue{border-color:var(--blue)}.node.purple{border-color:var(--purple)}.node.warn{border-color:var(--yellow)}.node.fail{border-color:var(--red)}.transport{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.route{padding:16px;border:3px solid var(--line);border-radius:14px;text-align:center}.route.socket{border-color:var(--yellow)}.route.tcp{border-color:var(--blue)}.route.active{box-shadow:0 0 26px rgba(98,230,165,.3)}.components{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.component{padding:12px 6px;border:2px solid var(--line);border-radius:10px;text-align:center}.component.active{border-color:var(--green)}
    .gates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.gate{padding:14px 7px;border:3px solid var(--line);border-radius:12px;text-align:center}.gate.pass{border-color:var(--green);background:rgba(98,230,165,.07)}.gate.fail{border-color:var(--red);background:rgba(255,113,128,.08)}.gate.warn{border-color:var(--yellow)}.clients{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.client{padding:15px;border:2px solid var(--blue);border-radius:12px;text-align:center}.client.allow{border-color:var(--green)}.client.deny{border-color:var(--red)}.boundary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.wall{padding:14px;border:2px solid var(--line);border-radius:11px;text-align:center}.wall.safe{border-color:var(--green)}.wall.risk{border-color:var(--red)}
    .accounts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.account{padding:14px;border:2px solid var(--line);border-radius:12px;text-align:center;font:13px Consolas,monospace}.account.match{border-color:var(--green);background:rgba(98,230,165,.08)}.account.no{opacity:.35}.identity{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.idbox{padding:15px;border:2px solid var(--blue);border-radius:12px;text-align:center}.idbox.current{border-color:var(--green)}.privileges{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.priv{padding:11px 4px;border:2px solid var(--line);border-radius:9px;text-align:center}.priv.yes{border-color:var(--green)}.priv.no{border-color:var(--red);opacity:.55}
    .backupflow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stage{padding:13px 6px;border:2px solid var(--line);border-radius:11px;text-align:center}.stage.active{border-color:var(--green)}.stage.fail{border-color:var(--red)}.dump{padding:15px;border:2px solid var(--blue);border-radius:12px;background:#03090f;font:12px/1.55 Consolas,monospace}.dump .sql{color:var(--cyan)}.verify{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.check{padding:12px 6px;border:2px solid var(--line);border-radius:10px;text-align:center}.check.pass{border-color:var(--green)}.check.fail{border-color:var(--red)}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.metric{padding:16px;border:2px solid var(--yellow);border-radius:13px;text-align:center}.metric strong{display:block;font-size:24px}.warning{padding:13px;border:1px solid var(--red);border-radius:11px;color:#ffc5ca;background:rgba(255,113,128,.08);text-align:center}
    @keyframes pulse{50%{box-shadow:0 0 28px rgba(98,230,165,.45);transform:scale(1.025)}}.pulse{animation:pulse 1.25s ease-in-out infinite}
    @media(max-width:980px){.app{min-height:auto}header{align-items:flex-start;flex-direction:column}.tabs{flex-wrap:wrap}main{grid-template-columns:1fr}.visual-card{min-height:540px}}
    @media(max-width:680px){.tab{min-width:0;flex:1 1 45%}.grid2,.grid3,.transport,.components,.gates,.clients,.boundary,.accounts,.identity,.privileges,.backupflow,.verify,.metrics{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="app">
    <header><div><p class="eyebrow">模块三 · 第26章 · Linux实验15</p><h1>MySQL连接、访问边界与备份恢复</h1></div><div class="tag">端口可达之后，仍需匹配账号与操作权限</div></header>
    <nav class="tabs" aria-label="动画主题"><button class="tab active" data-scene="transport">1　对象与连接</button><button class="tab" data-scene="boundaries">2　远程访问边界</button><button class="tab" data-scene="accounts">3　账号与授权</button><button class="tab" data-scene="backup">4　备份与恢复</button></nav>
    <main>
      <section class="visual-card"><div class="visual-top"><h2 id="visualTitle"></h2><span class="concept" id="conceptTag"></span></div><div id="visual" aria-live="polite"></div></section>
      <aside class="lesson-card"><div class="counter" id="counter"></div><div><h2 id="stepTitle"></h2><p class="explain" id="stepText"></p></div><div class="question"><small>先预测，再验证</small><p id="questionText"></p></div><div class="controls"><button class="control" id="prev">←</button><button class="control" id="restart">↺</button><button class="control play" id="play">▶ 播放</button><button class="control" id="next">→</button></div></aside>
    </main>
    <footer><span>概念模型：真实账号匹配受连接方式与名称解析设置影响，以CURRENT_USER()和服务端配置为准</span><span>键盘：←/→ · 空格 · 1/2/3/4切换主题</span></footer>
  </div>
  <script>
    const scenes={
      transport:{title:'MySQL实例包含数据对象，并提供Socket与TCP两种常见入口',tag:'client → transport → mysqld → database objects',steps:[
        {title:'关系型对象从实例组织到行和列',text:'mysqld管理实例中的数据库；company_db包含employees表，表由有类型和约束的列定义，多行数据共享表结构。主键唯一标识一行，索引帮助定位数据。',q:'department是数据库、表、行还是employees表中的列？',kind:'model'},
        {title:'服务端、客户端与备份工具职责不同',text:'mysqld是长期运行的服务进程，mysql是连接并执行SQL的客户端，mysqldump读取逻辑对象并输出SQL。安装客户端不等于启动数据库服务。',q:'ubuntu-client安装mysql-client后，是否会自动出现本地3306监听？',kind:'components'},
        {title:'省略-h时通常使用本地Unix Socket',text:'在rocky-server执行mysql -u app_user -p通常通过本地Socket连接，不经过IP路由、TCP 3306和firewalld。Socket路径与mysqld状态仍必须正确。',q:'本地Socket登录成功，能否证明3306正在监听？',kind:'socket'},
        {title:'-h 127.0.0.1明确测试本机TCP',text:'配合--protocol=TCP、-h 127.0.0.1和-P 3306可强制走TCP回环。它验证TCP监听和对应账号，但不经过外部网络入口。',q:'回环TCP成功是否能证明ubuntu-client已被防火墙允许？',kind:'tcp'},
        {title:'连接方式不同会经过不同边界',text:'Socket失败优先检查服务、Socket文件和本地账号；TCP refused检查服务与监听；远程timeout继续检查路由与防火墙；Access denied表示已经到达认证阶段。',q:'远程得到Access denied时，还应先扩大3306防火墙开放吗？',kind:'errors'}
      ]},
      boundaries:{title:'远程MySQL访问要连续通过监听、防火墙、账号和权限',tag:'bind → firewall → account → privilege',steps:[
        {title:'bind-address决定TCP Socket接收范围',text:'127.0.0.1只接收本机回环TCP；绑定rocky-server实验地址或0.0.0.0才可能接收外部连接。扩大监听只是必要条件，不代表网络和认证自动放行。',q:'bind-address=127.0.0.1时，即使开放3306防火墙，Ubuntu能否命中监听？',kind:'bind'},
        {title:'firewalld应只允许真实需要的来源',text:'实验临时使用rich rule只允许ubuntu-client固定IP访问3306，不使用普通全网端口开放。服务停止后，遗留规则也应清理。',q:'同时保留--add-port=3306/tcp时，来源限制rich rule还能阻止其他客户端吗？',kind:'firewall'},
        {title:'账号Host字段形成数据库内部来源边界',text:'remote_app只创建为ubuntu-client实际IP来源，其他来源即使通过网络也不会匹配同一账号行。user@%会显著扩大可尝试认证的来源范围。',q:'网络端口可达但没有匹配的remote_app@来源时，会进入数据查询阶段吗？',kind:'account'},
        {title:'匹配账号后还要验证操作权限',text:'实验远程账号只授予company_db的SELECT。认证成功只说明允许建立会话；INSERT、DROP等操作仍由授权系统逐项判定。',q:'remote_app可以SELECT，能否因此DROP company_db？',kind:'privilege'},
        {title:'最终回收要收紧全部临时边界',text:'远程验证后删除rich rule、移除远程账号、把bind-address恢复为127.0.0.1并重启mysqld，再检查3306监听和Ubuntu失败结果。只回收其中一层会留下风险。',q:'删除防火墙规则后，是否可以保留0.0.0.0监听和临时远程账号而不记录？',kind:'cleanup'}
      ]},
      accounts:{title:'MySQL账号由用户名与Host共同确定，并拥有独立授权',tag:'requested user + client origin → matched account row',steps:[
        {title:'同名不同Host是不同账号对象',text:'app_user@localhost、app_user@127.0.0.1和app_user@192.168.200.%可以拥有不同认证信息与权限。不能只说“app_user已经创建”而忽略来源。',q:'给app_user@localhost授权后，是否自动授予app_user@127.0.0.1？',kind:'rows'},
        {title:'连接方式影响服务器看到的来源',text:'本地Socket通常匹配localhost账号；TCP连接根据客户端来源地址和MySQL名称解析设置参与Host匹配。课程显式创建本地Socket、本机TCP和临时远程账号，减少歧义。',q:'-h 127.0.0.1与不写-h的连接一定匹配同一账号行吗？',kind:'origin'},
        {title:'服务器选择能匹配的账号行进行认证',text:'用户名相同且多个Host模式可匹配时，MySQL按照账号匹配规则选择适用行，通常更具体的Host优先。实际结果应使用CURRENT_USER()验证，不能仅凭配置顺序猜测。',q:'存在remote_app@%和remote_app@精确IP时，应该如何确认本次实际使用哪一行？',kind:'match'},
        {title:'USER()与CURRENT_USER()回答不同问题',text:'USER()显示客户端提供的用户名及客户端来源信息；CURRENT_USER()显示服务器用于认证和授权的实际账号行。排查Host匹配时应同时查看。',q:'要确认最终匹配的是app_user@localhost还是app_user@127.0.0.1，应看哪个函数？',kind:'identity'},
        {title:'最小权限要同时验证允许与拒绝',text:'业务账号只授予company_db所需的SELECT、INSERT、UPDATE、DELETE，不使用ALL ON *.*。验收既要证明查询/受控写入成功，也要证明DROP DATABASE被拒绝。',q:'只展示SELECT成功，能否证明账号没有超额权限？',kind:'least'}
      ]},
      backup:{title:'逻辑备份只有经过独立恢复和数据比较才形成可用证据',tag:'dump → inspect → restore elsewhere → compare',steps:[
        {title:'mysqldump把逻辑结构和数据写成SQL',text:'逻辑备份通常包含CREATE TABLE、INSERT等语句，便于跨实例或测试库恢复。它不同于运行中直接复制/var/lib/mysql文件，课程不把文件复制当作一致备份。',q:'直接cp正在使用的数据目录，能否据此保证数据库可恢复？',kind:'dump'},
        {title:'重定向可能先创建空文件',text:'Shell在mysqldump认证或连接失败前就可能创建目标文件。因此文件名存在不是成功证据，必须检查命令退出状态、test -s、关键SQL和SHA256。',q:'看到company_db.sql但大小为0，最可能缺少哪类检查？',kind:'empty'},
        {title:'--single-transaction有适用边界',text:'对InnoDB等事务表，它可在不长时间锁表的情况下获得一致视图；并不让所有存储引擎、DDL并发变化和外部文件自动一致。备份策略仍需结合业务。',q:'添加--single-transaction后，是否意味着任何并发DDL都一定被安全包含？',kind:'transaction'},
        {title:'先恢复到独立测试库再触碰正式库',text:'创建company_restore，把备份导入隔离目标，检查表结构、记录数和关键样本。只有测试恢复正确，才按实验流程恢复误删的正式表，避免坏备份造成二次破坏。',q:'未经测试就把备份直接导入唯一正式库，主要风险是什么？',kind:'restore'},
        {title:'RPO、RTO与恢复证据共同定义可用性',text:'RPO描述可接受的数据丢失时间范围，RTO描述可接受的恢复时长。验收记录备份时间、哈希、恢复用时、行数及样本，才能判断计划是否满足目标。',q:'每天备份一次时，最坏情况下可能丢失多长时间的数据？',kind:'metrics'}
      ]}
    };
    let sceneKey='transport',stepIndex=0,timer=null;
    const byId=id=>document.getElementById(id);
    function transportVisual(s){
      if(s.kind==='model')return '<div class="board"><div class="dbtree"><strong>MySQL实例</strong><br>└── company_db<br>　└── employees 表<br>　　├── id：主键<br>　　├── name：列<br>　　├── department：列<br>　　└── 多行员工记录</div><div class="row"><span class="badge pulse">固定结构 + 约束 + 数据行</span></div></div>';
      if(s.kind==='components')return '<div class="board"><div class="components"><div class="component active pulse"><strong>mysqld</strong><small>服务端进程</small></div><div class="component active"><strong>mysql</strong><small>交互客户端</small></div><div class="component active"><strong>mysqldump</strong><small>逻辑导出工具</small></div><div class="component"><strong>/var/lib/mysql</strong><small>数据目录</small></div></div><div class="terminal"><span class="hi">工具存在、服务运行和端口监听是不同状态</span></div></div>';
      if(s.kind==='socket')return '<div class="board"><div class="transport"><div class="route socket active pulse"><strong>Unix Socket</strong><small>rocky-server本机<br>文件系统命名的IPC入口<br>不经过TCP/firewalld</small></div><div class="route tcp"><strong>TCP 3306</strong><small>IP网络入口<br>本机回环或远程连接</small></div></div><div class="terminal"><b>$</b> mysql -u app_user -p company_db</div></div>';
      if(s.kind==='tcp')return '<div class="board"><div class="transport"><div class="route socket"><strong>Unix Socket</strong><small>本次不使用</small></div><div class="route tcp active pulse"><strong>TCP回环</strong><small>127.0.0.1:3306<br>仍在rocky-server本机</small></div></div><div class="terminal"><b>$</b> mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u app_user -p</div></div>';
      return '<div class="board"><div class="grid3"><div class="card fail"><strong>Socket error</strong><small>服务/Socket路径/本地账号</small></div><div class="card fail"><strong>Connection refused</strong><small>TCP服务/监听地址</small></div><div class="card warn pulse"><strong>Access denied</strong><small>已到认证<br>账号Host/密码/插件</small></div></div><div class="terminal"><span class="hi">错误阶段决定下一条证据，不决定唯一根因</span></div></div>';
    }
    function boundariesVisual(s){
      if(s.kind==='bind')return '<div class="board"><div class="grid2"><div class="card active"><strong>127.0.0.1:3306</strong><small>只接收本机回环TCP</small></div><div class="card warn pulse"><strong>0.0.0.0:3306</strong><small>所有本地IPv4接口<br>必须配合其他边界</small></div></div><div class="terminal"><b>#</b> ss -lntp | grep :3306</div></div>';
      if(s.kind==='firewall')return '<div class="board"><div class="clients"><div class="client allow pulse"><strong>ubuntu-client</strong><small>实际IP/32 → 允许3306/tcp</small></div><div class="client deny"><strong>其他来源</strong><small>无普通端口规则 → 拒绝</small></div></div><div class="terminal">rule family=ipv4 source address=$CLIENT_IP/32 port port=3306 protocol=tcp accept</div></div>';
      if(s.kind==='account')return '<div class="board"><div class="flow"><div class="node blue"><strong>网络已到达</strong><small>来源192.168.200.30</small></div><div class="arrow">→</div><div class="node active pulse"><strong>remote_app@192.168.200.30</strong><small>存在匹配账号</small></div><div class="arrow">→</div><div class="node purple"><strong>认证</strong><small>验证密码/插件</small></div></div></div>';
      if(s.kind==='privilege')return '<div class="board"><div class="gates"><div class="gate pass">监听 ✓</div><div class="gate pass">防火墙 ✓</div><div class="gate pass">账号认证 ✓</div><div class="gate fail pulse">DROP权限 ✕</div></div><div class="terminal"><span class="bad">ERROR 1142/1044：会话成功不等于操作获批</span></div></div>';
      return '<div class="board"><div class="boundary"><div class="wall safe"><strong>监听</strong><small>恢复127.0.0.1</small></div><div class="wall safe"><strong>防火墙</strong><small>删除3306 rich rule</small></div><div class="wall safe pulse"><strong>账号</strong><small>删除remote_app@Ubuntu_IP</small></div></div><div class="terminal"><b>#</b> ss -lntp | grep :3306<br><span class="hi">从Ubuntu复测临时入口已关闭</span></div></div>';
    }
    function accountsVisual(s){
      if(s.kind==='rows')return '<div class="board"><div class="accounts"><div class="account">\'app_user\'@\'localhost\'</div><div class="account">\'app_user\'@\'127.0.0.1\'</div><div class="account">\'app_user\'@\'192.168.200.%\'</div></div><div class="terminal"><span class="hi">三行独立账号：认证信息和GRANT都可不同</span></div></div>';
      if(s.kind==='origin')return '<div class="board"><div class="grid3"><div class="card active"><strong>本地Socket</strong><small>通常localhost账号</small></div><div class="card active"><strong>127.0.0.1 TCP</strong><small>本机TCP来源匹配</small></div><div class="card active pulse"><strong>Ubuntu TCP</strong><small>客户端实际源地址</small></div></div><div class="terminal"><span class="hi">连接方式 + 来源 + 名称解析设置影响匹配</span></div></div>';
      if(s.kind==='match')return '<div class="board"><div class="flow"><div class="node blue"><strong>remote_app</strong><small>来源192.168.200.30</small></div><div class="arrow">→</div><div class="accounts"><div class="account no">@localhost</div><div class="account match pulse">@192.168.200.30</div><div class="account no">@%</div></div></div><div class="terminal"><b>mysql&gt;</b> SELECT USER(), CURRENT_USER();</div></div>';
      if(s.kind==='identity')return '<div class="board"><div class="identity"><div class="idbox"><strong>USER()</strong><small>客户端声明用户<br>及客户端来源信息</small><div class="terminal">app_user@localhost</div></div><div class="idbox current pulse"><strong>CURRENT_USER()</strong><small>实际用于认证/授权的账号行</small><div class="terminal">app_user@127.0.0.1</div></div></div></div>';
      return '<div class="board"><div class="privileges"><div class="priv yes">SELECT ✓</div><div class="priv yes">INSERT ✓</div><div class="priv yes">UPDATE ✓</div><div class="priv yes">DELETE ✓</div><div class="priv no pulse">DROP DATABASE ✕</div></div><div class="terminal"><b>mysql&gt;</b> SHOW GRANTS FOR \'app_user\'@\'localhost\';<br><span class="hi">同时验证允许操作和预期拒绝操作</span></div></div>';
    }
    function backupVisual(s){
      if(s.kind==='dump')return '<div class="board"><div class="flow"><div class="node purple"><strong>company_db</strong><small>结构、数据、例程、触发器</small></div><div class="arrow">→</div><div class="node active pulse"><strong>mysqldump</strong><small>逻辑导出</small></div><div class="arrow">→</div><div class="dump"><span class="sql">CREATE TABLE employees ...;</span><br><span class="sql">INSERT INTO employees ...;</span></div></div><div class="terminal"><span class="bad">运行中直接复制数据目录不是本课程的逻辑备份</span></div></div>';
      if(s.kind==='empty')return '<div class="board"><div class="backupflow"><div class="stage fail">认证失败</div><div class="stage fail pulse">mysqldump非0</div><div class="stage fail">Shell已创建文件</div><div class="stage fail">0字节SQL</div></div><div class="verify"><div class="check pass">退出码0</div><div class="check pass">test -s</div><div class="check pass">关键SQL</div><div class="check pass">SHA256</div></div></div>';
      if(s.kind==='transaction')return '<div class="board"><div class="grid2"><div class="card active pulse"><strong>事务表一致视图</strong><small>适合InnoDB<br>减少长时间锁表需求</small></div><div class="card warn"><strong>适用边界</strong><small>非事务表、并发DDL、外部文件<br>不能自动保证一致</small></div></div><div class="terminal"><b>$</b> mysqldump --single-transaction --routines --triggers company_db</div></div>';
      if(s.kind==='restore')return '<div class="board"><div class="backupflow"><div class="stage active">检查备份</div><div class="stage active">创建company_restore</div><div class="stage active pulse">导入测试库</div><div class="stage active">比较结构/行数/样本</div></div><div class="terminal"><b>$</b> mysql -u root -p company_restore &lt; company_restore.sql<br><b>mysql&gt;</b> SELECT COUNT(*) FROM employees;</div></div>';
      return '<div class="board"><div class="metrics"><div class="metric pulse"><strong>RPO</strong><small>最多能接受丢失多久的数据？</small></div><div class="metric"><strong>RTO</strong><small>最多能接受多长恢复时间？</small></div></div><div class="verify"><div class="check pass">备份时间</div><div class="check pass">哈希</div><div class="check pass">恢复用时</div><div class="check pass">数据验证</div></div></div>';
    }
    function render(){
      const scene=scenes[sceneKey],step=scene.steps[stepIndex];
      byId('visualTitle').textContent=scene.title;byId('conceptTag').textContent=scene.tag;
      byId('counter').textContent='第 '+(stepIndex+1)+' / '+scene.steps.length+' 步';
      byId('stepTitle').textContent=step.title;byId('stepText').textContent=step.text;byId('questionText').textContent=step.q;
      byId('visual').innerHTML=sceneKey==='transport'?transportVisual(step):sceneKey==='boundaries'?boundariesVisual(step):sceneKey==='accounts'?accountsVisual(step):backupVisual(step);
      document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.scene===sceneKey));
    }
    function stop(){if(timer){clearInterval(timer);timer=null}byId('play').textContent='▶ 播放'}
    function next(){const n=scenes[sceneKey].steps.length;stepIndex=stepIndex<n-1?stepIndex+1:0;render()}
    function previous(){const n=scenes[sceneKey].steps.length;stepIndex=(stepIndex-1+n)%n;render()}
    function togglePlay(){if(timer){stop();return}byId('play').textContent='Ⅱ 暂停';timer=setInterval(next,4300)}
    document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{stop();sceneKey=t.dataset.scene;stepIndex=0;render()}));
    byId('prev').addEventListener('click',()=>{stop();previous()});byId('next').addEventListener('click',()=>{stop();next()});byId('restart').addEventListener('click',()=>{stop();stepIndex=0;render()});byId('play').addEventListener('click',togglePlay);
    document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();next()}else if(e.key==='ArrowLeft'){stop();previous()}else if(e.key===' '){e.preventDefault();togglePlay()}else if('1234'.includes(e.key)){stop();sceneKey=['transport','boundaries','accounts','backup'][Number(e.key)-1];stepIndex=0;render()}});
    render();
  </script>
</body>
</html>
