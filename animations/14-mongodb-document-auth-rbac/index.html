<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MongoDB文档模型、认证、RBAC与备份</title>
  <style>
    :root{color-scheme:dark;--bg:#071511;--panel:rgba(12,30,25,.96);--panel2:#14372c;--text:#effff8;--muted:#a6c1b6;--line:#476d60;--green:#62e6a5;--leaf:#9bea72;--cyan:#65dcf6;--yellow:#ffd166;--purple:#bd95ff;--red:#ff7180;--shadow:0 22px 58px rgba(0,0,0,.36)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:radial-gradient(circle at 12% 8%,rgba(98,230,165,.19),transparent 29%),radial-gradient(circle at 90% 88%,rgba(101,220,246,.14),transparent 31%),linear-gradient(145deg,#040b08,var(--bg) 58%,#0a2620)}
    button{font:inherit}.app{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;gap:14px;padding:22px clamp(18px,3vw,44px) 18px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.eyebrow{margin:0 0 6px;color:var(--green);font-size:13px;font-weight:900;letter-spacing:.16em}h1{margin:0;font-size:clamp(26px,3vw,42px);line-height:1.1}.tag{padding:9px 13px;border:1px solid rgba(101,220,246,.3);border-radius:999px;color:var(--cyan);background:rgba(101,220,246,.08);font-size:13px}
    .tabs{display:flex;gap:9px;padding:9px;border:1px solid rgba(137,178,161,.22);border-radius:16px;background:rgba(5,18,14,.65);box-shadow:var(--shadow)}.tab{min-width:145px;padding:11px 16px;border:1px solid transparent;border-radius:11px;color:var(--muted);background:transparent;cursor:pointer;transition:.2s}.tab:hover{color:var(--text);background:rgba(255,255,255,.05)}.tab.active{color:#061810;background:var(--green);font-weight:900;box-shadow:0 8px 22px rgba(98,230,165,.22)}
    main{min-height:0;display:grid;grid-template-columns:minmax(630px,1.67fr) minmax(310px,.72fr);gap:14px}.visual-card,.lesson-card{border:1px solid rgba(137,178,161,.22);border-radius:20px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}.visual-card{min-height:570px;padding:22px}.visual-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.visual-top h2{margin:0;font-size:20px}.concept{padding:7px 10px;border:1px solid rgba(101,220,246,.28);border-radius:999px;color:var(--cyan);background:rgba(101,220,246,.08);font-size:12px;font-weight:800}#visual{min-height:475px;display:grid;align-content:center}
    .lesson-card{display:grid;grid-template-rows:auto auto 1fr auto;padding:22px}.counter{color:var(--green);font-size:13px;font-weight:900;letter-spacing:.08em}.lesson-card h2{margin:8px 0 10px;font-size:clamp(22px,2.2vw,30px);line-height:1.22}.explain{margin:0;color:#d0e3db;font-size:16px;line-height:1.72}.question{align-self:end;margin-top:18px;padding:16px;border-left:4px solid var(--yellow);border-radius:0 12px 12px 0;background:rgba(255,209,102,.08)}.question small{display:block;color:var(--yellow);font-weight:900;margin-bottom:5px}.question p{margin:0;color:#f7e8bc;line-height:1.55}
    .controls{display:grid;grid-template-columns:44px 44px 1fr 44px;gap:9px;margin-top:18px}.control{height:44px;border:1px solid rgba(137,178,161,.3);border-radius:11px;color:var(--text);background:var(--panel2);cursor:pointer}.control:hover{border-color:var(--green)}.control.play{color:#061810;background:var(--green);border-color:var(--green);font-weight:900}footer{display:flex;justify-content:space-between;gap:18px;color:var(--muted);font-size:12px}
    .board{display:grid;gap:15px}.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:9px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.card{padding:15px;border:2px solid var(--line);border-radius:14px;background:#102f27;text-align:center;transition:.25s}.card strong{display:block;margin-bottom:5px}.card small{color:var(--muted)}.card.active{border-color:var(--green);background:rgba(98,230,165,.1);box-shadow:0 0 24px rgba(98,230,165,.18)}.card.blue{border-color:var(--cyan)}.card.purple{border-color:var(--purple)}.card.warn{border-color:var(--yellow);background:rgba(255,209,102,.08)}.card.fail{border-color:var(--red);background:rgba(255,113,128,.09)}.card.dim{opacity:.34}.arrow{color:var(--green);font-size:25px;text-align:center;font-weight:900}.badge{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:7px;color:#061810;background:var(--green);font-size:11px;font-weight:900}.badge.warn{background:var(--yellow)}.badge.fail{color:#fff;background:var(--red)}.terminal{padding:14px 17px;background:#020b08;border:1px solid #29483e;border-radius:12px;color:#d8eee5;font:13px/1.6 Consolas,monospace;white-space:normal}.terminal b{color:var(--green)}.terminal .hi{color:var(--yellow)}.terminal .bad{color:var(--red)}
    .tree{padding:17px;border:2px solid var(--green);border-radius:14px;background:#102f27;font:14px/1.75 Consolas,monospace}.tree strong{color:var(--cyan)}.document{padding:16px;border:2px solid var(--leaf);border-radius:13px;background:#06130f;font:13px/1.65 Consolas,monospace}.document .key{color:var(--cyan)}.document .value{color:var(--yellow)}.document .nested{color:var(--purple)}.flow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}.node{min-width:112px;padding:13px;border:2px solid var(--line);border-radius:12px;text-align:center;background:#102f27}.node.active{border-color:var(--green);background:rgba(98,230,165,.08)}.node.blue{border-color:var(--cyan)}.node.purple{border-color:var(--purple)}.node.warn{border-color:var(--yellow)}.node.fail{border-color:var(--red)}
    .gates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.gate{padding:14px 7px;border:3px solid var(--line);border-radius:12px;text-align:center}.gate.pass{border-color:var(--green);background:rgba(98,230,165,.07)}.gate.fail{border-color:var(--red);background:rgba(255,113,128,.08)}.gate.warn{border-color:var(--yellow)}.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.role{padding:14px 6px;border:2px solid var(--line);border-radius:11px;text-align:center}.role.yes{border-color:var(--green)}.role.no{border-color:var(--red);opacity:.58}.identity{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.idbox{padding:15px;border:2px solid var(--cyan);border-radius:12px;text-align:center}.idbox.current{border-color:var(--green)}.boundary{padding:18px;border:3px dashed var(--line);border-radius:17px}.boundary.local{border-color:var(--green)}.boundary.remote{border-color:var(--red)}.config{padding:15px;border:2px solid var(--purple);border-radius:12px;background:#050d0a;font:13px/1.65 Consolas,monospace}.config .key{color:var(--cyan)}.config .value{color:var(--yellow)}
    .backupflow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stage{padding:13px 6px;border:2px solid var(--line);border-radius:11px;text-align:center}.stage.active{border-color:var(--green)}.stage.fail{border-color:var(--red)}.files{padding:15px;border:2px solid var(--cyan);border-radius:12px;background:#030d09;font:13px/1.65 Consolas,monospace}.verify{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.check{padding:12px 6px;border:2px solid var(--line);border-radius:10px;text-align:center}.check.pass{border-color:var(--green)}.check.fail{border-color:var(--red)}.warning{padding:13px;border:1px solid var(--red);border-radius:11px;color:#ffc5ca;background:rgba(255,113,128,.08);text-align:center}
    @keyframes pulse{50%{box-shadow:0 0 28px rgba(98,230,165,.43);transform:scale(1.025)}}.pulse{animation:pulse 1.25s ease-in-out infinite}
    @media(max-width:980px){.app{min-height:auto}header{align-items:flex-start;flex-direction:column}.tabs{flex-wrap:wrap}main{grid-template-columns:1fr}.visual-card{min-height:540px}}
    @media(max-width:680px){.tab{min-width:0;flex:1 1 45%}.grid2,.grid3,.grid4,.gates,.roles,.identity,.backupflow,.verify{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="app">
    <header><div><p class="eyebrow">模块三 · 第27章 · Linux实验16</p><h1>MongoDB文档模型、认证、RBAC与备份</h1></div><div class="tag">连接成功、身份认证和操作授权是三个不同阶段</div></header>
    <nav class="tabs" aria-label="动画主题"><button class="tab active" data-scene="model">1　文档模型</button><button class="tab" data-scene="auth">2　认证数据库</button><button class="tab" data-scene="rbac">3　RBAC与监听</button><button class="tab" data-scene="backup">4　备份与恢复</button></nav>
    <main>
      <section class="visual-card"><div class="visual-top"><h2 id="visualTitle"></h2><span class="concept" id="conceptTag"></span></div><div id="visual" aria-live="polite"></div></section>
      <aside class="lesson-card"><div class="counter" id="counter"></div><div><h2 id="stepTitle"></h2><p class="explain" id="stepText"></p></div><div class="question"><small>先预测，再验证</small><p id="questionText"></p></div><div class="controls"><button class="control" id="prev">←</button><button class="control" id="restart">↺</button><button class="control play" id="play">▶ 播放</button><button class="control" id="next">→</button></div></aside>
    </main>
    <footer><span>实验最终状态：authorization已启用，27017只监听127.0.0.1，不向实验网络开放</span><span>键盘：←/→ · 空格 · 1/2/3/4切换主题</span></footer>
  </div>
  <script>
    const scenes={
      model:{title:'文档以字段和值组织，可嵌套对象和数组',tag:'database → collection → BSON document → field',steps:[
        {title:'数据库、集合、文档和字段逐级组织',text:'mongod服务中可以有多个数据库；company_db中有inspections集合；集合保存多份BSON文档；host、status等是文档字段。_id默认唯一标识一份文档。',q:'inspections与一条巡检记录，哪个是集合，哪个是文档？',kind:'tree'},
        {title:'文档可以直接表达嵌套对象和数组',text:'一份巡检文档可包含services嵌套对象和tags数组，不需要把所有内容拆成多张关系表。BSON与JSON外观相近，但还能保存日期等更多数据类型。',q:'services.nginx和tags[0]分别位于嵌套对象还是数组中？',kind:'document'},
        {title:'同一集合的文档可以拥有不同字段',text:'一份记录包含cpu_percent，另一份包含disk_percent和tags，这种灵活性适合变化较快的数据；它不等于可以放弃字段命名规范、数据校验和索引设计。',q:'允许字段不同，是否意味着status可以随意混用字符串、数字和拼写？',kind:'flexible'},
        {title:'数据库和集合通常在首次写入时物化',text:'执行use company_db只是切换当前逻辑命名空间；真正插入文档后，数据库和集合才会实际创建。空库没有出现在show dbs中通常不是服务故障。',q:'刚执行use new_db后show dbs没有new_db，应先重启mongod还是先确认是否写入？',kind:'materialize'},
        {title:'服务进程、Shell和数据库工具职责不同',text:'mongod是长期运行的服务端，mongosh连接并执行命令，mongodump和mongorestore负责逻辑备份恢复。工具已安装不能证明服务已启动或27017正在监听。',q:'mongosh --version成功，能否证明mongod为active？',kind:'components'}
      ]},
      auth:{title:'MongoDB用户属于创建它的认证数据库',tag:'user + authentication database → authenticated identity',steps:[
        {title:'先在仅本机环境创建首个管理员',text:'实验保持bindIp为127.0.0.1，在尚未启用authorization时创建courseAdmin和业务用户，然后再启用认证。这样既缩短无认证窗口，也避免先启用认证后没有可登录管理员。',q:'为什么不能先打开authorization，再考虑创建第一个管理员？',kind:'bootstrap'},
        {title:'认证数据库是保存用户身份的命名空间',text:'courseAdmin创建在admin；inspectionApp创建在company_db。用户名相同但认证数据库不同，可视为不同身份。认证数据库不等于用户只能访问的业务数据库。',q:'inspectionApp创建在company_db，连接时默认去admin查找它会发生什么？',kind:'authdb'},
        {title:'连接参数必须指向正确认证数据库',text:'--authenticationDatabase company_db告诉服务端到company_db验证inspectionApp；最后的company_db则是连接后默认使用的业务数据库。两者可能同名，也可能不同。',q:'命令里出现两次company_db时，它们的职责完全相同吗？',kind:'command'},
        {title:'Authentication failed表示身份验证未通过',text:'用户名、密码或认证数据库错误会导致Authentication failed。此时TCP连接可能已经建立，问题位于认证阶段，不应先通过扩大bindIp或防火墙来处理。',q:'端口正常且日志显示Authentication failed，下一步应检查路由还是用户所在认证库？',kind:'authfail'},
        {title:'Unauthorized表示已认证但操作越权',text:'inspectionApp可以读写company_db，却不能管理admin中的用户。出现Unauthorized时，应检查当前身份和角色范围；不要把它与密码错误混为一谈。',q:'业务账号能查询巡检文档但db.getUsers()被拒绝，说明认证失败了吗？',kind:'unauthorized'}
      ]},
      rbac:{title:'角色决定已认证身份能对哪些资源执行哪些动作',tag:'network reachability ≠ authentication ≠ authorization',steps:[
        {title:'角色同时描述动作集合和资源范围',text:'read、readWrite、dbAdmin和userAdmin代表不同能力。{role:\"readWrite\",db:\"company_db\"}只给inspectionApp业务库读写权限，不会自动授予admin管理权限。',q:'readWrite@company_db是否允许创建admin数据库中的用户？',kind:'roles'},
        {title:'最小权限需要同时验证允许和拒绝',text:'业务用户查询和插入成功，只能证明需要的能力存在；再验证管理操作被拒绝，才能证明权限没有明显越界。只做成功测试无法发现权限过大。',q:'验收inspectionReader只读账号时，除了find成功还必须验证什么？',kind:'least'},
        {title:'bindIp决定mongod在哪些本地地址接收连接',text:'127.0.0.1只接收rocky-server本机回环连接。实验最终保持该设置，因此ubuntu-client远程连接27017失败是预期安全结果，不是待修复故障。',q:'bindIp为127.0.0.1时，开放firewalld的27017能让Ubuntu连上吗？',kind:'bind'},
        {title:'远程暴露必须同时设计多层边界',text:'真实业务若需要远程访问，应同时限定bindIp、firewalld来源、认证与最小角色，并使用TLS保护传输。开启认证本身不会自动加密网络流量。',q:'把bindIp改为0.0.0.0且启用密码，是否足以安全暴露到整个校园网？',kind:'remote'},
        {title:'YAML结构错误可能使服务无法启动',text:'mongod.conf使用空格缩进；已有net块应修改现有键，不能再追加重复net。改动后先看systemctl状态、journal和mongod日志，再核对配置行并最小修复。',q:'重启后mongod立即failed，应该先关闭SELinux还是先检查刚改的YAML和日志？',kind:'yaml'}
      ]},
      backup:{title:'逻辑备份只有经过检查和隔离恢复才可证明可用',tag:'mongodump → inspect → restore elsewhere → compare',steps:[
        {title:'mongodump导出BSON和集合元数据',text:'mongodump读取逻辑数据库，在输出目录中生成集合的.bson数据文件和.metadata.json元数据。它不是SQL文本，也不是对运行中/var/lib/mongo目录的简单复制。',q:'能否只用文本编辑器打开.bson来判断所有文档都正确？',kind:'dump'},
        {title:'备份命令也必须使用正确认证数据库',text:'inspectionApp身份保存在company_db，因此mongodump仍需指定--authenticationDatabase company_db。-p不跟密码，交互输入可避免密码写进历史、脚本和截图。',q:'业务数据库参数--db正确，但authenticationDatabase误写admin，备份会怎样？',kind:'credentials'},
        {title:'目录存在不等于备份完成',text:'备份后检查命令退出结果、find列出的文件、文件非空、BSON可读性和校验和。空目录、残缺文件或认证失败日志都不能作为成功证据。',q:'看到mongodb/company_db目录后，至少还要检查哪些证据？',kind:'inspect'},
        {title:'恢复应先进入隔离测试命名空间',text:'用mongorestore将备份映射到单独的测试数据库，验证文档数、关键样本和索引。不要未经确认对唯一业务库使用--drop，它可能先删除目标集合再恢复。',q:'为什么“备份文件存在”仍不能替代一次真实恢复抽查？',kind:'restore'},
        {title:'恢复验证完成后才能形成闭环',text:'记录备份时间、目录、哈希、恢复命令、恢复用时、文档数和关键样本；同时确认正式company_db未被测试过程覆盖。可恢复证据比“命令没有报错”更可靠。',q:'测试库文档数相同后，还应抽查哪些内容来避免只比较数量？',kind:'verify'}
      ]}
    };
    let sceneKey='model',stepIndex=0,timer=null;
    const byId=id=>document.getElementById(id);
    function modelVisual(s){
      if(s.kind==='tree')return '<div class="board"><div class="tree"><strong>mongod</strong><br>└── company_db　<span class="hi">database</span><br>　└── inspections　<span class="hi">collection</span><br>　　├── {_id, host, status, ...}　document<br>　　└── {_id, host, tags, ...}　document</div><div class="row"><span class="badge pulse">field = 文档中的键和值</span></div></div>';
      if(s.kind==='document')return '<div class="board"><div class="document">{<br>　<span class="key">host</span>: <span class="value">"web-server"</span>,<br>　<span class="key">services</span>: <span class="nested">{ nginx: "active", api: "active" }</span>,<br>　<span class="key">tags</span>: <span class="nested">["web", "production"]</span>,<br>　<span class="key">checked_at</span>: <span class="value">new Date()</span><br>}</div><div class="grid2"><div class="card purple">嵌套对象：services</div><div class="card blue pulse">数组：tags</div></div></div>';
      if(s.kind==='flexible')return '<div class="board"><div class="grid3"><div class="document"><span class="key">host</span>: "rocky"<br><span class="key">cpu_percent</span>: 18</div><div class="document"><span class="key">host</span>: "db"<br><span class="key">disk_percent</span>: 81<br><span class="key">tags</span>: [...]</div><div class="document"><span class="key">host</span>: "web"<br><span class="key">services</span>: {...}</div></div><div class="warning">结构灵活 ≠ 无规范、无校验、无索引</div></div>';
      if(s.kind==='materialize')return '<div class="board"><div class="flow"><div class="node blue">use new_db<br><small>切换命名空间</small></div><div class="arrow">→</div><div class="node warn">show dbs<br><small>尚未显示</small></div><div class="arrow">→</div><div class="node active pulse">insertOne()<br><small>首次写入</small></div><div class="arrow">→</div><div class="node active">数据库/集合物化</div></div></div>';
      return '<div class="board"><div class="grid4"><div class="card active pulse"><strong>mongod</strong><small>服务端进程</small></div><div class="card active"><strong>mongosh</strong><small>交互客户端</small></div><div class="card blue"><strong>mongodump</strong><small>逻辑导出</small></div><div class="card purple"><strong>mongorestore</strong><small>逻辑恢复</small></div></div><div class="terminal"><b>#</b> systemctl is-active mongod　　<b>#</b> ss -lntp | grep :27017</div></div>';
    }
    function authVisual(s){
      if(s.kind==='bootstrap')return '<div class="board"><div class="backupflow"><div class="stage active">bindIp 127.0.0.1</div><div class="stage active pulse">创建首个管理员</div><div class="stage active">创建业务用户</div><div class="stage active">启用authorization</div></div><div class="warning">无认证阶段必须短暂、受控且仅本机可达</div></div>';
      if(s.kind==='authdb')return '<div class="board"><div class="identity"><div class="idbox current"><strong>courseAdmin</strong><small>身份保存在</small><div class="terminal">admin</div></div><div class="idbox current pulse"><strong>inspectionApp</strong><small>身份保存在</small><div class="terminal">company_db</div></div></div><div class="terminal"><span class="hi">用户身份位置与获得角色的目标数据库是两个概念</span></div></div>';
      if(s.kind==='command')return '<div class="board"><div class="flow"><div class="node blue"><strong>inspectionApp</strong></div><div class="arrow">→</div><div class="node active pulse"><strong>--authenticationDatabase</strong><small>company_db：查找身份</small></div><div class="arrow">→</div><div class="node purple"><strong>company_db</strong><small>默认业务库</small></div></div><div class="terminal"><b>$</b> mongosh --authenticationDatabase company_db -u inspectionApp -p company_db</div></div>';
      if(s.kind==='authfail')return '<div class="board"><div class="gates"><div class="gate pass">TCP连接 ✓</div><div class="gate pass">mongod响应 ✓</div><div class="gate fail pulse">身份认证 ✕</div><div class="gate">角色判定 —</div></div><div class="terminal"><span class="bad">MongoServerError: Authentication failed.</span><br><span class="hi">检查用户名、密码、authenticationDatabase</span></div></div>';
      return '<div class="board"><div class="gates"><div class="gate pass">TCP连接 ✓</div><div class="gate pass">身份认证 ✓</div><div class="gate pass">find/insert ✓</div><div class="gate fail pulse">管理用户 ✕</div></div><div class="terminal"><span class="bad">MongoServerError: not authorized / Unauthorized</span><br><span class="hi">检查当前身份、角色和目标资源</span></div></div>';
    }
    function rbacVisual(s){
      if(s.kind==='roles')return '<div class="board"><div class="roles"><div class="role yes">read<br><small>读业务数据</small></div><div class="role yes pulse">readWrite<br><small>读写业务数据</small></div><div class="role">dbAdmin<br><small>数据库管理</small></div><div class="role">userAdmin<br><small>用户管理</small></div></div><div class="terminal">{ role: <span class="hi">"readWrite"</span>, db: <span class="hi">"company_db"</span> }</div></div>';
      if(s.kind==='least')return '<div class="board"><div class="grid2"><div class="card active"><strong>允许验证</strong><small>find ✓<br>insertOne ✓</small></div><div class="card fail pulse"><strong>拒绝验证</strong><small>use admin<br>db.getUsers() ✕</small></div></div><div class="terminal"><span class="hi">最小权限 = 所需操作成功 + 越权操作失败</span></div></div>';
      if(s.kind==='bind')return '<div class="board"><div class="boundary local pulse"><div class="card active"><strong>rocky-server</strong><small>mongod → 127.0.0.1:27017</small></div><div class="row"><span class="badge">本机mongosh可连接</span></div></div><div class="card fail"><strong>ubuntu-client → rocky-server:27017</strong><small>没有外部接口监听，远程失败是预期结果</small></div></div>';
      if(s.kind==='remote')return '<div class="board"><div class="gates"><div class="gate warn">bindIp<br><small>限定接口</small></div><div class="gate warn">firewalld<br><small>限定来源</small></div><div class="gate warn">认证/RBAC<br><small>限定身份操作</small></div><div class="gate warn pulse">TLS<br><small>保护传输</small></div></div><div class="warning">authorization并不等于传输加密；不把27017直接开放给不可信网络</div></div>';
      return '<div class="board"><div class="config"><span class="key">net:</span><br>　<span class="key">port:</span> <span class="value">27017</span><br>　<span class="key">bindIp:</span> <span class="value">127.0.0.1</span><br><br><span class="key">security:</span><br>　<span class="key">authorization:</span> <span class="value">enabled</span></div><div class="grid3"><div class="card active">status</div><div class="card active pulse">journal / mongod.log</div><div class="card active">缩进/重复键</div></div></div>';
    }
    function backupVisual(s){
      if(s.kind==='dump')return '<div class="board"><div class="flow"><div class="node purple"><strong>company_db</strong><small>inspections集合</small></div><div class="arrow">→</div><div class="node active pulse"><strong>mongodump</strong><small>逻辑导出</small></div><div class="arrow">→</div><div class="files">company_db/<br>├── inspections.bson<br>└── inspections.metadata.json</div></div><div class="warning">不是SQL文本，也不是直接复制运行中的数据目录</div></div>';
      if(s.kind==='credentials')return '<div class="board"><div class="gates"><div class="gate pass">127.0.0.1:27017 ✓</div><div class="gate pass">用户 inspectionApp ✓</div><div class="gate pass pulse">认证库 company_db ✓</div><div class="gate pass">角色 readWrite ✓</div></div><div class="terminal"><b>$</b> mongodump --authenticationDatabase company_db -u inspectionApp -p --db company_db --out ...</div></div>';
      if(s.kind==='inspect')return '<div class="board"><div class="verify"><div class="check pass">退出状态</div><div class="check pass pulse">文件非空</div><div class="check pass">BSON可读</div><div class="check pass">SHA256</div></div><div class="grid2"><div class="card fail">仅有空目录 ✕</div><div class="card active">数据与元数据文件 ✓</div></div></div>';
      if(s.kind==='restore')return '<div class="board"><div class="backupflow"><div class="stage active">确认源目录</div><div class="stage active pulse">映射到测试库</div><div class="stage active">mongorestore</div><div class="stage active">比较数据/索引</div></div><div class="warning">未经确认不要对唯一业务库直接使用 --drop</div></div>';
      return '<div class="board"><div class="verify"><div class="check pass">文档总数</div><div class="check pass">warning样本</div><div class="check pass pulse">字段与嵌套值</div><div class="check pass">索引信息</div></div><div class="terminal"><b>&gt;</b> db.inspections.countDocuments({})<br><b>&gt;</b> db.inspections.find({status:"warning"})<br><span class="hi">确认正式company_db未被覆盖</span></div></div>';
    }
    function render(){
      const scene=scenes[sceneKey],step=scene.steps[stepIndex];
      byId('visualTitle').textContent=scene.title;byId('conceptTag').textContent=scene.tag;
      byId('counter').textContent='第 '+(stepIndex+1)+' / '+scene.steps.length+' 步';
      byId('stepTitle').textContent=step.title;byId('stepText').textContent=step.text;byId('questionText').textContent=step.q;
      byId('visual').innerHTML=sceneKey==='model'?modelVisual(step):sceneKey==='auth'?authVisual(step):sceneKey==='rbac'?rbacVisual(step):backupVisual(step);
      document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.scene===sceneKey));
    }
    function stop(){if(timer){clearInterval(timer);timer=null}byId('play').textContent='▶ 播放'}
    function next(){const n=scenes[sceneKey].steps.length;stepIndex=stepIndex<n-1?stepIndex+1:0;render()}
    function previous(){const n=scenes[sceneKey].steps.length;stepIndex=(stepIndex-1+n)%n;render()}
    function togglePlay(){if(timer){stop();return}byId('play').textContent='Ⅱ 暂停';timer=setInterval(next,4300)}
    document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{stop();sceneKey=t.dataset.scene;stepIndex=0;render()}));
    byId('prev').addEventListener('click',()=>{stop();previous()});byId('next').addEventListener('click',()=>{stop();next()});byId('restart').addEventListener('click',()=>{stop();stepIndex=0;render()});byId('play').addEventListener('click',togglePlay);
    document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();next()}else if(e.key==='ArrowLeft'){stop();previous()}else if(e.key===' '){e.preventDefault();togglePlay()}else if('1234'.includes(e.key)){stop();sceneKey=['model','auth','rbac','backup'][Number(e.key)-1];stepIndex=0;render()}});
    render();
  </script>
</body>
</html>
