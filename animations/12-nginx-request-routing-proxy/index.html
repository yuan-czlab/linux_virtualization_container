<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nginx请求路由、静态资源与反向代理</title>
  <style>
    :root{color-scheme:dark;--bg:#071019;--panel:rgba(14,27,43,.95);--panel2:#142a40;--text:#eff7ff;--muted:#9fb1c5;--line:#486078;--blue:#61a5ff;--cyan:#65dcf6;--green:#62e6a5;--yellow:#ffd166;--purple:#bd95ff;--red:#ff7180;--shadow:0 22px 58px rgba(0,0,0,.35)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:radial-gradient(circle at 12% 10%,rgba(97,165,255,.19),transparent 30%),radial-gradient(circle at 90% 88%,rgba(189,149,255,.15),transparent 30%),linear-gradient(145deg,#050a11,var(--bg) 56%,#0c1930)}
    button{font:inherit}.app{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;gap:14px;padding:22px clamp(18px,3vw,44px) 18px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.eyebrow{margin:0 0 6px;color:var(--blue);font-size:13px;font-weight:900;letter-spacing:.16em}h1{margin:0;font-size:clamp(26px,3vw,42px);line-height:1.1}.tag{padding:9px 13px;border:1px solid rgba(98,230,165,.3);border-radius:999px;color:var(--green);background:rgba(98,230,165,.08);font-size:13px}
    .tabs{display:flex;gap:9px;padding:9px;border:1px solid rgba(130,155,185,.22);border-radius:16px;background:rgba(7,15,27,.62);box-shadow:var(--shadow)}.tab{min-width:145px;padding:11px 16px;border:1px solid transparent;border-radius:11px;color:var(--muted);background:transparent;cursor:pointer;transition:.2s}.tab:hover{color:var(--text);background:rgba(255,255,255,.05)}.tab.active{color:#06151e;background:var(--blue);font-weight:900;box-shadow:0 8px 22px rgba(97,165,255,.22)}
    main{min-height:0;display:grid;grid-template-columns:minmax(630px,1.67fr) minmax(310px,.72fr);gap:14px}.visual-card,.lesson-card{border:1px solid rgba(130,155,185,.22);border-radius:20px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}.visual-card{min-height:570px;padding:22px}.visual-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.visual-top h2{margin:0;font-size:20px}.concept{padding:7px 10px;border:1px solid rgba(101,220,246,.28);border-radius:999px;color:var(--cyan);background:rgba(101,220,246,.08);font-size:12px;font-weight:800}#visual{min-height:475px;display:grid;align-content:center}
    .lesson-card{display:grid;grid-template-rows:auto auto 1fr auto;padding:22px}.counter{color:var(--blue);font-size:13px;font-weight:900;letter-spacing:.08em}.lesson-card h2{margin:8px 0 10px;font-size:clamp(22px,2.2vw,30px);line-height:1.22}.explain{margin:0;color:#ccd9e7;font-size:16px;line-height:1.72}.question{align-self:end;margin-top:18px;padding:16px;border-left:4px solid var(--yellow);border-radius:0 12px 12px 0;background:rgba(255,209,102,.08)}.question small{display:block;color:var(--yellow);font-weight:900;margin-bottom:5px}.question p{margin:0;color:#f7e8bc;line-height:1.55}
    .controls{display:grid;grid-template-columns:44px 44px 1fr 44px;gap:9px;margin-top:18px}.control{height:44px;border:1px solid rgba(134,158,192,.3);border-radius:11px;color:var(--text);background:var(--panel2);cursor:pointer}.control:hover{border-color:var(--blue)}.control.play{color:#06151e;background:var(--blue);border-color:var(--blue);font-weight:900}footer{display:flex;justify-content:space-between;gap:18px;color:var(--muted);font-size:12px}
    .board{display:grid;gap:15px}.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:9px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card{padding:15px;border:2px solid var(--line);border-radius:14px;background:#10243a;text-align:center;transition:.25s}.card strong{display:block;margin-bottom:5px}.card small{color:var(--muted)}.card.active{border-color:var(--green);background:rgba(98,230,165,.1);box-shadow:0 0 24px rgba(98,230,165,.18)}.card.blue{border-color:var(--blue)}.card.purple{border-color:var(--purple)}.card.warn{border-color:var(--yellow);background:rgba(255,209,102,.08)}.card.fail{border-color:var(--red);background:rgba(255,113,128,.09)}.card.dim{opacity:.32}.arrow{color:var(--green);font-size:25px;text-align:center;font-weight:900}.badge{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:7px;color:#06151e;background:var(--green);font-size:11px;font-weight:900}.badge.warn{background:var(--yellow)}.badge.fail{color:#fff;background:var(--red)}.terminal{padding:14px 17px;background:#03090f;border:1px solid #293d51;border-radius:12px;color:#dae7f3;font:13px/1.6 Consolas,monospace;white-space:normal}.terminal b{color:var(--green)}.terminal .hi{color:var(--yellow)}.terminal .bad{color:var(--red)}
    .flow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}.node{min-width:112px;padding:13px;border:2px solid var(--line);border-radius:12px;text-align:center;background:#10243a}.node.active{border-color:var(--green);background:rgba(98,230,165,.08)}.node.blue{border-color:var(--blue)}.node.purple{border-color:var(--purple)}.node.warn{border-color:var(--yellow)}.node.fail{border-color:var(--red)}.request{padding:10px 13px;border:2px solid var(--cyan);border-radius:999px;background:rgba(101,220,246,.08);font:12px Consolas,monospace}.servers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.server{padding:15px;border:2px solid var(--line);border-radius:13px;text-align:center}.server.match{border-color:var(--green);background:rgba(98,230,165,.08)}.server.default{border-color:var(--yellow)}.server.warn{border-color:var(--red);background:rgba(255,113,128,.08)}.configtree{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.block{padding:13px 7px;border:2px solid var(--line);border-radius:11px;text-align:center}.block.active{border-color:var(--green)}.block.warn{border-color:var(--yellow)}
    .locations{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.location{padding:15px;border:2px solid var(--line);border-radius:12px;text-align:center}.location.active{border-color:var(--green);background:rgba(98,230,165,.08)}.location.dim{opacity:.32}.mapping{display:grid;grid-template-columns:1fr 70px 1fr;gap:10px;align-items:center}.path{padding:15px;border:2px solid var(--blue);border-radius:12px;background:#10243a;font:13px/1.6 Consolas,monospace;text-align:center}.path.target{border-color:var(--purple)}.tryfiles{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}.candidate{padding:12px;border:2px solid var(--line);border-radius:10px;text-align:center}.candidate.pass{border-color:var(--green)}.candidate.fail{border-color:var(--red);opacity:.6}.filesystem{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.file{padding:13px;border:2px solid var(--line);border-radius:11px;text-align:center}.file.pass{border-color:var(--green)}.file.fail{border-color:var(--red)}
    .proxy{display:grid;grid-template-columns:1fr 100px 1fr 100px 1fr;gap:9px;align-items:center}.host{padding:16px;border:2px solid var(--blue);border-radius:13px;text-align:center;background:#10243a}.host.nginx{border-color:var(--purple)}.host.backend{border-color:var(--green)}.wire{display:grid;gap:7px}.message{padding:8px;border:2px solid var(--line);border-radius:999px;text-align:center;font-size:12px}.message.active{border-color:var(--green)}.message.fail{border-color:var(--red)}.uri-compare{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.uri{padding:14px;border:2px solid var(--line);border-radius:12px;text-align:center}.uri.active{border-color:var(--green)}.headers{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.header{padding:12px;border:2px solid var(--line);border-radius:10px;text-align:center}.header.active{border-color:var(--cyan)}
    .statusgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.status{padding:14px;border:2px solid var(--line);border-radius:12px;text-align:center}.status strong{display:block;font-size:26px}.status.ok{border-color:var(--green)}.status.deny{border-color:var(--yellow)}.status.missing{border-color:var(--blue)}.status.upstream{border-color:var(--red)}.logs{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.log{padding:14px;border:2px solid var(--line);border-radius:12px;background:#03090f;font:12px/1.55 Consolas,monospace}.log.access{border-color:var(--green)}.log.error{border-color:var(--red)}.timeline{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}.step{min-width:105px;padding:12px;border:2px solid var(--line);border-radius:11px;text-align:center}.step.active{border-color:var(--green)}.step.warn{border-color:var(--yellow)}.warning{padding:13px;border:1px solid var(--red);border-radius:11px;color:#ffc5ca;background:rgba(255,113,128,.08);text-align:center}
    @keyframes pulse{50%{box-shadow:0 0 28px rgba(98,230,165,.45);transform:scale(1.025)}}.pulse{animation:pulse 1.25s ease-in-out infinite}
    @media(max-width:1080px){.proxy{grid-template-columns:1fr 75px 1fr 75px 1fr}}
    @media(max-width:980px){.app{min-height:auto}header{align-items:flex-start;flex-direction:column}.tabs{flex-wrap:wrap}main{grid-template-columns:1fr}.visual-card{min-height:540px}}
    @media(max-width:680px){.tab{min-width:0;flex:1 1 45%}.grid2,.grid3,.servers,.configtree,.locations,.filesystem,.uri-compare,.headers,.statusgrid,.logs{grid-template-columns:1fr}.mapping,.proxy{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="app">
    <header><div><p class="eyebrow">模块三 · 第25章 · Linux实验14</p><h1>Nginx请求路由、静态资源与反向代理</h1></div><div class="tag">同一入口，根据Host与URI走向不同处理器</div></header>
    <nav class="tabs" aria-label="动画主题"><button class="tab active" data-scene="vhost">1　监听与Server</button><button class="tab" data-scene="location">2　Location与路径</button><button class="tab" data-scene="proxy">3　反向代理</button><button class="tab" data-scene="diagnosis">4　状态码与日志</button></nav>
    <main>
      <section class="visual-card"><div class="visual-top"><h2 id="visualTitle"></h2><span class="concept" id="conceptTag"></span></div><div id="visual" aria-live="polite"></div></section>
      <aside class="lesson-card"><div class="counter" id="counter"></div><div><h2 id="stepTitle"></h2><p class="explain" id="stepText"></p></div><div class="question"><small>先预测，再验证</small><p id="questionText"></p></div><div class="controls"><button class="control" id="prev">←</button><button class="control" id="restart">↺</button><button class="control play" id="play">▶ 播放</button><button class="control" id="next">→</button></div></aside>
    </main>
    <footer><span>概念模型：真实配置以nginx -T为准；每次变更先nginx -t，再reload和curl</span><span>键盘：←/→ · 空格 · 1/2/3/4切换主题</span></footer>
  </div>
  <script>
    const scenes={
      vhost:{title:'Nginx先按监听地址/端口接收连接，再按Host选择Server',tag:'listen socket → Host → server block',steps:[
        {title:'客户端先连接Nginx的监听Socket',text:'ubuntu-client把techcorp.test解析为rocky-web地址并连接TCP 80。systemd的active、firewalld的http规则和Nginx的监听分别是不同条件。',q:'firewall-cmd允许http但ss没有80监听时，请求能进入Nginx吗？',kind:'listen'},
        {title:'HTTP Host用于选择虚拟主机',text:'TCP连接只到达IP和端口；请求中的Host: techcorp.test帮助Nginx在同一listen组中选择匹配server_name的server块。DNS本身不决定Nginx返回哪个站点。',q:'两个名称解析到同一IP，是否仍可由Nginx返回不同网站？',kind:'host'},
        {title:'未匹配Host会进入该监听组的默认Server',text:'显式default_server决定默认虚拟主机；若没有显式指定，通常使用该地址端口的第一个server。server_name _只是常见的无效名称写法，本身没有“自动默认”魔力。',q:'仅写server_name _，能否保证这个server一定是80端口默认站点？',kind:'default'},
        {title:'配置层次从主配置包含到Server和Location',text:'nginx.conf中的http块可include conf.d/*.conf；server位于http中，location位于server中。分号、花括号和include路径错误都可能导致语法测试失败。',q:'只查看techcorp.conf，能否保证没有其他include定义冲突的80端口虚拟主机？',kind:'tree'},
        {title:'nginx -T比只读单个文件更接近有效配置',text:'nginx -t检查语法及引用文件，nginx -T还输出加载后的完整配置。配置测试成功只说明可解析，不证明Host、路径和业务结果正确。',q:'nginx -t成功后，为什么仍要带正确Host执行curl？',kind:'effective'}
      ]},
      location:{title:'选定Server后，URI再决定Location和资源路径',tag:'URI → location → handler/path',steps:[
        {title:'课程配置先比较精确与前缀Location',text:'请求/health精确命中location = /health；/api/users匹配/api/；其他URI落入/。真实Nginx还支持正则等规则，本实验先把精确和最长前缀关系学清楚。',q:'访问/health时，会进入location /还是location = /health？',kind:'select'},
        {title:'root把请求URI附加到根目录',text:'server的root为/srv/techcorp/www时，请求/assets/site.css通常映射为/srv/techcorp/www/assets/site.css。排查404必须写出URI和最终文件路径。',q:'请求/not-found.html时，Nginx会检查哪个完整路径？',kind:'root'},
        {title:'alias替换匹配位置，语义不同于root',text:'alias把location匹配部分映射到指定目录，斜杠处理非常重要。课程主实验使用root；看到alias配置时不能继续套用“root加完整URI”的计算方法。',q:'把root机械替换成alias而不重新计算路径，可能产生哪类结果？',kind:'alias'},
        {title:'try_files按顺序检查候选对象',text:'try_files $uri $uri/ =404先检查文件，再检查目录，均不存在才返回404。它不会凭空创建资源；变量对应的路径仍受当前root或alias语义影响。',q:'$uri不存在、$uri/也不存在时，是否会把请求自动交给首页？',kind:'tryfiles'},
        {title:'文件存在还要通过DAC与SELinux',text:'目录需要可遍历权限、文件需要可读权限，非标准站点路径还要有httpd_sys_content_t等正确类型。文件存在但访问被拒绝通常进入403和错误日志方向。',q:'ls能看到index.html但Nginx返回403，下一步只检查文件名是否足够？',kind:'access'}
      ]},
      proxy:{title:'反向代理让Nginx代表客户端访问后端服务',tag:'client → Nginx → upstream → Nginx → client',steps:[
        {title:'客户端只连接公开的Nginx入口',text:'ubuntu-client访问rocky-web:80，不直接访问5000。Nginx作为客户端再连接后端，因此后端可以只监听127.0.0.1:5000，且无需向外部开放该端口。',q:'实验14的后端只监听回环时，Ubuntu直接连接rocky-web:5000应成功吗？',kind:'topology'},
        {title:'带URI的proxy_pass会替换匹配前缀',text:'location /api/中使用proxy_pass http://127.0.0.1:5000/时，/api/被末尾/对应的URI替换，客户端/api/health.json通常变为上游/health.json。',q:'按本实验配置访问/api/时，后端通常收到/还是/api/？',kind:'slash'},
        {title:'不带URI的proxy_pass通常保留原请求URI',text:'若写成proxy_pass http://127.0.0.1:5000，代理目标不包含URI部分，在这一常见配置中上游会收到原始/api/...路径。修改斜杠不是格式美化，而是路由语义变更。',q:'后端只提供/health.json时，错误保留/api/前缀可能得到什么状态？',kind:'noslash'},
        {title:'代理头传递原始请求信息',text:'Host、X-Real-IP、X-Forwarded-For和X-Forwarded-Proto帮助后端理解原始主机、客户端和协议。后端只应信任由已知代理写入的转发头，不能无条件相信任意客户端输入。',q:'X-Forwarded-For为什么不能在所有网络边界上无条件当作真实来源？',kind:'headers'},
        {title:'上游连接仍受进程、监听和SELinux约束',text:'后端停止、地址端口错误、协议不匹配、超时或SELinux阻止httpd_t网络连接，都可能使代理失败。Nginx的80端口正常不等于后端5000正常。',q:'首页200而/api/返回502时，应先重配DNS还是检查Nginx到上游的链路？',kind:'upstream'}
      ]},
      diagnosis:{title:'状态码与两类日志共同缩小故障方向',tag:'status + access log + error log + direct evidence',steps:[
        {title:'200仍要验证响应内容是否正确',text:'HTTP 200证明请求被处理为成功响应，但可能命中了默认站点、旧配置或错误后端。验收应检查Host、响应标识、access log和实际配置。',q:'只看到status=200但页面不是TechCorp内容，能否通过验收？',kind:'status'},
        {title:'403表示请求已到达Nginx但访问被拒绝',text:'常见原因包括目录无首页且禁止列目录、路径遍历/读取权限、SELinux类型或Nginx访问规则。错误日志通常给出更具体方向。',q:'访问/private/返回403且日志写directory index is forbidden，应先创建预期首页还是开放更多防火墙端口？',kind:'forbidden'},
        {title:'404优先检查URI到文件或上游路由',text:'静态404应写出匹配location、root/alias及最终路径；代理后的404可能由后端返回。access log状态、error log和直接访问上游能帮助识别响应来源。',q:'Nginx返回404是否必然表示磁盘上缺少文件？',kind:'missing'},
        {title:'502表示Nginx没有获得有效上游响应',text:'优先检查后端进程、监听地址端口、proxy_pass协议/路径、Nginx错误日志和SELinux网络连接能力。504更偏向等待上游超时。',q:'502时仅重启Nginx，为什么可能完全无效？',kind:'badgateway'},
        {title:'安全变更闭环从语法检查到原路径复测',text:'修改前备份，做小范围编辑，执行nginx -t，reload后从ubuntu-client用正确Host访问首页、health和API，再检查access/error日志。失败则根据证据修复或回退。',q:'reload命令成功后，还缺少哪些功能与日志证据？',kind:'workflow'}
      ]}
    };
    let sceneKey='vhost',stepIndex=0,timer=null;
    const byId=id=>document.getElementById(id);
    function vhostVisual(s){
      if(s.kind==='listen')return '<div class="board"><div class="flow"><div class="node blue"><strong>ubuntu-client</strong><small>techcorp.test:80</small></div><div class="arrow">→</div><span class="request">TCP连接</span><div class="arrow">→</div><div class="node purple pulse"><strong>Nginx Socket</strong><small>0.0.0.0:80</small></div></div><div class="grid3"><div class="card active"><strong>nginx active</strong><small>进程状态</small></div><div class="card active"><strong>http allowed</strong><small>防火墙状态</small></div><div class="card active"><strong>80 LISTEN</strong><small>内核Socket</small></div></div></div>';
      if(s.kind==='host')return '<div class="board"><div class="flow"><span class="request">GET / HTTP/1.1<br>Host: techcorp.test</span><div class="arrow">→</div><div class="servers"><div class="server match pulse"><strong>server_name techcorp.test</strong><small>选中TechCorp</small></div><div class="server"><strong>server_name status.test</strong><small>不匹配</small></div></div></div><div class="terminal"><b>$</b> curl -H \'Host: techcorp.test\' http://rocky-web/</div></div>';
      if(s.kind==='default')return '<div class="board"><div class="servers"><div class="server default pulse"><strong>listen 80 default_server</strong><small>显式默认</small></div><div class="server"><strong>server_name techcorp.test</strong><small>Host匹配时选中</small></div><div class="server warn"><strong>server_name _</strong><small>普通名称写法，不自动成为默认</small></div></div><div class="terminal"><span class="hi">未匹配Host → 此listen地址/端口组的默认server</span></div></div>';
      if(s.kind==='tree')return '<div class="board"><div class="configtree"><div class="block active">nginx.conf<br><small>主配置</small></div><div class="block active">http { }<br><small>HTTP上下文</small></div><div class="block active pulse">server { }<br><small>虚拟主机</small></div><div class="block active">location { }<br><small>URI处理</small></div></div><div class="terminal">http { include /etc/nginx/conf.d/*.conf; }</div></div>';
      return '<div class="board"><div class="timeline"><div class="step active">编辑小范围配置</div><div class="arrow">→</div><div class="step active pulse">nginx -t</div><div class="arrow">→</div><div class="step active">nginx -T</div><div class="arrow">→</div><div class="step warn">尚未证明业务</div></div><div class="terminal"><b>#</b> nginx -t　<span class="hi">syntax is ok / test is successful</span><br><b>#</b> nginx -T | less</div></div>';
    }
    function locationVisual(s){
      if(s.kind==='select')return '<div class="board"><div class="locations"><div class="location active pulse"><strong>location = /health</strong><small>精确匹配/health</small></div><div class="location"><strong>location /api/</strong><small>API前缀</small></div><div class="location dim"><strong>location /</strong><small>普通后备前缀</small></div></div><div class="terminal"><span class="hi">URI /health → 精确location = /health</span></div></div>';
      if(s.kind==='root')return '<div class="board"><div class="mapping"><div class="path"><strong>root</strong><br>/srv/techcorp/www</div><div class="arrow">+</div><div class="path"><strong>URI</strong><br>/assets/site.css</div></div><div class="row"><span class="arrow">↓</span></div><div class="path target pulse">/srv/techcorp/www/assets/site.css</div></div>';
      if(s.kind==='alias')return '<div class="board"><div class="grid2"><div class="card active"><strong>root</strong><small>根目录 + 完整URI</small><div class="terminal">root /srv/www;<br>/img/a.png → /srv/www/img/a.png</div></div><div class="card warn pulse"><strong>alias</strong><small>用目标路径替换匹配位置</small><div class="terminal">location /img/ {<br> alias /data/pictures/; }</div></div></div></div>';
      if(s.kind==='tryfiles')return '<div class="board"><div class="tryfiles"><div class="candidate fail">$uri<br><small>文件不存在</small></div><div class="arrow">→</div><div class="candidate fail">$uri/<br><small>目录不存在</small></div><div class="arrow">→</div><div class="candidate pass pulse">=404<br><small>明确返回</small></div></div><div class="terminal">try_files $uri $uri/ =404;</div></div>';
      return '<div class="board"><div class="filesystem"><div class="file pass"><strong>路径存在</strong><small>/srv/techcorp/www/index.html</small></div><div class="file fail"><strong>DAC</strong><small>父目录x / 文件r不足</small></div><div class="file fail pulse"><strong>SELinux</strong><small>类型不允许httpd_t读取</small></div></div><div class="terminal"><b>#</b> namei -l /srv/techcorp/www/index.html<br><b>#</b> ls -lZ /srv/techcorp/www/index.html</div></div>';
    }
    function proxyVisual(s){
      if(s.kind==='topology')return '<div class="board"><div class="proxy"><div class="host"><strong>ubuntu-client</strong><small>只访问80</small></div><div class="wire"><div class="message active">HTTP :80 →</div></div><div class="host nginx pulse"><strong>Nginx</strong><small>公开入口</small></div><div class="wire"><div class="message active">HTTP :5000 →</div></div><div class="host backend"><strong>本机后端</strong><small>127.0.0.1:5000</small></div></div><div class="terminal"><span class="hi">5000无需向ubuntu-client开放</span></div></div>';
      if(s.kind==='slash')return '<div class="board"><div class="uri-compare"><div class="uri"><strong>客户端URI</strong><br>/api/health.json</div><div class="uri active pulse"><strong>上游URI</strong><br>/health.json</div></div><div class="terminal">location /api/ { proxy_pass http://127.0.0.1:5000<span class="hi">/</span>; }</div></div>';
      if(s.kind==='noslash')return '<div class="board"><div class="uri-compare"><div class="uri"><strong>客户端URI</strong><br>/api/health.json</div><div class="uri active pulse"><strong>上游URI</strong><br>/api/health.json</div></div><div class="terminal">location /api/ { proxy_pass http://127.0.0.1:5000; }<br><span class="hi">此处代理目标没有URI部分</span></div></div>';
      if(s.kind==='headers')return '<div class="board"><div class="headers"><div class="header active"><strong>Host</strong><small>原始主机</small></div><div class="header active pulse"><strong>X-Real-IP</strong><small>直接客户端地址</small></div><div class="header active"><strong>X-Forwarded-For</strong><small>代理链地址</small></div></div><div class="terminal">proxy_set_header Host $host;<br>proxy_set_header X-Real-IP $remote_addr;<br>proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;</div></div>';
      return '<div class="board"><div class="proxy"><div class="host"><strong>客户端</strong><small>请求/api/</small></div><div class="wire"><div class="message active">80正常</div></div><div class="host nginx"><strong>Nginx</strong><small>代理处理器</small></div><div class="wire"><div class="message fail pulse">connect() failed</div></div><div class="host backend"><strong>上游</strong><small>进程停/端口错/策略拒绝</small></div></div><div class="terminal"><span class="bad">前端入口正常 ≠ 上游链路正常</span></div></div>';
    }
    function diagnosisVisual(s){
      if(s.kind==='status')return '<div class="board"><div class="statusgrid"><div class="status ok pulse"><strong>200</strong><small>处理成功<br>仍核对内容</small></div><div class="status deny"><strong>403</strong><small>访问被拒绝</small></div><div class="status missing"><strong>404</strong><small>资源/路由不存在</small></div><div class="status upstream"><strong>502</strong><small>上游响应失败</small></div></div><div class="terminal"><b>$</b> curl -sS -D- -H \'Host: techcorp.test\' http://rocky-web/</div></div>';
      if(s.kind==='forbidden')return '<div class="board"><div class="flow"><span class="request">GET /private/</span><div class="arrow">→</div><div class="node purple">Nginx已收到</div><div class="arrow">→</div><div class="node fail pulse"><strong>403</strong><small>directory index forbidden</small></div></div><div class="logs"><div class="log access">GET /private/ HTTP/1.1" <b>403</b></div><div class="log error">directory index of ".../private/" is forbidden</div></div></div>';
      if(s.kind==='missing')return '<div class="board"><div class="grid2"><div class="card fail"><strong>静态404</strong><small>location/root/alias/最终路径</small></div><div class="card warn pulse"><strong>上游404</strong><small>代理成功，但后端路由不存在</small></div></div><div class="terminal"><b>#</b> tail /var/log/nginx/techcorp-access.log<br><b>#</b> tail /var/log/nginx/techcorp-error.log<br><b>$</b> curl http://127.0.0.1:5000/目标路径</div></div>';
      if(s.kind==='badgateway')return '<div class="board"><div class="proxy"><div class="host"><strong>客户端</strong><small>得到502</small></div><div class="wire"><div class="message active">请求到Nginx</div></div><div class="host nginx"><strong>Nginx</strong><small>80正常</small></div><div class="wire"><div class="message fail pulse">上游无有效响应</div></div><div class="host backend"><strong>127.0.0.1:5000</strong><small>检查进程/监听/协议/SELinux</small></div></div><div class="terminal"><span class="bad">error.log: connect() failed ... while connecting to upstream</span></div></div>';
      return '<div class="board"><div class="timeline"><div class="step active">备份/编辑</div><div class="arrow">→</div><div class="step active">nginx -t</div><div class="arrow">→</div><div class="step active">reload</div><div class="arrow">→</div><div class="step active pulse">Ubuntu curl</div><div class="arrow">→</div><div class="step active">access/error日志</div></div><div class="terminal"><span class="hi">语法、运行状态、功能和日志缺一不可</span></div></div>';
    }
    function render(){
      const scene=scenes[sceneKey],step=scene.steps[stepIndex];
      byId('visualTitle').textContent=scene.title;byId('conceptTag').textContent=scene.tag;
      byId('counter').textContent='第 '+(stepIndex+1)+' / '+scene.steps.length+' 步';
      byId('stepTitle').textContent=step.title;byId('stepText').textContent=step.text;byId('questionText').textContent=step.q;
      byId('visual').innerHTML=sceneKey==='vhost'?vhostVisual(step):sceneKey==='location'?locationVisual(step):sceneKey==='proxy'?proxyVisual(step):diagnosisVisual(step);
      document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.scene===sceneKey));
    }
    function stop(){if(timer){clearInterval(timer);timer=null}byId('play').textContent='▶ 播放'}
    function next(){const n=scenes[sceneKey].steps.length;stepIndex=stepIndex<n-1?stepIndex+1:0;render()}
    function previous(){const n=scenes[sceneKey].steps.length;stepIndex=(stepIndex-1+n)%n;render()}
    function togglePlay(){if(timer){stop();return}byId('play').textContent='Ⅱ 暂停';timer=setInterval(next,4300)}
    document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{stop();sceneKey=t.dataset.scene;stepIndex=0;render()}));
    byId('prev').addEventListener('click',()=>{stop();previous()});byId('next').addEventListener('click',()=>{stop();next()});byId('restart').addEventListener('click',()=>{stop();stepIndex=0;render()});byId('play').addEventListener('click',togglePlay);
    document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();next()}else if(e.key==='ArrowLeft'){stop();previous()}else if(e.key===' '){e.preventDefault();togglePlay()}else if('1234'.includes(e.key)){stop();sceneKey=['vhost','location','proxy','diagnosis'][Number(e.key)-1];stepIndex=0;render()}});
    render();
  </script>
</body>
</html>
