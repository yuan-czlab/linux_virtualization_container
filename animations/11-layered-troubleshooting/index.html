  <style>
    :root{color-scheme:dark;--bg:#071019;--panel:rgba(14,27,43,.95);--panel2:#142a40;--text:#eff7ff;--muted:#9fb1c5;--line:#486078;--blue:#61a5ff;--cyan:#65dcf6;--green:#62e6a5;--yellow:#ffd166;--purple:#bd95ff;--red:#ff7180;--shadow:0 22px 58px rgba(0,0,0,.35)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:radial-gradient(circle at 12% 10%,rgba(97,165,255,.19),transparent 30%),radial-gradient(circle at 90% 88%,rgba(189,149,255,.15),transparent 30%),linear-gradient(145deg,#050a11,var(--bg) 56%,#0c1930)}
    button{font:inherit}.app{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;gap:14px;padding:22px clamp(18px,3vw,44px) 18px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.eyebrow{margin:0 0 6px;color:var(--blue);font-size:13px;font-weight:900;letter-spacing:.16em}h1{margin:0;font-size:clamp(26px,3vw,42px);line-height:1.1}.tag{padding:9px 13px;border:1px solid rgba(98,230,165,.3);border-radius:999px;color:var(--green);background:rgba(98,230,165,.08);font-size:13px}
    .tabs{display:flex;gap:9px;padding:9px;border:1px solid rgba(130,155,185,.22);border-radius:16px;background:rgba(7,15,27,.62);box-shadow:var(--shadow)}.tab{min-width:145px;padding:11px 16px;border:1px solid transparent;border-radius:11px;color:var(--muted);background:transparent;cursor:pointer;transition:.2s}.tab:hover{color:var(--text);background:rgba(255,255,255,.05)}.tab.active{color:#06151e;background:var(--blue);font-weight:900;box-shadow:0 8px 22px rgba(97,165,255,.22)}
    main{min-height:0;display:grid;grid-template-columns:minmax(630px,1.67fr) minmax(310px,.72fr);gap:14px}.visual-card,.lesson-card{border:1px solid rgba(130,155,185,.22);border-radius:20px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}.visual-card{min-height:570px;padding:22px}.visual-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.visual-top h2{margin:0;font-size:20px}.concept{padding:7px 10px;border:1px solid rgba(101,220,246,.28);border-radius:999px;color:var(--cyan);background:rgba(101,220,246,.08);font-size:12px;font-weight:800}#visual{min-height:475px;display:grid;align-content:center}
    .lesson-card{display:grid;grid-template-rows:auto auto 1fr auto;padding:22px}.counter{color:var(--blue);font-size:13px;font-weight:900;letter-spacing:.08em}.lesson-card h2{margin:8px 0 10px;font-size:clamp(22px,2.2vw,30px);line-height:1.22}.explain{margin:0;color:#ccd9e7;font-size:16px;line-height:1.72}.question{align-self:end;margin-top:18px;padding:16px;border-left:4px solid var(--yellow);border-radius:0 12px 12px 0;background:rgba(255,209,102,.08)}.question small{display:block;color:var(--yellow);font-weight:900;margin-bottom:5px}.question p{margin:0;color:#f7e8bc;line-height:1.55}
    .controls{display:grid;grid-template-columns:44px 44px 1fr 44px;gap:9px;margin-top:18px}.control{height:44px;border:1px solid rgba(134,158,192,.3);border-radius:11px;color:var(--text);background:var(--panel2);cursor:pointer}.control:hover{border-color:var(--blue)}.control.play{color:#06151e;background:var(--blue);border-color:var(--blue);font-weight:900}footer{display:flex;justify-content:space-between;gap:18px;color:var(--muted);font-size:12px}
    .board{display:grid;gap:15px}.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:9px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card{padding:15px;border:2px solid var(--line);border-radius:14px;background:#10243a;text-align:center;transition:.25s}.card strong{display:block;margin-bottom:5px}.card small{color:var(--muted)}.card.active{border-color:var(--green);background:rgba(98,230,165,.1);box-shadow:0 0 24px rgba(98,230,165,.18)}.card.blue{border-color:var(--blue)}.card.purple{border-color:var(--purple)}.card.warn{border-color:var(--yellow);background:rgba(255,209,102,.08)}.card.fail{border-color:var(--red);background:rgba(255,113,128,.09)}.card.dim{opacity:.32}.arrow{color:var(--green);font-size:25px;text-align:center;font-weight:900}.badge{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:7px;color:#06151e;background:var(--green);font-size:11px;font-weight:900}.badge.warn{background:var(--yellow)}.badge.fail{color:#fff;background:var(--red)}.terminal{padding:14px 17px;background:#03090f;border:1px solid #293d51;border-radius:12px;color:#dae7f3;font:13px/1.6 Consolas,monospace;white-space:normal}.terminal b{color:var(--green)}.terminal .hi{color:var(--yellow)}.terminal .bad{color:var(--red)}
    .ticket{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field{padding:13px;border:2px solid var(--line);border-radius:11px;text-align:center}.field strong{display:block;color:var(--cyan)}.field.missing{border-color:var(--red);color:#ffc5ca}.scope{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.scope div{padding:15px;border:2px solid var(--line);border-radius:12px;text-align:center}.scope .active{border-color:var(--green)}.scope .warn{border-color:var(--yellow)}.layers{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.layer{padding:12px 5px;border:2px solid var(--line);border-radius:10px;text-align:center;font-size:12px}.layer.pass{border-color:var(--green);background:rgba(98,230,165,.06)}.layer.fail{border-color:var(--red);background:rgba(255,113,128,.08)}.layer.current{border-color:var(--yellow)}.layer.dim{opacity:.3}
    .compare{display:grid;grid-template-columns:1fr 70px 1fr;gap:10px;align-items:center}.host{padding:16px;border:2px solid var(--blue);border-radius:14px;text-align:center;background:#10243a}.host.server{border-color:var(--purple)}.checks{display:grid;gap:7px}.check{display:flex;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px}.check.pass{border-color:var(--green)}.check.fail{border-color:var(--red);color:#ffc5ca}.check.current{border-color:var(--yellow)}.decision{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}.step{min-width:108px;padding:12px;border:2px solid var(--line);border-radius:11px;text-align:center}.step.active{border-color:var(--green)}.step.fail{border-color:var(--red)}.step.warn{border-color:var(--yellow)}
    .pattern{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.signal{padding:12px;border:2px solid var(--line);border-radius:10px;text-align:center}.signal.pass{border-color:var(--green)}.signal.fail{border-color:var(--red)}.signal.na{opacity:.3}.hypothesis{padding:14px;border-left:4px solid var(--yellow);border-radius:0 11px 11px 0;background:rgba(255,209,102,.08);color:#f7e8bc;text-align:center}.report{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.report div{padding:12px 6px;border:2px solid var(--line);border-radius:10px;text-align:center}.report .active{border-color:var(--green)}.loop{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.loop .step{min-width:0}.warning{padding:13px;border:1px solid var(--red);border-radius:11px;color:#ffc5ca;background:rgba(255,113,128,.08);text-align:center}
    @keyframes pulse{50%{box-shadow:0 0 28px rgba(98,230,165,.45);transform:scale(1.025)}}.pulse{animation:pulse 1.25s ease-in-out infinite}
    @media(max-width:1080px){.layers{grid-template-columns:repeat(4,1fr)}}
    @media(max-width:980px){.app{min-height:auto}header{align-items:flex-start;flex-direction:column}.tabs{flex-wrap:wrap}main{grid-template-columns:1fr}.visual-card{min-height:540px}}
    @media(max-width:680px){.tab{min-width:0;flex:1 1 45%}.grid2,.grid3,.ticket,.scope,.layers,.pattern,.report,.loop{grid-template-columns:1fr}.compare{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>

<body>
  <div class="app">
    <header><div><p class="eyebrow">模块二 · 第24章 · Linux实验13</p><h1>Linux网络与访问分层故障推理</h1></div><div class="tag">先缩小范围，再修改一个对象</div></header>
    <nav class="tabs" aria-label="动画主题"><button class="tab active" data-scene="intake">1　受理与基线</button><button class="tab" data-scene="evidence">2　分层证据</button><button class="tab" data-scene="patterns">3　故障模式</button><button class="tab" data-scene="closure">4　修复闭环</button></nav>
    <main>
      <section class="visual-card"><div class="visual-top"><h2 id="visualTitle"></h2><span class="concept" id="conceptTag"></span></div><div id="visual" aria-live="polite"></div></section>
      <aside class="lesson-card"><div class="counter" id="counter"></div><div><h2 id="stepTitle"></h2><p class="explain" id="stepText"></p></div><div class="question"><small>选择下一条证据</small><p id="questionText"></p></div><div class="controls"><button class="control" id="prev">←</button><button class="control" id="restart">↺</button><button class="control play" id="play">▶ 播放</button><button class="control" id="next">→</button></div></aside>
    </main>
    <footer><span>概念模型：错误现象提供方向但不是唯一结论；命令输出、日志和端到端复测共同证明根因</span><span>键盘：←/→ · 空格 · 1/2/3/4切换主题</span></footer>
  </div>
  <script>
    const scenes={
      intake:{title:'把“访问不了”转换成可重复、可比较的问题',tag:'who → target → method → error → scope',steps:[
        {title:'先补全访问的五个要素',text:'记录谁从哪台客户端访问、目标名称或IP、协议与端口、完整操作和原始错误，并写下发生时间。缺少目标和方法时，不能直接进入服务器修改配置。',q:'只收到“服务器坏了”，第一步应该执行systemctl restart还是补充哪些信息？',kind:'ticket'},
        {title:'区分一个客户端、一个服务还是整机范围',text:'比较Ubuntu与Rocky本机、名称与IP、SSH与HTTP。差异能快速缩小客户端侧、解析层、单服务或整机网络范围，但每个对照应保持其他变量一致。',q:'只有一名学生失败、其他同学成功时，应优先检查公共服务器还是该客户端差异？',kind:'scope'},
        {title:'故障前必须有成功基线',text:'基线记录地址、路由、活动连接、服务状态、监听、firewalld、SELinux及客户端SSH/HTTP结果。没有基线就无法判断当前输出是异常还是环境原本如此。',q:'教师注入故障前，为什么必须先让学生保存并复测正常链路？',kind:'baseline'},
        {title:'最近变更是线索，不是未经验证的结论',text:'询问网络配置、软件更新、服务重启、规则或文件变更。时间上相关可以形成假设，但仍需命令输出和日志证明因果，不能直接撤销所有近期操作。',q:'刚修改过防火墙后HTTP失败，能否跳过监听和活动zone检查直接认定防火墙是根因？',kind:'change'},
        {title:'为每次检查写出预期和分支',text:'执行命令前说明“若结果A则检查哪层，若结果B则检查哪层”。这样排障是检验假设，而不是把整页命令机械运行后凭感觉找异常。',q:'在执行getent之前，应先写出成功解析和错误解析分别指向什么？',kind:'hypothesis'}
      ]},
      evidence:{title:'沿链路选择能排除或确认一层的最小证据',tag:'name → route → TCP → service → protection → app',steps:[
        {title:'先验证名称最终解析成哪个地址',text:'getent经过系统NSS链，适合验证应用实际使用的名称结果。再与课程ROCKY_SERVER_IP比较；dig只查DNS，不能代替hosts和NSS结果。',q:'名称访问失败但IP访问成功，下一条最有价值的检查是什么？',kind:'name'},
        {title:'路由检查要观察出口、下一跳和源地址',text:'ip route get目标IP直接显示内核为该目标选择的路径。ping可作辅助，但ICMP可能被过滤，不能把ping失败单独当作TCP服务不可达的充分证据。',q:'要知道Ubuntu访问Rocky时实际使用哪个源IP，应该查看哪条输出？',kind:'route'},
        {title:'用目标协议和端口检查连接层',text:'nc -vz检查TCP握手，curl或ssh继续验证应用协议。refused通常提示目标可达但无监听或主动拒绝；timeout提示未收到有效响应，二者都是线索而不是唯一根因。',q:'nc 8080成功而curl返回404，排障应继续停留在网络层吗？',kind:'tcp'},
        {title:'服务状态、进程和监听必须交叉验证',text:'systemctl显示Unit状态，journal解释启动失败，ss证明内核当前监听的协议、地址、端口和进程。本机curl再区分应用是否能在服务器内部响应。',q:'m2-web显示active，但ss没有8080监听，应该相信哪一个单独结果？',kind:'service'},
        {title:'防护、权限和应用日志位于更后层',text:'确认服务和监听后，检查实际zone规则、SELinux模式与上下文、DAC路径权限、AVC和应用日志。只有到达HTTP层才会得到可解释的状态码。',q:'Rocky本机成功、Ubuntu超时且0.0.0.0监听存在，下一步优先核对什么？',kind:'protection'}
      ]},
      patterns:{title:'证据组合比单个错误词更能定位故障层',tag:'observable pattern → bounded hypothesis',steps:[
        {title:'SSH和HTTP同时失败通常指向共同基础层',text:'若名称/IP访问、22和8080都失败，先检查客户端网络、服务器地址、活动连接和路由，而不是同时修改两个应用服务。共同失败帮助找到共享依赖。',q:'两种服务同时不可达时，先分别重装sshd和Python服务是否合理？',kind:'all'},
        {title:'IP成功而名称失败指向解析差异',text:'直接IP连接成功证明部分网络、TCP和服务链路可用；getent若返回错误地址，应修复hosts或DNS。HTTP虚拟主机还依赖Host，必要时用curl --resolve固定地址同时保留名称。',q:'用IP访问得到默认站点，能否直接证明原域名对应的虚拟主机配置正确？',kind:'dns'},
        {title:'Connection refused常与监听或服务状态相关',text:'目标IP可达、TCP迅速被拒绝时，优先在服务端检查Unit、journal和目标地址上的监听；防火墙reject也可能产生类似结果，所以不能只凭一个词下结论。',q:'22端口refused时，第一轮应先改firewalld还是检查sshd与ss？',kind:'refused'},
        {title:'本机成功、外部失败要比较监听与入口策略',text:'回环监听、错误目标IP、firewalld活动zone或来源规则都可能产生这一模式。先用ss确认监听地址，再核对客户端路由和实际zone规则。',q:'本机curl 127.0.0.1成功时，为什么仍必须查看ss中的Local Address？',kind:'external'},
        {title:'HTTP 403或SSH密钥拒绝已进入更高层',text:'403通常说明请求到达Web应用，应检查路径、DAC、SELinux和应用配置；SSH密钥拒绝应关联ssh -vv、authorized_keys权限/标签和sshd日志。扩大端口开放通常无助。',q:'收到HTTP 403后继续开放更多防火墙端口，能解决文件访问拒绝吗？',kind:'permission'}
      ]},
      closure:{title:'根因修复后还要证明原链路与最终基线完整',tag:'evidence → one change → original retest → final state',steps:[
        {title:'一次只修改一个被证据支持的对象',text:'保存原值和回退命令，再做最小变更。若同时改DNS、监听、防火墙和权限，即使恢复也无法知道根因，也容易引入第二个故障。',q:'一次修改四层后访问成功，报告能否准确证明哪一项是根因？',kind:'one'},
        {title:'修复动作必须对应根因层',text:'服务停止就验证配置后启动；回环监听就调整业务需要的监听范围；缺失规则就最小开放；错误标签用持久映射和restorecon。重启整机不是通用修复。',q:'SELinux标签错误时，为什么systemctl restart nginx不是根因修复？',kind:'match'},
        {title:'从原客户端按原名称、协议和端口复测',text:'服务端本机测试只能证明局部。必须回到最初报告问题的ubuntu-client，使用原始访问方式重试，并保存退出状态、响应内容和对应服务端日志。',q:'改完监听后只在Rocky执行curl 127.0.0.1，缺少哪项关键验证？',kind:'original'},
        {title:'继续检查完整链路，防止第二故障被遮蔽',text:'第一个问题修复后，下一层问题可能才显现。重新检查SSH、HTTP、监听、firewalld、SELinux和失败Unit，确认没有为修复临时留下宽规则或Permissive状态。',q:'名称修好后变成Connection refused，是同一个故障没有修好还是暴露了下一层问题？',kind:'second'},
        {title:'报告形成可复核的证据闭环',text:'记录现象与范围、正常基线、检查证据、判断、根因、最小修复、原路径复测、回退与预防。命令原始输出和时间应支持结论，而不是只写“已解决”。',q:'一份只包含修复命令和成功截图的报告，还缺少哪些关键部分？',kind:'report'}
      ]}
    };
    let sceneKey='intake',stepIndex=0,timer=null;
    const byId=id=>document.getElementById(id);
    function intakeVisual(s){
      if(s.kind==='ticket')return '<div class="board"><div class="ticket"><div class="field missing"><strong>谁</strong>ubuntu-client?</div><div class="field missing"><strong>目标</strong>名称/IP?</div><div class="field missing"><strong>方式</strong>协议/端口?</div><div class="field missing pulse"><strong>现象</strong>原始错误/时间?</div></div><div class="terminal"><span class="bad">“服务器访问不了”还不是可执行的故障描述</span></div></div>';
      if(s.kind==='scope')return '<div class="board"><div class="scope"><div class="active"><strong>单客户端</strong><small>客户端配置、解析、路由差异</small></div><div class="warn"><strong>单服务</strong><small>Unit、监听、规则、应用</small></div><div><strong>整机/多服务</strong><small>地址、连接、路由、共同防护</small></div></div><div class="terminal"><span class="hi">对照实验每次只改变客户端、目标或协议中的一个变量</span></div></div>';
      if(s.kind==='baseline')return '<div class="board"><div class="layers"><div class="layer pass">名称 ✓</div><div class="layer pass">路由 ✓</div><div class="layer pass">TCP ✓</div><div class="layer pass">服务 ✓</div><div class="layer pass">监听 ✓</div><div class="layer pass">防护 ✓</div><div class="layer pass pulse">应用 ✓</div></div><div class="grid2"><div class="card active"><strong>Rocky基线</strong><small>状态、监听、规则、SELinux</small></div><div class="card active"><strong>Ubuntu基线</strong><small>SSH与HTTP端到端成功</small></div></div></div>';
      if(s.kind==='change')return '<div class="board"><div class="decision"><div class="step active">最近修改firewalld</div><div class="arrow">→</div><div class="step warn pulse">形成假设</div><div class="arrow">→</div><div class="step active">查询实际zone/规则</div><div class="arrow">→</div><div class="step">决定是否支持</div></div><div class="terminal"><span class="hi">时间相关 ≠ 已证明因果</span></div></div>';
      return '<div class="board"><div class="grid2"><div class="card warn"><strong>检查前预测</strong><small>getent正确 → 继续路由/TCP<br>getent错误 → 解析层证据</small></div><div class="card active pulse"><strong>运行并记录</strong><small>输出、时间、退出状态<br>选择下一层</small></div></div><div class="terminal"><b>$</b> getent hosts rocky-server.test</div></div>';
    }
    function evidenceVisual(s){
      if(s.kind==='name')return '<div class="board"><div class="compare"><div class="host"><strong>输入名称</strong><small>rocky-server.test</small></div><div class="arrow">→</div><div class="host server"><strong>getent结果</strong><small class="hi">192.168.200.10</small></div></div><div class="grid2"><div class="card active"><strong>与课程IP一致</strong><small>继续路由和端口</small></div><div class="card fail"><strong>错误/无结果</strong><small>检查NSS、hosts、DNS</small></div></div><div class="terminal"><b>$</b> getent hosts rocky-server.test</div></div>';
      if(s.kind==='route')return '<div class="board"><div class="checks"><div class="check pass"><span>目标</span><strong>192.168.200.10</strong></div><div class="check pass"><span>出口接口</span><strong>ens33</strong></div><div class="check pass pulse"><span>实际源地址</span><strong>192.168.200.30</strong></div><div class="check"><span>下一跳</span><strong>直连或网关</strong></div></div><div class="terminal"><b>$</b> ip route get "$ROCKY_SERVER_IP"</div></div>';
      if(s.kind==='tcp')return '<div class="board"><div class="grid3"><div class="card active"><strong>succeeded</strong><small>TCP握手成功<br>继续应用协议</small></div><div class="card fail"><strong>refused</strong><small>无监听/主动拒绝等<br>查服务端</small></div><div class="card warn pulse"><strong>timeout</strong><small>无有效响应<br>查路由/防火墙/目标</small></div></div><div class="terminal"><b>$</b> nc -vz -w 3 "$ROCKY_SERVER_IP" 8080</div></div>';
      if(s.kind==='service')return '<div class="board"><div class="grid3"><div class="card active"><strong>systemctl</strong><small>Unit状态与退出原因</small></div><div class="card active pulse"><strong>ss -lntp</strong><small>真实协议、地址、端口、进程</small></div><div class="card active"><strong>journalctl</strong><small>启动与运行日志</small></div></div><div class="terminal"><b>#</b> systemctl status m2-web --no-pager<br><b>#</b> ss -lntp | grep :8080<br><b>#</b> journalctl -u m2-web -n 30</div></div>';
      return '<div class="board"><div class="layers"><div class="layer pass">名称 ✓</div><div class="layer pass">路由 ✓</div><div class="layer pass">TCP到主机 ✓</div><div class="layer pass">服务 ✓</div><div class="layer pass">监听 ✓</div><div class="layer current pulse">防护/DAC/MAC</div><div class="layer dim">应用日志</div></div><div class="terminal"><b>#</b> firewall-cmd --get-active-zones<br><b>#</b> getenforce; ls -lZ /srv/m2-web<br><b>#</b> ausearch -m AVC -ts recent</div></div>';
    }
    function patternsVisual(s){
      if(s.kind==='all')return '<div class="board"><div class="pattern"><div class="signal fail">名称/IP<br>失败</div><div class="signal fail">SSH/22<br>失败</div><div class="signal fail">HTTP/8080<br>失败</div><div class="signal na">应用日志<br>可能无请求</div></div><div class="hypothesis pulse">优先假设：客户端网络、服务器地址/连接或共同路由层</div></div>';
      if(s.kind==='dns')return '<div class="board"><div class="pattern"><div class="signal fail">名称访问<br>错误目标/失败</div><div class="signal pass">IP访问<br>TCP成功</div><div class="signal pass">服务监听<br>正常</div><div class="signal na">防护<br>部分已证明</div></div><div class="hypothesis pulse">优先检查：getent、hosts、DNS；虚拟主机测试保留正确Host</div><div class="terminal"><b>$</b> curl --resolve rocky-server.test:8080:"$ROCKY_SERVER_IP" http://rocky-server.test:8080/</div></div>';
      if(s.kind==='refused')return '<div class="board"><div class="pattern"><div class="signal pass">目标IP<br>可达</div><div class="signal fail pulse">TCP/22<br>refused</div><div class="signal fail">sshd状态<br>inactive</div><div class="signal fail">22监听<br>不存在</div></div><div class="hypothesis">证据支持：服务停止或启动失败；先查配置与journal，再启动</div></div>';
      if(s.kind==='external')return '<div class="board"><div class="pattern"><div class="signal pass">Rocky本机<br>curl成功</div><div class="signal fail">Ubuntu<br>访问失败</div><div class="signal fail pulse">监听<br>127.0.0.1:8080</div><div class="signal pass">服务状态<br>active</div></div><div class="hypothesis">证据支持：监听范围不包含Rocky网卡地址；还应核对入口规则</div></div>';
      return '<div class="board"><div class="grid2"><div class="card fail"><strong>HTTP 403</strong><small>已到Web层<br>查路径/DAC/SELinux/配置</small></div><div class="card fail pulse"><strong>SSH publickey denied</strong><small>已到认证层<br>查客户端尝试、权限/标签、sshd日志</small></div></div><div class="warning">高层协议已经响应时，不要退回去盲目扩大网络开放</div></div>';
    }
    function closureVisual(s){
      if(s.kind==='one')return '<div class="board"><div class="decision"><div class="step active">保存原值</div><div class="arrow">→</div><div class="step active pulse">修改一个对象</div><div class="arrow">→</div><div class="step active">观察结果变化</div><div class="arrow">→</div><div class="step">保留或回退</div></div><div class="terminal"><span class="bad">多层同时修改会破坏因果判断并增加新故障</span></div></div>';
      if(s.kind==='match')return '<div class="board"><div class="grid3"><div class="card active"><strong>服务停止</strong><small>语法/日志确认后启动</small></div><div class="card active"><strong>规则缺失</strong><small>正确zone最小开放</small></div><div class="card active pulse"><strong>标签错误</strong><small>fcontext + restorecon</small></div></div><div class="terminal"><span class="hi">修复对象必须和证据证明的根因位于同一层</span></div></div>';
      if(s.kind==='original')return '<div class="board"><div class="compare"><div class="host pulse"><strong>原ubuntu-client</strong><small>原名称、协议、端口、账号</small></div><div class="arrow">→</div><div class="host server"><strong>原目标服务</strong><small>成功内容 + 退出0 + 对应日志</small></div></div><div class="terminal"><b>$</b> curl --fail http://rocky-server.test:8080/<br><b>$</b> ssh rocky-server "hostname; uptime"</div></div>';
      if(s.kind==='second')return '<div class="board"><div class="layers"><div class="layer pass">名称已修复 ✓</div><div class="layer pass">路由 ✓</div><div class="layer fail pulse">TCP refused</div><div class="layer current">服务/监听</div><div class="layer dim">防护</div><div class="layer dim">SELinux</div><div class="layer dim">应用</div></div><div class="hypothesis">修复第一层后出现新现象：继续用新证据推进，不回滚正确修复</div></div>';
      return '<div class="board"><div class="report"><div class="active">现象/范围</div><div class="active">证据/判断</div><div class="active">根因/修复</div><div class="active pulse">原路径复测</div><div>回退方法</div><div>最终基线</div><div>预防措施</div><div>原始输出/时间</div></div><div class="terminal"><span class="hi">完整闭环：别人能根据报告复现你的判断</span></div></div>';
    }
    function render(){
      const scene=scenes[sceneKey],step=scene.steps[stepIndex];
      byId('visualTitle').textContent=scene.title;byId('conceptTag').textContent=scene.tag;
      byId('counter').textContent='第 '+(stepIndex+1)+' / '+scene.steps.length+' 步';
      byId('stepTitle').textContent=step.title;byId('stepText').textContent=step.text;byId('questionText').textContent=step.q;
      byId('visual').innerHTML=sceneKey==='intake'?intakeVisual(step):sceneKey==='evidence'?evidenceVisual(step):sceneKey==='patterns'?patternsVisual(step):closureVisual(step);
      document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.scene===sceneKey));
    }
    function stop(){if(timer){clearInterval(timer);timer=null}byId('play').textContent='▶ 播放'}
    function next(){const n=scenes[sceneKey].steps.length;stepIndex=stepIndex<n-1?stepIndex+1:0;render()}
    function previous(){const n=scenes[sceneKey].steps.length;stepIndex=(stepIndex-1+n)%n;render()}
    function togglePlay(){if(timer){stop();return}byId('play').textContent='Ⅱ 暂停';timer=setInterval(next,4300)}
    document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{stop();sceneKey=t.dataset.scene;stepIndex=0;render()}));
    byId('prev').addEventListener('click',()=>{stop();previous()});byId('next').addEventListener('click',()=>{stop();next()});byId('restart').addEventListener('click',()=>{stop();stepIndex=0;render()});byId('play').addEventListener('click',togglePlay);
    document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();next()}else if(e.key==='ArrowLeft'){stop();previous()}else if(e.key===' '){e.preventDefault();togglePlay()}else if('1234'.includes(e.key)){stop();sceneKey=['intake','evidence','patterns','closure'][Number(e.key)-1];stepIndex=0;render()}});
    render();
  </script>
</body>
</html>
