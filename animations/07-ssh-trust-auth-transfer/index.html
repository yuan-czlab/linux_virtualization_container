<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>SSH信任、认证与文件传输</title>
  <style>
    :root{color-scheme:dark;--bg:#071019;--panel:rgba(14,27,43,.95);--panel2:#142a40;--text:#eff7ff;--muted:#9fb1c5;--line:#486078;--blue:#61a5ff;--cyan:#65dcf6;--green:#62e6a5;--yellow:#ffd166;--purple:#bd95ff;--red:#ff7180;--shadow:0 22px 58px rgba(0,0,0,.35)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:radial-gradient(circle at 12% 10%,rgba(97,165,255,.19),transparent 30%),radial-gradient(circle at 90% 88%,rgba(189,149,255,.15),transparent 30%),linear-gradient(145deg,#050a11,var(--bg) 56%,#0c1930)}
    button{font:inherit}.app{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;gap:14px;padding:22px clamp(18px,3vw,44px) 18px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.eyebrow{margin:0 0 6px;color:var(--blue);font-size:13px;font-weight:900;letter-spacing:.16em}h1{margin:0;font-size:clamp(26px,3vw,42px);line-height:1.1}.tag{padding:9px 13px;border:1px solid rgba(98,230,165,.3);border-radius:999px;color:var(--green);background:rgba(98,230,165,.08);font-size:13px}
    .tabs{display:flex;gap:9px;padding:9px;border:1px solid rgba(130,155,185,.22);border-radius:16px;background:rgba(7,15,27,.62);box-shadow:var(--shadow)}.tab{min-width:145px;padding:11px 16px;border:1px solid transparent;border-radius:11px;color:var(--muted);background:transparent;cursor:pointer;transition:.2s}.tab:hover{color:var(--text);background:rgba(255,255,255,.05)}.tab.active{color:#06151e;background:var(--blue);font-weight:900;box-shadow:0 8px 22px rgba(97,165,255,.22)}
    main{min-height:0;display:grid;grid-template-columns:minmax(630px,1.67fr) minmax(310px,.72fr);gap:14px}.visual-card,.lesson-card{border:1px solid rgba(130,155,185,.22);border-radius:20px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}.visual-card{min-height:570px;padding:22px}.visual-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.visual-top h2{margin:0;font-size:20px}.concept{padding:7px 10px;border:1px solid rgba(101,220,246,.28);border-radius:999px;color:var(--cyan);background:rgba(101,220,246,.08);font-size:12px;font-weight:800}#visual{min-height:475px;display:grid;align-content:center}
    .lesson-card{display:grid;grid-template-rows:auto auto 1fr auto;padding:22px}.counter{color:var(--blue);font-size:13px;font-weight:900;letter-spacing:.08em}.lesson-card h2{margin:8px 0 10px;font-size:clamp(22px,2.2vw,30px);line-height:1.22}.explain{margin:0;color:#ccd9e7;font-size:16px;line-height:1.72}.question{align-self:end;margin-top:18px;padding:16px;border-left:4px solid var(--yellow);border-radius:0 12px 12px 0;background:rgba(255,209,102,.08)}.question small{display:block;color:var(--yellow);font-weight:900;margin-bottom:5px}.question p{margin:0;color:#f7e8bc;line-height:1.55}
    .controls{display:grid;grid-template-columns:44px 44px 1fr 44px;gap:9px;margin-top:18px}.control{height:44px;border:1px solid rgba(134,158,192,.3);border-radius:11px;color:var(--text);background:var(--panel2);cursor:pointer}.control:hover{border-color:var(--blue)}.control.play{color:#06151e;background:var(--blue);border-color:var(--blue);font-weight:900}footer{display:flex;justify-content:space-between;gap:18px;color:var(--muted);font-size:12px}
    .board{display:grid;gap:15px}.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:9px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card{padding:15px;border:2px solid var(--line);border-radius:14px;background:#10243a;text-align:center;transition:.25s}.card strong{display:block;margin-bottom:5px}.card small{color:var(--muted)}.card.active{border-color:var(--green);background:rgba(98,230,165,.1);box-shadow:0 0 24px rgba(98,230,165,.18)}.card.blue{border-color:var(--blue)}.card.purple{border-color:var(--purple)}.card.warn{border-color:var(--yellow);background:rgba(255,209,102,.08)}.card.fail{border-color:var(--red);background:rgba(255,113,128,.09)}.card.dim{opacity:.32}.arrow{color:var(--green);font-size:25px;text-align:center;font-weight:900}.arrow.back{color:var(--cyan)}.badge{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:7px;color:#06151e;background:var(--green);font-size:11px;font-weight:900}.badge.warn{background:var(--yellow)}.badge.fail{color:#fff;background:var(--red)}.terminal{padding:14px 17px;border:1px solid #293d51;border-radius:12px;background:#03090f;color:#dae7f3;font:13px/1.6 Consolas,monospace;white-space:normal}.terminal b{color:var(--green)}.terminal .hi{color:var(--yellow)}.terminal .bad{color:var(--red)}
    .lane{display:grid;grid-template-columns:1fr 150px 1fr;gap:11px;align-items:center}.host{padding:17px;border:2px solid var(--blue);border-radius:14px;text-align:center;background:#10243a}.host.server{border-color:var(--purple)}.host.warn{border-color:var(--yellow);background:rgba(255,209,102,.08)}.messages{display:grid;gap:7px}.message{padding:9px;border:2px solid var(--line);border-radius:999px;text-align:center;font-size:12px}.message.active{border-color:var(--green);background:rgba(98,230,165,.1)}.message.warn{border-color:var(--yellow)}.message.fail{border-color:var(--red)}
    .key{display:inline-block;padding:8px 12px;border:2px solid var(--yellow);border-radius:9px;background:rgba(255,209,102,.08);font-weight:900}.key.public{border-color:var(--cyan);background:rgba(101,220,246,.08)}.file{padding:12px;border:2px solid var(--line);border-radius:11px;background:#0c1d2e;text-align:left}.file b{color:var(--cyan)}.file.good{border-color:var(--green)}.file.bad{border-color:var(--red)}.pipeline{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}.stage{min-width:112px;padding:12px;border:2px solid var(--line);border-radius:11px;text-align:center}.stage.active{border-color:var(--green)}.stage.warn{border-color:var(--yellow)}.transfer{display:grid;grid-template-columns:1fr 85px 1fr;gap:10px;align-items:center}.progress{height:15px;border:1px solid var(--line);border-radius:999px;background:#08121e;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .35s}.hash{font:12px Consolas,monospace;color:var(--cyan);word-break:break-all}.localremote{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pane{padding:14px;border:2px solid var(--blue);border-radius:12px;background:#10243a}.pane.remote{border-color:var(--purple)}.pane h3{margin:0 0 8px;font-size:16px}.pane code{display:block;margin:5px 0;color:var(--muted)}
    @keyframes pulse{50%{box-shadow:0 0 28px rgba(98,230,165,.45);transform:scale(1.025)}}.pulse{animation:pulse 1.25s ease-in-out infinite}
    @media(max-width:980px){.app{min-height:auto}header{align-items:flex-start;flex-direction:column}.tabs{flex-wrap:wrap}main{grid-template-columns:1fr}.visual-card{min-height:540px}}
    @media(max-width:680px){.tab{min-width:0;flex:1 1 45%}.lane,.transfer{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.grid2,.grid3,.localremote{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="app">
    <header><div><p class="eyebrow">模块二 · 第17—19章 · Linux实验10</p><h1>SSH信任、认证与文件传输</h1></div><div class="tag">先确认服务器，再证明用户身份</div></header>
    <nav class="tabs" aria-label="动画主题"><button class="tab active" data-scene="trust">1　主机身份</button><button class="tab" data-scene="auth">2　用户认证</button><button class="tab" data-scene="config">3　配置与命令</button><button class="tab" data-scene="transfer">4　文件传输</button></nav>
    <main>
      <section class="visual-card"><div class="visual-top"><h2 id="visualTitle"></h2><span class="concept" id="conceptTag"></span></div><div id="visual" aria-live="polite"></div></section>
      <aside class="lesson-card"><div class="counter" id="counter"></div><div><h2 id="stepTitle"></h2><p class="explain" id="stepText"></p></div><div class="question"><small>先判断，再验证</small><p id="questionText"></p></div><div class="controls"><button class="control" id="prev">←</button><button class="control" id="restart">↺</button><button class="control play" id="play">▶ 播放</button><button class="control" id="next">→</button></div></aside>
    </main>
    <footer><span>概念模型：指纹必须经可信渠道核对；私钥始终留在ubuntu-client</span><span>键盘：←/→ · 空格 · 1/2/3/4切换主题</span></footer>
  </div>
  <script>
    const scenes={
      trust:{title:'主机密钥证明“连接的是哪台服务器”',tag:'TCP → key exchange → host verification',steps:[
        {title:'SSH先建立到22端口的TCP连接',text:'ubuntu-client解析目标名称、选择路由并连接Rocky的TCP 22端口。只有TCP成功后，SSH客户端和sshd才开始协商协议版本、算法与密钥交换。',q:'nc测试22端口成功，能否证明服务器身份已经可信？',kind:'tcp'},
        {title:'服务器用主机私钥证明身份',text:'每台Rocky保存自己的主机私钥，向客户端提供相应公钥并完成密码学证明。主机私钥位于服务器的/etc/ssh中，不能复制给客户端。',q:'服务器主机私钥与ubuntu-client的用户私钥是否是同一类密钥？',kind:'hostkey'},
        {title:'首次连接必须通过可信渠道核对指纹',text:'客户端尚无历史记录时，会显示主机公钥指纹。应把它与VMware控制台中ssh-keygen显示的指纹逐字核对，相同后才接受。',q:'只因为IP地址看起来正确，就直接输入yes是否安全？',kind:'first'},
        {title:'接受后写入客户端known_hosts',text:'确认后的主机公钥信息记录在当前客户端用户的known_hosts。以后连接同一名称或地址时，客户端用该记录检测服务器身份是否变化。',q:'known_hosts记录的是允许登录服务器的用户公钥吗？',kind:'known'},
        {title:'主机密钥变化是安全事件，不是清理提示',text:'服务器重装、IP复用和中间人攻击都可能触发REMOTE HOST IDENTIFICATION HAS CHANGED。先从可信控制台核对原因和新指纹；确认合法后才移除旧记录。',q:'出现警告后立即执行ssh-keygen -R，会丢失哪一层保护？',kind:'changed'}
      ]},
      auth:{title:'用户公钥认证证明“谁有资格登录账号”',tag:'private-key signature → authorized_keys',steps:[
        {title:'密钥对在ubuntu-client生成',text:'ssh-keygen生成Ed25519私钥和公钥。私钥用于签名并应受600权限和口令保护；公钥可以分发，但两者不是可互换的密码文件。',q:'哪一个文件可以通过ssh-copy-id发送到Rocky？',kind:'pair'},
        {title:'只有公钥进入authorized_keys',text:'ssh-copy-id通过一次已有认证，把公钥追加到目标用户的~/.ssh/authorized_keys。它授权的是具体服务器上的具体账号，不是整台主机的所有用户。',q:'把同一公钥放入两个账号的authorized_keys，会授权几个账号？',kind:'deploy'},
        {title:'认证使用签名，不传送私钥',text:'服务器提出待签名数据；客户端用私钥完成签名，服务器用authorized_keys中的公钥验证。私钥内容在整个过程中不离开ubuntu-client。',q:'抓到SSH认证数据包，能否从中直接取出客户端私钥？',kind:'signature'},
        {title:'sshd会拒绝不安全的密钥文件路径',text:'目标家目录、.ssh目录或authorized_keys可被其他用户写入时，sshd可能拒绝使用公钥。通常检查所有者、700目录、600文件，并在Rocky继续检查SELinux上下文。',q:'密钥本身正确却回退到密码时，应检查哪些服务端对象？',kind:'modes'},
        {title:'用限定选项证明本次确实使用指定密钥',text:'-i指定密钥，IdentitiesOnly=yes避免agent中的其他密钥干扰，PasswordAuthentication=no禁止本次连接回退到密码。成功才构成明确的密钥认证证据。',q:'只看到登录成功，能否断定使用的是刚生成的那把密钥？',kind:'prove'}
      ]},
      config:{title:'客户端配置把连接参数映射为稳定别名',tag:'alias → final expanded configuration',steps:[
        {title:'一个Host别名组合连接参数',text:'~/.ssh/config把HostName、User、Port、IdentityFile等参数组合成rocky-server和rocky-web两个别名，后续命令不再重复地址和用户名。',q:'Host别名必须与DNS中的真实主机名相同吗？',kind:'alias'},
        {title:'配置顺序影响最终取值',text:'OpenSSH客户端的大多数参数采用先取得的值。具体Host块放前面，Host *通用默认项放后面；不要假设后面的配置会覆盖前面。',q:'通用Host *写在最前面并设置User，会不会影响后面的专用主机？',kind:'order'},
        {title:'ssh -G检查展开后的最终配置',text:'不要只阅读某个配置文件猜测结果。ssh -G rocky-server会合并系统配置、用户配置和命令行参数，显示最终目标、用户、端口和身份文件。',q:'准备批量运维前，哪条命令能在不登录的情况下确认最终参数？',kind:'expanded'},
        {title:'远程命令由哪一端Shell展开很重要',text:'ssh rocky-server后面的命令作为字符串交给远端Shell。单引号可避免本地提前展开变量和命令替换；双引号中的内容可能先被ubuntu-client处理。',q:'要输出Rocky的hostname，应让$(hostname)在哪一端展开？',kind:'quotes'},
        {title:'客户端与服务端日志组成认证证据链',text:'ssh -vv说明客户端读了哪些配置、尝试了哪些密钥以及失败阶段；journalctl -u sshd说明服务端为什么接受或拒绝。两端时间和目标用户必须对应。',q:'Permission denied时只看客户端最后一行，为什么不足以确认根因？',kind:'debug'}
      ]},
      transfer:{title:'SCP与SFTP复用SSH的信任、认证和加密通道',tag:'same trust · same authentication · different interface',steps:[
        {title:'冒号位置决定SCP传输方向',text:'本地文件加主机:远程路径表示上传；主机:远程文件加本地路径表示下载。先判断源和目标，避免把方向写反或覆盖错误位置。',q:'scp rocky-server:/etc/hostname ~/server-name.txt属于上传还是下载？',kind:'direction'},
        {title:'SCP传输前仍要完成SSH验证和认证',text:'SCP不是绕过SSH的另一条通道。它使用相同的主机密钥检查、用户认证和加密连接；别名、IdentityFile和权限错误也会影响传输。',q:'ssh rocky-server失败时，scp rocky-server:/tmp/a .是否可能正常成功？',kind:'channel'},
        {title:'SFTP同时维护本地与远程工作目录',text:'在SFTP交互提示符中，pwd、ls、cd操作远程端；lpwd、lls、lcd操作本地端。put上传，get下载。必须先确认两端当前目录。',q:'SFTP中cd /tmp改变的是ubuntu-client还是Rocky目录？',kind:'sftp'},
        {title:'文件出现不等于内容完整',text:'传输前后比较SHA256，能够发现截断、错误文件或后续改动。哈希相同说明所比较的字节内容相同，但不替代权限、所有者和业务可用性检查。',q:'远端ls看到同名文件，为什么仍不足以作为完整性证据？',kind:'hash'},
        {title:'不要传输私钥和秘密材料',text:'递归上传目录前先列出内容。SSH用户私钥、TLS私钥、数据库转储和凭据文件不应进入公共目录、作业仓库或无关服务器。最小化选择源路径。',q:'scp -r整个项目目录前，至少应检查哪些敏感文件？',kind:'secret'}
      ]}
    };
    let sceneKey='trust',stepIndex=0,timer=null;
    const byId=id=>document.getElementById(id);
    function trustVisual(s){
      if(s.kind==='tcp')return '<div class="board"><div class="lane"><div class="host"><strong>ubuntu-client</strong><small>SSH客户端</small></div><div class="messages"><div class="message active pulse">TCP SYN →</div><div class="message active">← SYN-ACK</div><div class="message active">ACK →</div></div><div class="host server"><strong>rocky-server:22</strong><small>sshd监听</small></div></div><div class="terminal"><b>$</b> nc -vz rocky-server 22<br><span class="hi">TCP成功 ≠ 主机身份已验证</span></div></div>';
      if(s.kind==='hostkey')return '<div class="board"><div class="lane"><div class="host"><strong>ubuntu-client</strong><small>接收主机公钥并验证证明</small></div><div class="messages"><div class="message active">协商算法</div><div class="message active pulse">← 主机公钥 + 证明</div></div><div class="host server"><strong>rocky-server</strong><span class="key">主机私钥</span><small>保存在/etc/ssh，只留在服务器</small></div></div><div class="terminal"><b>#</b> ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub</div></div>';
      if(s.kind==='first')return '<div class="board"><div class="grid2"><div class="card blue"><strong>ubuntu-client提示</strong><div class="hash">SHA256:Qn8...course...</div><small>首次看到的指纹</small></div><div class="card purple"><strong>VMware可信控制台</strong><div class="hash">SHA256:Qn8...course...</div><small>服务器本机显示的指纹</small></div></div><div class="row"><span class="card active pulse"><strong>完全一致</strong><small>确认后输入yes</small></span><span class="card fail"><strong>不一致</strong><small>停止连接并调查</small></span></div></div>';
      if(s.kind==='known')return '<div class="board"><div class="pipeline"><div class="stage active">目标名称/IP</div><div class="arrow">→</div><div class="stage active pulse">known_hosts</div><div class="arrow">→</div><div class="stage active">保存主机公钥记录</div></div><div class="file good"><b>客户端 ~/.ssh/known_hosts</b><br>rocky-server / 地址 → 已确认的主机密钥</div><div class="terminal"><b>$</b> ssh-keygen -F "$ROCKY_SERVER_IP"</div></div>';
      return '<div class="board"><div class="lane"><div class="host warn"><strong>ubuntu-client</strong><small>已有旧主机密钥记录</small></div><div class="messages"><div class="message fail pulse">HOST KEY CHANGED</div><div class="message warn">暂停：核对重装/IP复用/攻击</div></div><div class="host server warn"><strong>目标地址</strong><small>返回不同主机密钥</small></div></div><div class="terminal"><span class="bad">不要无条件删除known_hosts</span><br><b>$</b> ssh-keygen -R "$ROCKY_SERVER_IP"　<span class="hi">仅在可信确认合法变化后</span></div></div>';
    }
    function authVisual(s){
      if(s.kind==='pair')return '<div class="board"><div class="host"><strong>ubuntu-client</strong><div class="row"><span class="key pulse">私钥<br><small>m2_ed25519 · 600 · 不外传</small></span><span class="key public">公钥<br><small>m2_ed25519.pub · 可分发</small></span></div></div><div class="terminal"><b>$</b> ssh-keygen -t ed25519 -a 64 -f ~/.ssh/m2_ed25519</div></div>';
      if(s.kind==='deploy')return '<div class="board"><div class="lane"><div class="host"><strong>ubuntu-client</strong><span class="key public">用户公钥</span></div><div class="messages"><div class="message active pulse">ssh-copy-id →</div><div class="message">私钥留在本机</div></div><div class="host server"><strong>rocky-server用户</strong><div class="file good"><b>~/.ssh/authorized_keys</b><br>追加允许的公钥</div></div></div></div>';
      if(s.kind==='signature')return '<div class="board"><div class="lane"><div class="host"><strong>客户端</strong><span class="key">私钥签名</span></div><div class="messages"><div class="message active">← 待签名数据</div><div class="message active pulse">签名结果 →</div><div class="message">私钥从未发送</div></div><div class="host server"><strong>服务端</strong><span class="key public">公钥验签</span></div></div><div class="row"><span class="badge">验证通过：允许继续</span></div></div>';
      if(s.kind==='modes')return '<div class="board"><div class="grid3"><div class="file good"><b>家目录</b><br>不可被其他用户写入</div><div class="file good"><b>~/.ssh</b><br>用户所有 · 700</div><div class="file good"><b>authorized_keys</b><br>用户所有 · 600</div></div><div class="grid2"><div class="card warn"><strong>Rocky额外检查</strong><small>ls -Z · restorecon -RFv ~/.ssh</small></div><div class="card fail pulse"><strong>bad ownership or modes</strong><small>sshd拒绝不可信路径</small></div></div></div>';
      return '<div class="board"><div class="pipeline"><div class="stage active">-i m2_ed25519</div><div class="arrow">→</div><div class="stage active">IdentitiesOnly=yes</div><div class="arrow">→</div><div class="stage active">PasswordAuthentication=no</div><div class="arrow">→</div><div class="stage active pulse">登录成功</div></div><div class="terminal"><b>$</b> ssh -i ~/.ssh/m2_ed25519 -o IdentitiesOnly=yes -o PasswordAuthentication=no rocky-server</div></div>';
    }
    function configVisual(s){
      if(s.kind==='alias')return '<div class="board"><div class="lane"><div class="host"><strong>ssh rocky-server</strong><small>稳定别名</small></div><div class="messages"><div class="message active pulse">读取 ~/.ssh/config</div></div><div class="host server"><strong>最终参数</strong><small>HostName · User · Port<br>IdentityFile · IdentitiesOnly</small></div></div><div class="terminal"><b>Host</b> rocky-server<br>　HostName 192.168.200.10<br>　User rocky-server<br>　IdentityFile ~/.ssh/m2_ed25519</div></div>';
      if(s.kind==='order')return '<div class="board"><div class="pipeline"><div class="stage active pulse">Host rocky-server<br><small>先匹配专用值</small></div><div class="arrow">→</div><div class="stage">Host *<br><small>再补充默认值</small></div></div><div class="grid2"><div class="card active"><strong>专用块在前</strong><small>先取得需要的目标值</small></div><div class="card warn"><strong>通用块在前</strong><small>可能提前占用参数</small></div></div></div>';
      if(s.kind==='expanded')return '<div class="board"><div class="terminal"><b>$</b> ssh -G rocky-server | grep -E "^(hostname|user|port|identityfile) "<br><span class="hi">hostname 192.168.200.10</span><br>user rocky-server<br>port 22<br>identityfile ~/.ssh/m2_ed25519</div><div class="row"><div class="card active pulse"><strong>最终展开结果</strong><small>先验证参数，再发起连接</small></div></div></div>';
      if(s.kind==='quotes')return '<div class="board"><div class="grid2"><div class="card active"><strong>单引号</strong><div class="terminal">ssh rocky-server<br><span class="hi">\'echo $(hostname)\'</span></div><small>由Rocky远端Shell展开</small></div><div class="card warn"><strong>双引号</strong><div class="terminal">ssh rocky-server<br><span class="hi">"echo $(hostname)"</span></div><small>可能先由Ubuntu本地Shell展开</small></div></div></div>';
      return '<div class="board"><div class="grid2"><div class="card blue"><strong>客户端证据</strong><div class="terminal"><b>$</b> ssh -vv rocky-server<br>Offering public key...<br>Authentications that can continue...</div></div><div class="card purple"><strong>服务端证据</strong><div class="terminal"><b>#</b> journalctl -u sshd<br>Accepted publickey...<br><span class="bad">Authentication refused...</span></div></div></div><div class="row"><span class="badge">按时间 + 用户 + 来源地址交叉验证</span></div></div>';
    }
    function transferVisual(s){
      if(s.kind==='direction')return '<div class="board"><div class="grid2"><div class="card active"><strong>上传</strong><div class="terminal">scp local.txt<br>rocky-server:/tmp/</div><small>本地 → 远程</small></div><div class="card blue"><strong>下载</strong><div class="terminal">scp rocky-server:/etc/hostname<br>~/server-name.txt</div><small>远程 → 本地</small></div></div><div class="row"><span class="key public">冒号所在参数表示远程端</span></div></div>';
      if(s.kind==='channel')return '<div class="board"><div class="lane"><div class="host"><strong>scp / sftp</strong><small>ubuntu-client</small></div><div class="messages"><div class="message active">主机密钥验证</div><div class="message active">用户密钥认证</div><div class="message active pulse">加密传输</div></div><div class="host server"><strong>sshd</strong><small>rocky-server</small></div></div><div class="terminal"><span class="hi">复用同一套SSH信任与认证</span></div></div>';
      if(s.kind==='sftp')return '<div class="board"><div class="localremote"><div class="pane"><h3>本地 ubuntu-client</h3><code>lpwd　lls　lcd</code><code>put：从这里上传</code></div><div class="pane remote"><h3>远程 rocky-server</h3><code>pwd　ls　cd</code><code>get：从这里下载</code></div></div><div class="row"><span class="key public">put →</span><span class="key">← get</span></div></div>';
      if(s.kind==='hash')return '<div class="board"><div class="transfer"><div class="file good"><b>ubuntu-client源文件</b><div class="hash">9b14…e3a7</div></div><div><div class="progress"><span style="width:100%"></span></div><div class="arrow">→</div></div><div class="file good pulse"><b>Rocky目标文件</b><div class="hash">9b14…e3a7</div></div></div><div class="terminal"><b>$</b> sha256sum ~/m2-transfer.txt<br><b>$</b> ssh rocky-server \'sha256sum /tmp/m2-transfer.txt\'</div></div>';
      return '<div class="board"><div class="grid3"><div class="file bad pulse"><b>SSH私钥</b><br>m2_ed25519</div><div class="file bad"><b>TLS私钥</b><br>server.key</div><div class="file bad"><b>凭据/转储</b><br>.env · backup.sql</div></div><div class="pipeline"><div class="stage active">先列出源目录</div><div class="arrow">→</div><div class="stage active">排除秘密材料</div><div class="arrow">→</div><div class="stage active">只传所需文件</div></div><div class="terminal"><span class="bad">不要未经检查就 scp -r 整个项目目录</span></div></div>';
    }
    function render(){
      const scene=scenes[sceneKey],step=scene.steps[stepIndex];
      byId('visualTitle').textContent=scene.title;byId('conceptTag').textContent=scene.tag;
      byId('counter').textContent='第 '+(stepIndex+1)+' / '+scene.steps.length+' 步';
      byId('stepTitle').textContent=step.title;byId('stepText').textContent=step.text;byId('questionText').textContent=step.q;
      byId('visual').innerHTML=sceneKey==='trust'?trustVisual(step):sceneKey==='auth'?authVisual(step):sceneKey==='config'?configVisual(step):transferVisual(step);
      document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.scene===sceneKey));
    }
    function stop(){if(timer){clearInterval(timer);timer=null}byId('play').textContent='▶ 播放'}
    function next(){const n=scenes[sceneKey].steps.length;if(stepIndex<n-1)stepIndex++;else stepIndex=0;render()}
    function previous(){const n=scenes[sceneKey].steps.length;stepIndex=(stepIndex-1+n)%n;render()}
    function togglePlay(){if(timer){stop();return}byId('play').textContent='Ⅱ 暂停';timer=setInterval(next,4300)}
    document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{stop();sceneKey=t.dataset.scene;stepIndex=0;render()}));
    byId('prev').addEventListener('click',()=>{stop();previous()});byId('next').addEventListener('click',()=>{stop();next()});byId('restart').addEventListener('click',()=>{stop();stepIndex=0;render()});byId('play').addEventListener('click',togglePlay);
    document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();next()}else if(e.key==='ArrowLeft'){stop();previous()}else if(e.key===' '){e.preventDefault();togglePlay()}else if('1234'.includes(e.key)){stop();sceneKey=['trust','auth','config','transfer'][Number(e.key)-1];stepIndex=0;render()}});
    render();
  </script>
</body>
</html>
