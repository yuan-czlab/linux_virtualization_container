<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>rsync增量同步、cron与恢复闭环</title>
  <style>
    :root{color-scheme:dark;--bg:#071019;--panel:rgba(14,27,43,.95);--panel2:#142a40;--text:#eff7ff;--muted:#9fb1c5;--line:#486078;--blue:#61a5ff;--cyan:#65dcf6;--green:#62e6a5;--yellow:#ffd166;--purple:#bd95ff;--red:#ff7180;--shadow:0 22px 58px rgba(0,0,0,.35)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:radial-gradient(circle at 12% 10%,rgba(97,165,255,.19),transparent 30%),radial-gradient(circle at 90% 88%,rgba(189,149,255,.15),transparent 30%),linear-gradient(145deg,#050a11,var(--bg) 56%,#0c1930)}
    button{font:inherit}.app{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;gap:14px;padding:22px clamp(18px,3vw,44px) 18px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.eyebrow{margin:0 0 6px;color:var(--blue);font-size:13px;font-weight:900;letter-spacing:.16em}h1{margin:0;font-size:clamp(26px,3vw,42px);line-height:1.1}.tag{padding:9px 13px;border:1px solid rgba(98,230,165,.3);border-radius:999px;color:var(--green);background:rgba(98,230,165,.08);font-size:13px}
    .tabs{display:flex;gap:9px;padding:9px;border:1px solid rgba(130,155,185,.22);border-radius:16px;background:rgba(7,15,27,.62);box-shadow:var(--shadow)}.tab{min-width:145px;padding:11px 16px;border:1px solid transparent;border-radius:11px;color:var(--muted);background:transparent;cursor:pointer;transition:.2s}.tab:hover{color:var(--text);background:rgba(255,255,255,.05)}.tab.active{color:#06151e;background:var(--blue);font-weight:900;box-shadow:0 8px 22px rgba(97,165,255,.22)}
    main{min-height:0;display:grid;grid-template-columns:minmax(630px,1.67fr) minmax(310px,.72fr);gap:14px}.visual-card,.lesson-card{border:1px solid rgba(130,155,185,.22);border-radius:20px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}.visual-card{min-height:570px;padding:22px}.visual-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.visual-top h2{margin:0;font-size:20px}.concept{padding:7px 10px;border:1px solid rgba(101,220,246,.28);border-radius:999px;color:var(--cyan);background:rgba(101,220,246,.08);font-size:12px;font-weight:800}#visual{min-height:475px;display:grid;align-content:center}
    .lesson-card{display:grid;grid-template-rows:auto auto 1fr auto;padding:22px}.counter{color:var(--blue);font-size:13px;font-weight:900;letter-spacing:.08em}.lesson-card h2{margin:8px 0 10px;font-size:clamp(22px,2.2vw,30px);line-height:1.22}.explain{margin:0;color:#ccd9e7;font-size:16px;line-height:1.72}.question{align-self:end;margin-top:18px;padding:16px;border-left:4px solid var(--yellow);border-radius:0 12px 12px 0;background:rgba(255,209,102,.08)}.question small{display:block;color:var(--yellow);font-weight:900;margin-bottom:5px}.question p{margin:0;color:#f7e8bc;line-height:1.55}
    .controls{display:grid;grid-template-columns:44px 44px 1fr 44px;gap:9px;margin-top:18px}.control{height:44px;border:1px solid rgba(134,158,192,.3);border-radius:11px;color:var(--text);background:var(--panel2);cursor:pointer}.control:hover{border-color:var(--blue)}.control.play{color:#06151e;background:var(--blue);border-color:var(--blue);font-weight:900}footer{display:flex;justify-content:space-between;gap:18px;color:var(--muted);font-size:12px}
    .board{display:grid;gap:15px}.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:9px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card{padding:15px;border:2px solid var(--line);border-radius:14px;background:#10243a;text-align:center;transition:.25s}.card strong{display:block;margin-bottom:5px}.card small{color:var(--muted)}.card.active{border-color:var(--green);background:rgba(98,230,165,.1);box-shadow:0 0 24px rgba(98,230,165,.18)}.card.blue{border-color:var(--blue)}.card.purple{border-color:var(--purple)}.card.warn{border-color:var(--yellow);background:rgba(255,209,102,.08)}.card.fail{border-color:var(--red);background:rgba(255,113,128,.09)}.card.dim{opacity:.32}.arrow{color:var(--green);font-size:25px;text-align:center;font-weight:900}.badge{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:7px;color:#06151e;background:var(--green);font-size:11px;font-weight:900}.badge.warn{background:var(--yellow)}.badge.fail{color:#fff;background:var(--red)}.terminal{padding:14px 17px;background:#03090f;border:1px solid #293d51;border-radius:12px;color:#dae7f3;font:13px/1.6 Consolas,monospace;white-space:normal}.terminal b{color:var(--green)}.terminal .hi{color:var(--yellow)}.terminal .bad{color:var(--red)}
    .tree{padding:15px;border:2px solid var(--blue);border-radius:14px;background:#10243a;font:14px/1.75 Consolas,monospace}.tree.target{border-color:var(--purple)}.tree .folder{color:var(--yellow);font-weight:900}.tree .changed{color:var(--green);font-weight:900}.tree .deleted{color:var(--red);text-decoration:line-through}.compare{display:grid;grid-template-columns:1fr 78px 1fr;gap:10px;align-items:center}.fileline{display:flex;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--line);border-radius:9px;margin:7px 0}.fileline.copy{border-color:var(--green);background:rgba(98,230,165,.08)}.fileline.skip{opacity:.46}.fileline.delete{border-color:var(--red);color:#ffc4ca}.fileline.new{border-color:var(--cyan)}
    .pipeline{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}.stage{min-width:105px;padding:12px;border:2px solid var(--line);border-radius:11px;text-align:center}.stage.active{border-color:var(--green);background:rgba(98,230,165,.08)}.stage.warn{border-color:var(--yellow)}.stage.fail{border-color:var(--red)}.cronfields{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.cronfield{padding:13px 7px;border:2px solid var(--line);border-radius:11px;text-align:center}.cronfield strong{display:block;color:var(--cyan);font-size:23px}.cronfield.active{border-color:var(--green)}.clock{font-size:56px;text-align:center}.log{display:grid;gap:6px;padding:14px;border:1px solid #293d51;border-radius:12px;background:#03090f;font:13px/1.5 Consolas,monospace}.log .ok{color:var(--green)}.log .error{color:var(--red)}.lock{display:grid;place-items:center;width:96px;height:96px;margin:auto;border:3px solid var(--yellow);border-radius:50%;color:var(--yellow);font-size:34px;font-weight:900}
    .cycle{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;align-items:center}.cycle .stage{min-width:0}.verify{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.check{padding:14px;border:2px solid var(--green);border-radius:12px;text-align:center;background:rgba(98,230,165,.07)}.check.warn{border-color:var(--yellow)}.history{display:flex;justify-content:center;gap:10px;align-items:flex-end}.snapshot{width:150px;padding:13px;border:2px solid var(--line);border-radius:12px;text-align:center}.snapshot.current{border-color:var(--green)}.snapshot.old{border-color:var(--blue)}.snapshot.deleted{border-color:var(--red);opacity:.48}
    @keyframes pulse{50%{box-shadow:0 0 28px rgba(98,230,165,.45);transform:scale(1.025)}}.pulse{animation:pulse 1.25s ease-in-out infinite}
    @media(max-width:980px){.app{min-height:auto}header{align-items:flex-start;flex-direction:column}.tabs{flex-wrap:wrap}main{grid-template-columns:1fr}.visual-card{min-height:540px}}
    @media(max-width:680px){.tab{min-width:0;flex:1 1 45%}.compare{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.grid2,.grid3,.verify,.cycle{grid-template-columns:1fr}.cronfields{grid-template-columns:repeat(2,1fr)}.history{flex-direction:column;align-items:stretch}.snapshot{width:auto}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>

<body>
  <div class="app">
    <header><div><p class="eyebrow">模块二 · 第20章 · Linux实验11</p><h1>rsync增量同步、cron与恢复闭环</h1></div><div class="tag">备份完成 ≠ 备份可恢复</div></header>
    <nav class="tabs" aria-label="动画主题"><button class="tab active" data-scene="slash">1　路径语义</button><button class="tab" data-scene="sync">2　增量与删除</button><button class="tab" data-scene="cron">3　定时执行</button><button class="tab" data-scene="restore">4　恢复验证</button></nav>
    <main>
      <section class="visual-card"><div class="visual-top"><h2 id="visualTitle"></h2><span class="concept" id="conceptTag"></span></div><div id="visual" aria-live="polite"></div></section>
      <aside class="lesson-card"><div class="counter" id="counter"></div><div><h2 id="stepTitle"></h2><p class="explain" id="stepText"></p></div><div class="question"><small>先预测，再运行</small><p id="questionText"></p></div><div class="controls"><button class="control" id="prev">←</button><button class="control" id="restart">↺</button><button class="control play" id="play">▶ 播放</button><button class="control" id="next">→</button></div></aside>
    </main>
    <footer><span>概念模型：正式操作前核对源、目标，并先用--dry-run预演危险变更</span><span>键盘：←/→ · 空格 · 1/2/3/4切换主题</span></footer>
  </div>
  <script>
    const scenes={
      slash:{title:'源目录末尾斜杠决定复制“目录”还是“目录内容”',tag:'source/ ≠ source',steps:[
        {title:'先识别源目录与目标目录',text:'课程源目录是~/m1-project/web，目标是~/backup-lab/web-current。分析rsync命令时，先标出哪个参数是源、哪个是目标，再判断源参数末尾有没有斜杠。',q:'只看目标路径，能否判断最终会不会多出一层web目录？',kind:'objects'},
        {title:'web/表示同步web里面的内容',text:'源写成web/时，index.html和assets直接进入web-current。末尾斜杠不代表递归开关；递归由-r或-a提供，它改变的是源根目录的语义。',q:'同步完成后，目标文件应是web-current/index.html还是web-current/web/index.html？',kind:'contents'},
        {title:'web表示把web目录本身放入目标',text:'源不带末尾斜杠时，目标中会形成web这一层，因此文件位于web-current/web/index.html。两条命令都可能成功，但交付的目录结构不同。',q:'如果Nginx根目录指向web-current，哪种写法更符合课程目标结构？',kind:'directory'},
        {title:'-a是归档组合选项',text:'-a包含递归并尽量保留符号链接、权限、时间等属性，但不包含压缩、进度显示、校验和比较或自动删除。所有者、组和特殊文件的完整保留还受运行身份影响。',q:'使用-a后，目标中多余文件会自动被删除吗？',kind:'archive'},
        {title:'先用目录树和dry-run验证意图',text:'运行前分别用find查看源和目标，再使用-aivn或--dry-run预演。-i的逐项变化输出可以说明将创建、更新或删除哪些对象。',q:'预演没有报错，是否还需要阅读它列出的目标路径和变化类型？',kind:'preview'}
      ]},
      sync:{title:'rsync先比较，再处理新增、变化和可选删除',tag:'compare → select → transfer → verify',steps:[
        {title:'首次同步需要创建全部目标对象',text:'空目标没有可复用内容，目录和文件都需要创建。--itemize-changes会列出变化；完成后应用find、diff或业务检查确认结构和内容。',q:'命令退出0但目标层级多了一层web，能否判定任务符合要求？',kind:'first'},
        {title:'第二次同步只选择新增或变化对象',text:'再次运行时，未变化文件通常被跳过；新增app.js和变化的index.html被处理。默认快速检查主要依据大小和修改时间，不是逐文件内容校验。',q:'大小和修改时间相同是否绝对保证文件字节完全相同？',kind:'incremental'},
        {title:'-c改变比较方式，但成本更高',text:'--checksum会读取源和目标文件内容计算校验和来决定是否需要更新，增加磁盘I/O。远程rsync还可对选中的文件使用差分传输；课程本机同步不应笼统描述为永远只复制变化字节。',q:'日常每次同步都加-c，一定比默认策略更好吗？',kind:'checksum'},
        {title:'普通同步默认保留目标中的多余文件',text:'目标中的obsolete.txt若源中不存在，普通rsync -a不会删除它。这适合某些累积场景，但目标不再是源的严格镜像。',q:'目标比源多一个文件时，diff -qr会返回一致吗？',kind:'extra'},
        {title:'--delete把源端删除传播到目标',text:'--delete会删除目标端源中不存在的对象，路径写反可能造成严重损失。必须先核对源与目标，并结合--dry-run和-i检查删除清单；本实验只预演，不执行真实删除。',q:'--delete为什么不能被简单称为“更完整的备份”？',kind:'delete'}
      ]},
      cron:{title:'cron在精简的非交互环境中按计划启动脚本',tag:'schedule → minimal environment → script → log',steps:[
        {title:'五个字段依次确定运行时间',text:'用户crontab的五个时间字段依次为分钟、小时、日、月、星期，后面才是命令。*表示任意值；课程每分钟规则只用于课堂观察，验证后必须删除或改为合理频率。',q:'30 18 * * *表示每天什么时间运行？',kind:'fields'},
        {title:'cron不等于当前交互Shell',text:'定时任务没有当前终端，不保证当前工作目录，也不继承完整PATH、Shell初始化和ssh-agent。因此脚本使用绝对路径、明确目录和无需交互的认证方式。',q:'终端手工运行成功，为什么cron仍可能提示command not found？',kind:'environment'},
        {title:'脚本必须记录开始、结束和退出码',text:'无人值守任务不能只依靠“目录看起来有文件”。把stdout和stderr写入日志，记录时间、rsync输出、成功或失败状态，并把rsync退出码返回给调用者。',q:'脚本无输出且目标目录存在，能否证明本次定时执行成功？',kind:'logging'},
        {title:'flock避免任务重叠',text:'如果上一次备份未结束，下一次又启动，两个rsync可能同时写同一目标。flock -n尝试获得锁，已有实例持锁时本次立即退出，避免重叠执行。',q:'把频率设得很低是否就能从原理上保证永不重叠？',kind:'flock'},
        {title:'验证要同时检查调度、进程和结果',text:'用crontab -l核对规则，用systemctl检查Rocky的crond，用脚本日志确认实际启动和退出状态，再检查备份内容。每分钟测试规则验收后必须清理。',q:'crond处于active，能否证明某个用户的备份脚本已经成功执行？',kind:'evidence'}
      ]},
      restore:{title:'只有经过隔离恢复和验证的备份才具有可用证据',tag:'backup → restore elsewhere → compare → record',steps:[
        {title:'同步成功只是备份流程的一半',text:'rsync退出0说明本次命令完成，不证明源选择正确、目标结构正确，也不证明未来能够恢复。备份验收必须加入独立恢复演练。',q:'备份日志显示success时，还缺少哪类关键证据？',kind:'half'},
        {title:'先恢复到隔离目录',text:'把备份内容恢复到~/backup-lab/restore-test，而不是直接覆盖正在使用的源目录。隔离恢复允许先检查内容、结构和权限，失败也不会造成二次破坏。',q:'误删一个文件后，为什么不应立即把整个备份覆盖回生产目录？',kind:'isolated'},
        {title:'比较内容并验证业务需要',text:'用diff -qr或哈希比较源与恢复目录，检查关键文件数量、内容和权限。diff无输出且退出0表示所比较内容一致；服务配置还应执行语法检查或业务访问测试。',q:'文件哈希一致是否同时证明所有者、权限和服务配置可用？',kind:'compare'},
        {title:'单一current镜像没有历史版本',text:'持续覆盖同一个current目录只能提供当前副本；误删、错误修改或--delete可能同步过去。需要历史恢复点时，应设计时间戳快照、硬链接快照或专用备份系统。',q:'今天的错误已经同步到current后，如何恢复昨天的正确版本？',kind:'history'},
        {title:'形成“备份—日志—恢复—验证”证据闭环',text:'最终证据应包含源和目标说明、rsync变化清单、定时执行时间与退出码、隔离恢复目录及diff或哈希结果。任何一环缺失，都不能把目录存在等同于备份可靠。',q:'如果只能展示一个空日志和一个备份目录，验收应该通过吗？',kind:'closed'}
      ]}
    };
    let sceneKey='slash',stepIndex=0,timer=null;
    const byId=id=>document.getElementById(id);
    function slashVisual(s){
      if(s.kind==='objects')return '<div class="board"><div class="compare"><div class="tree"><span class="folder">源 ~/m1-project/web/</span><br>├── index.html<br>└── assets/<br>　└── site.css</div><div class="arrow">→</div><div class="tree target"><span class="folder">目标 ~/backup-lab/web-current/</span><br><small>先确认目标，再运行</small></div></div><div class="terminal"><b>$</b> rsync -aiv <span class="hi">SOURCE</span> <span class="hi">TARGET</span></div></div>';
      if(s.kind==='contents')return '<div class="board"><div class="compare"><div class="tree"><span class="folder">web/</span><br>├── index.html<br>└── assets/site.css</div><div class="arrow pulse">→</div><div class="tree target"><span class="folder">web-current/</span><br><span class="changed">├── index.html</span><br><span class="changed">└── assets/site.css</span></div></div><div class="terminal"><b>$</b> rsync -av ~/m1-project/<span class="hi">web/</span> ~/backup-lab/web-current/</div></div>';
      if(s.kind==='directory')return '<div class="board"><div class="compare"><div class="tree"><span class="folder">web</span><br>├── index.html<br>└── assets/site.css</div><div class="arrow pulse">→</div><div class="tree target"><span class="folder">web-current/</span><br><span class="changed">└── web/</span><br>　├── index.html<br>　└── assets/site.css</div></div><div class="terminal"><b>$</b> rsync -av ~/m1-project/<span class="hi">web</span> ~/backup-lab/web-current/</div></div>';
      if(s.kind==='archive')return '<div class="board"><div class="grid3"><div class="card active"><strong>-r</strong><small>递归目录</small></div><div class="card active"><strong>-lpt</strong><small>链接、权限、时间</small></div><div class="card active"><strong>-goD</strong><small>组、所有者、设备等</small></div></div><div class="grid3"><div class="card warn"><strong>不含 -z</strong><small>不会自动压缩</small></div><div class="card warn"><strong>不含 -c</strong><small>不按内容校验和比较</small></div><div class="card warn"><strong>不含 --delete</strong><small>不自动删目标多余项</small></div></div><div class="terminal"><span class="hi">-a = archive组合，不等于所有备份需求</span></div></div>';
      return '<div class="board"><div class="pipeline"><div class="stage active">find源目录</div><div class="arrow">→</div><div class="stage active">find目标目录</div><div class="arrow">→</div><div class="stage active pulse">rsync -aivn</div><div class="arrow">→</div><div class="stage active">阅读变化清单</div></div><div class="terminal"><b>$</b> rsync -aiv --dry-run ~/m1-project/web/ ~/backup-lab/web-current/</div></div>';
    }
    function syncVisual(s){
      if(s.kind==='first')return '<div class="board"><div class="compare"><div class="tree"><span class="folder">源</span><div class="fileline copy">index.html <span>复制</span></div><div class="fileline copy">assets/site.css <span>复制</span></div></div><div class="arrow pulse">→</div><div class="tree target"><span class="folder">空目标</span><div class="fileline new">创建目录与文件</div></div></div><div class="terminal"><span class="hi">首次同步：目标没有可跳过的相同对象</span></div></div>';
      if(s.kind==='incremental')return '<div class="board"><div class="grid2"><div class="tree"><span class="folder">比较结果</span><div class="fileline copy">index.html <span>已变化</span></div><div class="fileline new">assets/app.js <span>新增</span></div><div class="fileline skip">assets/site.css <span>跳过</span></div></div><div class="card active pulse"><strong>只处理选中对象</strong><small>默认快速检查主要看大小和修改时间<br>不是默认逐文件计算内容校验和</small></div></div><div class="terminal"><b>$</b> rsync -av --itemize-changes source/ target/</div></div>';
      if(s.kind==='checksum')return '<div class="board"><div class="pipeline"><div class="stage active">读取源文件</div><div class="arrow">→</div><div class="stage active pulse">计算校验和</div><div class="arrow">→</div><div class="stage active">读取目标文件</div><div class="arrow">→</div><div class="stage active">比较内容</div></div><div class="grid2"><div class="card active"><strong>优点</strong><small>内容比较更严格</small></div><div class="card warn"><strong>代价</strong><small>增加两端磁盘读取和计算</small></div></div><div class="terminal"><b>$</b> rsync -aiv <span class="hi">--checksum</span> source/ target/</div></div>';
      if(s.kind==='extra')return '<div class="board"><div class="compare"><div class="tree"><span class="folder">源</span><br>index.html<br>assets/site.css</div><div class="arrow">→</div><div class="tree target"><span class="folder">目标</span><br>index.html<br>assets/site.css<div class="fileline new">obsolete.txt <span>默认保留</span></div></div></div><div class="terminal"><b>$</b> rsync -a source/ target/　<span class="hi">不会自动删除obsolete.txt</span></div></div>';
      return '<div class="board"><div class="compare"><div class="tree"><span class="folder">源：权威集合</span><br>index.html<br>assets/site.css</div><div class="arrow">→</div><div class="tree target"><span class="folder">目标预演</span><br>index.html<br>assets/site.css<div class="fileline delete pulse">obsolete.txt <span>deleting</span></div></div></div><div class="terminal"><b>$</b> rsync -aiv <span class="bad">--delete</span> <span class="hi">--dry-run</span> source/ target/<br><span class="bad">路径未核对前不得移除--dry-run</span></div></div>';
    }
    function cronVisual(s){
      if(s.kind==='fields')return '<div class="board"><div class="cronfields"><div class="cronfield active"><strong>30</strong>分钟</div><div class="cronfield active"><strong>18</strong>小时</div><div class="cronfield"><strong>*</strong>日</div><div class="cronfield"><strong>*</strong>月</div><div class="cronfield"><strong>*</strong>星期</div></div><div class="clock">🕡</div><div class="terminal"><span class="hi">30 18 * * *</span> /绝对路径/backup.sh　→ 每天18:30</div></div>';
      if(s.kind==='environment')return '<div class="board"><div class="grid2"><div class="card blue"><strong>交互终端</strong><small>当前目录、完整PATH<br>Shell初始化、ssh-agent</small></div><div class="card warn pulse"><strong>cron环境</strong><small>无终端、PATH精简<br>目录不保证、不能回答提示</small></div></div><div class="pipeline"><div class="stage active">/usr/bin/rsync</div><div class="stage active">/home/rocky-server/...</div><div class="stage active">非交互执行</div></div></div>';
      if(s.kind==='logging')return '<div class="board"><div class="pipeline"><div class="stage active">记录开始时间</div><div class="arrow">→</div><div class="stage active">rsync stdout+stderr</div><div class="arrow">→</div><div class="stage active pulse">记录退出码</div></div><div class="log"><span>[18:30:00] backup start</span><span>&gt;f+++++++++ assets/app.js</span><span class="ok">[18:30:01] backup success rc=0</span><span class="error">失败时也必须记录stderr与非0退出码</span></div></div>';
      if(s.kind==='flock')return '<div class="board"><div class="grid2"><div class="card active"><strong>任务A</strong><small>18:30 获得锁并运行</small></div><div class="card fail"><strong>任务B</strong><small>18:31 未获得锁，立即退出</small></div></div><div class="lock pulse">🔒</div><div class="terminal"><b>$</b> /usr/bin/flock -n /tmp/m2-backup.lock /home/rocky-server/bin/m2-backup.sh</div></div>';
      return '<div class="board"><div class="verify"><div class="check"><strong>① 规则</strong><br>crontab -l</div><div class="check"><strong>② 调度服务</strong><br>systemctl status crond</div><div class="check pulse"><strong>③ 实际结果</strong><br>日志 + 内容 + 退出码</div></div><div class="terminal"><b>$</b> tail -f ~/backup-lab/logs/backup.log<br><span class="hi">验收后删除或调整每分钟测试规则</span></div></div>';
    }
    function restoreVisual(s){
      if(s.kind==='half')return '<div class="board"><div class="cycle"><div class="stage active">源选择正确？</div><div class="stage active">同步退出0？</div><div class="stage warn">结构与属性正确？</div><div class="stage fail pulse">能恢复吗？</div></div><div class="row"><span class="badge warn">只完成同步，还没有完成备份验收</span></div></div>';
      if(s.kind==='isolated')return '<div class="board"><div class="compare"><div class="tree target"><span class="folder">backup/web-current/</span><br>index.html<br>assets/site.css</div><div class="arrow pulse">→</div><div class="tree"><span class="folder">restore-test/</span><br><span class="changed">隔离恢复</span><br><small>不覆盖正在使用的源</small></div></div><div class="terminal"><b>$</b> rsync -a ~/backup-lab/web-current/ ~/backup-lab/restore-test/</div></div>';
      if(s.kind==='compare')return '<div class="board"><div class="verify"><div class="check pulse"><strong>内容</strong><br>diff -qr / SHA256</div><div class="check"><strong>元数据</strong><br>权限、所有者、时间</div><div class="check"><strong>业务</strong><br>语法检查、访问测试</div></div><div class="terminal"><b>$</b> diff -qr source restore-test<br><span class="hi">无输出且退出码0：所比较内容一致</span></div></div>';
      if(s.kind==='history')return '<div class="board"><div class="history"><div class="snapshot old"><strong>昨天 18:30</strong><small>正确版本</small></div><div class="snapshot current"><strong>current</strong><small>今天的错误已同步</small></div><div class="snapshot deleted"><strong>无历史副本</strong><small>无法从current找回昨天</small></div></div><div class="grid2"><div class="card warn"><strong>镜像副本</strong><small>反映当前源状态</small></div><div class="card active"><strong>版本化备份</strong><small>保留多个恢复点和策略</small></div></div></div>';
      return '<div class="board"><div class="pipeline"><div class="stage active">同步变化清单</div><div class="arrow">→</div><div class="stage active">定时日志/退出码</div><div class="arrow">→</div><div class="stage active">隔离恢复</div><div class="arrow">→</div><div class="stage active pulse">diff/业务验证</div></div><div class="terminal"><span class="hi">备份可靠性来自可复核的完整证据链</span></div></div>';
    }
    function render(){
      const scene=scenes[sceneKey],step=scene.steps[stepIndex];
      byId('visualTitle').textContent=scene.title;byId('conceptTag').textContent=scene.tag;
      byId('counter').textContent='第 '+(stepIndex+1)+' / '+scene.steps.length+' 步';
      byId('stepTitle').textContent=step.title;byId('stepText').textContent=step.text;byId('questionText').textContent=step.q;
      byId('visual').innerHTML=sceneKey==='slash'?slashVisual(step):sceneKey==='sync'?syncVisual(step):sceneKey==='cron'?cronVisual(step):restoreVisual(step);
      document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.scene===sceneKey));
    }
    function stop(){if(timer){clearInterval(timer);timer=null}byId('play').textContent='▶ 播放'}
    function next(){const n=scenes[sceneKey].steps.length;stepIndex=stepIndex<n-1?stepIndex+1:0;render()}
    function previous(){const n=scenes[sceneKey].steps.length;stepIndex=(stepIndex-1+n)%n;render()}
    function togglePlay(){if(timer){stop();return}byId('play').textContent='Ⅱ 暂停';timer=setInterval(next,4300)}
    document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{stop();sceneKey=t.dataset.scene;stepIndex=0;render()}));
    byId('prev').addEventListener('click',()=>{stop();previous()});byId('next').addEventListener('click',()=>{stop();next()});byId('restart').addEventListener('click',()=>{stop();stepIndex=0;render()});byId('play').addEventListener('click',togglePlay);
    document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();next()}else if(e.key==='ArrowLeft'){stop();previous()}else if(e.key===' '){e.preventDefault();togglePlay()}else if('1234'.includes(e.key)){stop();sceneKey=['slash','sync','cron','restore'][Number(e.key)-1];stepIndex=0;render()}});
    render();
  </script>
</body>
</html>
