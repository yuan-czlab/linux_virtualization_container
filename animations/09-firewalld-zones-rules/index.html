<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>firewalld区域、规则与安全变更</title>
  <style>
    :root{color-scheme:dark;--bg:#071019;--panel:rgba(14,27,43,.95);--panel2:#142a40;--text:#eff7ff;--muted:#9fb1c5;--line:#486078;--blue:#61a5ff;--cyan:#65dcf6;--green:#62e6a5;--yellow:#ffd166;--purple:#bd95ff;--red:#ff7180;--shadow:0 22px 58px rgba(0,0,0,.35)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:radial-gradient(circle at 12% 10%,rgba(97,165,255,.19),transparent 30%),radial-gradient(circle at 90% 88%,rgba(189,149,255,.15),transparent 30%),linear-gradient(145deg,#050a11,var(--bg) 56%,#0c1930)}
    button{font:inherit}.app{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;gap:14px;padding:22px clamp(18px,3vw,44px) 18px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.eyebrow{margin:0 0 6px;color:var(--blue);font-size:13px;font-weight:900;letter-spacing:.16em}h1{margin:0;font-size:clamp(26px,3vw,42px);line-height:1.1}.tag{padding:9px 13px;border:1px solid rgba(98,230,165,.3);border-radius:999px;color:var(--green);background:rgba(98,230,165,.08);font-size:13px}
    .tabs{display:flex;gap:9px;padding:9px;border:1px solid rgba(130,155,185,.22);border-radius:16px;background:rgba(7,15,27,.62);box-shadow:var(--shadow)}.tab{min-width:145px;padding:11px 16px;border:1px solid transparent;border-radius:11px;color:var(--muted);background:transparent;cursor:pointer;transition:.2s}.tab:hover{color:var(--text);background:rgba(255,255,255,.05)}.tab.active{color:#06151e;background:var(--blue);font-weight:900;box-shadow:0 8px 22px rgba(97,165,255,.22)}
    main{min-height:0;display:grid;grid-template-columns:minmax(630px,1.67fr) minmax(310px,.72fr);gap:14px}.visual-card,.lesson-card{border:1px solid rgba(130,155,185,.22);border-radius:20px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}.visual-card{min-height:570px;padding:22px}.visual-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.visual-top h2{margin:0;font-size:20px}.concept{padding:7px 10px;border:1px solid rgba(101,220,246,.28);border-radius:999px;color:var(--cyan);background:rgba(101,220,246,.08);font-size:12px;font-weight:800}#visual{min-height:475px;display:grid;align-content:center}
    .lesson-card{display:grid;grid-template-rows:auto auto 1fr auto;padding:22px}.counter{color:var(--blue);font-size:13px;font-weight:900;letter-spacing:.08em}.lesson-card h2{margin:8px 0 10px;font-size:clamp(22px,2.2vw,30px);line-height:1.22}.explain{margin:0;color:#ccd9e7;font-size:16px;line-height:1.72}.question{align-self:end;margin-top:18px;padding:16px;border-left:4px solid var(--yellow);border-radius:0 12px 12px 0;background:rgba(255,209,102,.08)}.question small{display:block;color:var(--yellow);font-weight:900;margin-bottom:5px}.question p{margin:0;color:#f7e8bc;line-height:1.55}
    .controls{display:grid;grid-template-columns:44px 44px 1fr 44px;gap:9px;margin-top:18px}.control{height:44px;border:1px solid rgba(134,158,192,.3);border-radius:11px;color:var(--text);background:var(--panel2);cursor:pointer}.control:hover{border-color:var(--blue)}.control.play{color:#06151e;background:var(--blue);border-color:var(--blue);font-weight:900}footer{display:flex;justify-content:space-between;gap:18px;color:var(--muted);font-size:12px}
    .board{display:grid;gap:15px}.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:9px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card{padding:15px;border:2px solid var(--line);border-radius:14px;background:#10243a;text-align:center;transition:.25s}.card strong{display:block;margin-bottom:5px}.card small{color:var(--muted)}.card.active{border-color:var(--green);background:rgba(98,230,165,.1);box-shadow:0 0 24px rgba(98,230,165,.18)}.card.blue{border-color:var(--blue)}.card.purple{border-color:var(--purple)}.card.warn{border-color:var(--yellow);background:rgba(255,209,102,.08)}.card.fail{border-color:var(--red);background:rgba(255,113,128,.09)}.card.dim{opacity:.32}.arrow{color:var(--green);font-size:25px;text-align:center;font-weight:900}.badge{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:7px;color:#06151e;background:var(--green);font-size:11px;font-weight:900}.badge.warn{background:var(--yellow)}.badge.fail{color:#fff;background:var(--red)}.terminal{padding:14px 17px;background:#03090f;border:1px solid #293d51;border-radius:12px;color:#dae7f3;font:13px/1.6 Consolas,monospace;white-space:normal}.terminal b{color:var(--green)}.terminal .hi{color:var(--yellow)}.terminal .bad{color:var(--red)}
    .flow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}.node{min-width:112px;padding:13px;border:2px solid var(--line);border-radius:12px;text-align:center;background:#10243a}.node.active{border-color:var(--green);background:rgba(98,230,165,.08)}.node.blue{border-color:var(--blue)}.node.purple{border-color:var(--purple)}.node.warn{border-color:var(--yellow)}.node.fail{border-color:var(--red);background:rgba(255,113,128,.08)}.packet{padding:8px 11px;border:2px solid var(--cyan);border-radius:999px;background:rgba(101,220,246,.08);font:12px Consolas,monospace}.zone{padding:17px;border:3px solid var(--purple);border-radius:18px;background:rgba(189,149,255,.07)}.zone h3{margin:0 0 12px;color:var(--purple);text-align:center}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.rule{padding:12px;border:2px solid var(--line);border-radius:10px;text-align:center}.rule.match{border-color:var(--green)}.rule.no{opacity:.38}.rule.wide{border-color:var(--yellow)}
    .layers{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.layer{padding:15px 9px;border:2px solid var(--line);border-radius:12px;text-align:center}.layer.active{border-color:var(--green)}.layer.fail{border-color:var(--red)}.layer.dim{opacity:.32}.definition{display:grid;grid-template-columns:1fr 70px 1fr;gap:10px;align-items:center}.ports{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.port{padding:8px 11px;border:2px solid var(--cyan);border-radius:8px;font:13px Consolas,monospace}.statepair{display:grid;grid-template-columns:1fr 90px 1fr;gap:12px;align-items:center}.state{padding:18px;border:3px solid var(--line);border-radius:16px;background:#10243a}.state h3{margin:0 0 10px;text-align:center}.state.runtime{border-color:var(--green)}.state.permanent{border-color:var(--blue)}.ruleline{display:flex;justify-content:space-between;gap:8px;padding:9px;border:1px solid var(--line);border-radius:8px;margin-top:7px}.ruleline.yes{border-color:var(--green)}.ruleline.no{border-color:var(--red);opacity:.55}.reload{width:80px;height:80px;display:grid;place-items:center;border:3px solid var(--yellow);border-radius:50%;color:var(--yellow);font-size:31px;font-weight:900}
    .rich{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.part{padding:12px 7px;border:2px solid var(--line);border-radius:10px;text-align:center}.part.active{border-color:var(--green)}.clients{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.client{padding:14px;border:2px solid var(--blue);border-radius:12px;text-align:center}.client.allow{border-color:var(--green)}.client.deny{border-color:var(--red)}.loop{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.loop .node{min-width:0}.warning{padding:13px;border:1px solid var(--red);border-radius:11px;color:#ffc5ca;background:rgba(255,113,128,.08);text-align:center}
    @keyframes pulse{50%{box-shadow:0 0 28px rgba(98,230,165,.45);transform:scale(1.025)}}.pulse{animation:pulse 1.25s ease-in-out infinite}
    @media(max-width:980px){.app{min-height:auto}header{align-items:flex-start;flex-direction:column}.tabs{flex-wrap:wrap}main{grid-template-columns:1fr}.visual-card{min-height:540px}}
    @media(max-width:680px){.tab{min-width:0;flex:1 1 45%}.grid2,.grid3,.rules,.layers,.rich,.clients,.loop{grid-template-columns:1fr}.definition,.statepair{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="app">
    <header><div><p class="eyebrow">模块二 · 第21—22章 · Linux实验12</p><h1>firewalld区域、规则与安全变更</h1></div><div class="tag">规则存在 ≠ 真实客户端一定可用</div></header>
    <nav class="tabs" aria-label="动画主题"><button class="tab active" data-scene="zone">1　流量与Zone</button><button class="tab" data-scene="rules">2　Service与Port</button><button class="tab" data-scene="states">3　运行时与永久</button><button class="tab" data-scene="rich">4　来源限制与回滚</button></nav>
    <main>
      <section class="visual-card"><div class="visual-top"><h2 id="visualTitle"></h2><span class="concept" id="conceptTag"></span></div><div id="visual" aria-live="polite"></div></section>
      <aside class="lesson-card"><div class="counter" id="counter"></div><div><h2 id="stepTitle"></h2><p class="explain" id="stepText"></p></div><div class="question"><small>先判断，再验证</small><p id="questionText"></p></div><div class="controls"><button class="control" id="prev">←</button><button class="control" id="restart">↺</button><button class="control play" id="play">▶ 播放</button><button class="control" id="next">→</button></div></aside>
    </main>
    <footer><span>概念模型：以实际活动zone和客户端测试为准；远程修改前保留控制台与SSH会话</span><span>键盘：←/→ · 空格 · 1/2/3/4切换主题</span></footer>
  </div>
  <script>
    const scenes={
      zone:{title:'进入Rocky的流量先归入生效Zone，再匹配策略',tag:'packet → interface/source → zone → rule',steps:[
        {title:'防火墙位于网络到达与Socket接收之间',text:'ubuntu-client发出的请求先经过网络到达rocky-server，随后由内核防火墙规则处理；允许后才可能交给监听Socket。服务运行、端口监听和防火墙允许是不同条件。',q:'Rocky本机curl 127.0.0.1成功，能否证明Ubuntu一定能访问8080？',kind:'path'},
        {title:'Zone表示一组进入流量策略',text:'firewalld用zone组织信任边界和规则。进入接口及配置的来源条件会影响使用哪个zone；规则必须加到真正处理该流量的zone才有意义。',q:'把8080加到未承载实验网卡流量的zone，客户端结果会改变吗？',kind:'concept'},
        {title:'默认Zone不等于活动接口一定使用它',text:'NetworkManager连接可以显式绑定zone。只有接口没有显式归属时才可能采用默认zone，因此不能看到default=public就直接假定实验网卡在public。',q:'哪条命令能直接列出当前活动zone及其接口或来源？',kind:'active'},
        {title:'先找默认路由接口，再核对Zone',text:'课程先用ip route确定默认出口接口，再用firewall-cmd查询接口zone，并与--get-active-zones和NetworkManager活动连接交叉核对。结果冲突时停止修改。',q:'为什么不能把同一条规则同时加进所有zone来“确保生效”？',kind:'discover'},
        {title:'Zone不是网络连通性的替代品',text:'firewalld允许只代表主机防火墙这一层没有阻止匹配流量。地址、路由、VMware网络、服务监听、应用配置和SELinux仍可能让访问失败。',q:'规则query返回yes但curl超时，下一步应只反复添加规则吗？',kind:'boundary'}
      ]},
      rules:{title:'规则决定允许什么流量，应用决定是否提供服务',tag:'service definition / explicit port / socket',steps:[
        {title:'Service是可读的预定义服务对象',text:'firewalld的ssh、http、https等service对象包含一个或多个端口、协议及可选辅助信息。添加service是在规则中允许这些流量，不是启动同名systemd服务。',q:'firewall-cmd --add-service=http成功后，Nginx会自动启动吗？',kind:'service'},
        {title:'Port规则直接描述端口和传输层协议',text:'--add-port=8080/tcp只允许TCP 8080；8080/udp是另一条规则。自定义实验端口常用port，标准服务优先使用可读的service对象。',q:'只开放8080/tcp时，发往8080/udp的数据包是否因此被允许？',kind:'port'},
        {title:'监听地址仍决定服务接收范围',text:'即使防火墙允许8080/tcp，服务若只监听127.0.0.1:8080，来自Ubuntu、目标为Rocky网卡地址的连接仍无法命中Socket。',q:'防火墙规则能否把127.0.0.1监听自动改成0.0.0.0监听？',kind:'listen'},
        {title:'一次成功访问需要多层同时成立',text:'目标IP正确、路由可达、firewalld允许、进程在目标地址端口监听，应用才能返回预期内容。HTTP状态码还需要应用真正收到并处理请求。',q:'Ubuntu得到HTTP 404时，说明防火墙通常已经允许到哪一层？',kind:'layers'},
        {title:'最小开放只保留真实业务需要',text:'开放规则应明确端口、协议、来源和期限。SSH等管理入口尽量限制来源；数据库和Redis不因“可能以后用”就向整个实验网开放。服务撤销后也应清理遗留规则。',q:'端口没有进程监听时，保留防火墙开放是否仍会扩大未来风险？',kind:'minimum'}
      ]},
      states:{title:'运行时与永久配置是两份需要主动同步的状态',tag:'runtime now ↔ permanent after reload',steps:[
        {title:'运行时规则立即改变当前行为',text:'不带--permanent添加规则时，当前运行配置立即生效，适合先试验和从真实客户端验证；firewalld reload或服务重启后，这类临时规则会丢失。',q:'运行时开放8080并验证成功后，重启仍一定保留吗？',kind:'runtime'},
        {title:'永久规则写入磁盘但不立即改变当前行为',text:'带--permanent修改永久配置，命令成功后当前运行时规则通常还没有变化。需要reload，永久配置才成为新的运行配置。',q:'永久query为yes、运行时query为no时，Ubuntu此刻能否依靠这条永久规则访问？',kind:'permanent'},
        {title:'reload用永久配置重建运行时状态',text:'reload会让永久规则生效，同时丢弃尚未永久化的运行时变更。执行前要比较两套状态，并确认SSH等管理规则已在永久配置中。',q:'只在运行时允许SSH，却直接reload，可能发生什么？',kind:'reload'},
        {title:'正确流程先运行时验证，再永久化复测',text:'课程采用记录基线、添加运行时规则、客户端验证、写入永久规则、reload、再次客户端验证的顺序。每一步都有明确证据和回退点。',q:'为什么永久化后还要在reload之后重新从Ubuntu测试？',kind:'workflow'},
        {title:'查询两套状态不能只看success',text:'firewall-cmd返回success只说明管理操作被接受。应分别查询运行时和永久规则，再从真实ubuntu-client执行nc或curl证明端到端结果。',q:'提交一张add-port返回success的截图，缺少哪两类证据？',kind:'verify'}
      ]},
      rich:{title:'Rich Rule把来源、端口、协议和动作组合起来',tag:'source + destination service/port + action',steps:[
        {title:'来源限制需要稳定且真实的客户端地址',text:'规则中的source必须是Ubuntu访问Rocky时实际使用的源IPv4，而不是照抄文档示例、Rocky地址或另一台虚拟机地址。先用ip route get确认。',q:'Ubuntu有多个地址时，只看ip addr中的第一项是否足够？',kind:'source'},
        {title:'一条来源规则包含完整匹配条件',text:'课程rich rule使用IPv4、Ubuntu /32来源、TCP 8080和accept动作。只有同时满足条件的进入流量才由这条规则允许。',q:'来源正确但协议写成udp，这条规则会允许HTTP TCP连接吗？',kind:'parts'},
        {title:'允许规则叠加，宽规则不会被窄规则覆盖',text:'如果同一zone还保留普通8080/tcp开放，所有来源已经被宽规则允许。再添加“只允许Ubuntu”的rich rule不会收窄普通规则，必须清除冲突的全局开放。',q:'为什么正确的rich rule存在，Windows宿主机仍可能访问成功？',kind:'overlap'},
        {title:'验证必须同时包含允许来源和非允许来源',text:'从Ubuntu验证应成功；有条件时再从另一来源验证应失败。至少要证明普通8080开放已不存在，并保存rich rule、客户端源地址和访问结果。',q:'只验证Ubuntu成功，能否证明其他来源一定被拒绝？',kind:'test'},
        {title:'安全变更以回滚和最终基线结束',text:'修改前保存状态并保留控制台和已有SSH会话；测试完成后用完全对应的规则删除命令回滚，结束临时服务，再确认端口、运行时和永久状态符合预期。',q:'删除运行时rich rule后，若永久副本仍存在并reload，会发生什么？',kind:'rollback'}
      ]}
    };
    let sceneKey='zone',stepIndex=0,timer=null;
    const byId=id=>document.getElementById(id);
    function zoneVisual(s){
      if(s.kind==='path')return '<div class="board"><div class="flow"><div class="node blue"><strong>ubuntu-client</strong><small>curl :8080</small></div><div class="arrow">→</div><span class="packet">TCP数据包</span><div class="arrow">→</div><div class="node purple pulse"><strong>firewalld</strong><small>进入流量判定</small></div><div class="arrow">→</div><div class="node active"><strong>监听Socket</strong><small>0.0.0.0:8080</small></div></div><div class="terminal"><span class="hi">本机访问成功，不会跳过所有外部入站条件</span></div></div>';
      if(s.kind==='concept')return '<div class="board"><div class="zone"><h3>public zone</h3><div class="rules"><div class="rule match"><strong>ssh service</strong><small>允许</small></div><div class="rule match pulse"><strong>8080/tcp</strong><small>允许</small></div><div class="rule no"><strong>3306/tcp</strong><small>未允许</small></div></div></div><div class="flow"><span class="packet">ens160进入流量</span><div class="arrow">→</div><span class="badge">匹配public策略</span></div></div>';
      if(s.kind==='active')return '<div class="board"><div class="grid2"><div class="card warn"><strong>默认Zone</strong><small>public<br>仅是未显式归属时的默认选择</small></div><div class="card active pulse"><strong>活动Zone</strong><small>work<br>interfaces: ens160</small></div></div><div class="terminal"><b>$</b> firewall-cmd --get-default-zone<br>public<br><b>$</b> firewall-cmd --get-active-zones<br><span class="hi">work　interfaces: ens160</span></div></div>';
      if(s.kind==='discover')return '<div class="board"><div class="flow"><div class="node active">默认路由</div><div class="arrow">→</div><div class="node active">接口 ens160</div><div class="arrow">→</div><div class="node active pulse">查询接口Zone</div><div class="arrow">→</div><div class="node active">核对活动Zone</div></div><div class="terminal"><b>$</b> ip route show default<br><b>$</b> firewall-cmd --get-zone-of-interface="$IFACE"<br><b>$</b> firewall-cmd --get-active-zones</div></div>';
      return '<div class="board"><div class="layers"><div class="layer active"><strong>地址/路由</strong><small>目标可达</small></div><div class="layer active"><strong>firewalld</strong><small>规则允许</small></div><div class="layer fail pulse"><strong>监听</strong><small>服务未启动</small></div><div class="layer dim"><strong>应用/SELinux</strong><small>尚未到达</small></div></div><div class="terminal"><span class="bad">防火墙允许只是整条链路中的一个条件</span></div></div>';
    }
    function rulesVisual(s){
      if(s.kind==='service')return '<div class="board"><div class="definition"><div class="card purple"><strong>service: http</strong><small>预定义、可读的规则对象</small></div><div class="arrow">→</div><div class="card active"><strong>80/tcp</strong><small>允许进入流量</small></div></div><div class="grid2"><div class="card warn"><strong>firewall-cmd</strong><small>不会启动Nginx</small></div><div class="card warn"><strong>systemctl start nginx</strong><small>不会自动开放防火墙</small></div></div><div class="terminal"><b>$</b> firewall-cmd --info-service=http</div></div>';
      if(s.kind==='port')return '<div class="board"><div class="ports"><span class="port pulse">8080/tcp ✓</span><span class="port">8080/udp ✕</span><span class="port">80/tcp ✕</span></div><div class="terminal"><b>$</b> firewall-cmd --zone="$ZONE" --add-port=8080/tcp<br><span class="hi">端口号相同但协议不同，是不同规则</span></div></div>';
      if(s.kind==='listen')return '<div class="board"><div class="flow"><div class="node blue"><strong>Ubuntu</strong><small>目标：Rocky网卡IP:8080</small></div><div class="arrow">→</div><div class="node active"><strong>firewalld</strong><small>8080/tcp允许</small></div><div class="arrow">→</div><div class="node fail pulse"><strong>127.0.0.1:8080</strong><small>外部目标无法命中</small></div></div><div class="terminal"><b>$</b> ss -lntp | grep :8080<br><span class="bad">规则不能改变应用监听地址</span></div></div>';
      if(s.kind==='layers')return '<div class="board"><div class="layers"><div class="layer active">目标IP/路由</div><div class="layer active">firewalld</div><div class="layer active">Socket监听</div><div class="layer active pulse">HTTP 404响应</div></div><div class="row"><span class="badge">404证明请求已经到达HTTP应用层</span></div></div>';
      return '<div class="board"><div class="grid3"><div class="card active"><strong>SSH/22</strong><small>管理需要<br>限制来源</small></div><div class="card active"><strong>HTTP/80</strong><small>业务需要<br>对目标用户开放</small></div><div class="card fail pulse"><strong>MySQL/3306</strong><small>无外部需求<br>不开放</small></div></div><div class="terminal"><span class="hi">最小开放 = 业务、协议、来源和期限都明确</span></div></div>';
    }
    function statesVisual(s){
      if(s.kind==='runtime')return '<div class="board"><div class="statepair"><div class="state runtime pulse"><h3>运行时</h3><div class="ruleline yes">8080/tcp <span>YES</span></div><small>立即影响当前数据包</small></div><div class="arrow">≠</div><div class="state permanent"><h3>永久</h3><div class="ruleline no">8080/tcp <span>NO</span></div><small>磁盘配置尚未写入</small></div></div><div class="terminal"><b>$</b> firewall-cmd --zone="$ZONE" --add-port=8080/tcp</div></div>';
      if(s.kind==='permanent')return '<div class="board"><div class="statepair"><div class="state runtime"><h3>运行时</h3><div class="ruleline no">8080/tcp <span>NO</span></div><small>当前流量未改变</small></div><div class="arrow">≠</div><div class="state permanent pulse"><h3>永久</h3><div class="ruleline yes">8080/tcp <span>YES</span></div><small>等待reload载入</small></div></div><div class="terminal"><b>$</b> firewall-cmd <span class="hi">--permanent</span> --zone="$ZONE" --add-port=8080/tcp</div></div>';
      if(s.kind==='reload')return '<div class="board"><div class="statepair"><div class="state permanent"><h3>永久配置</h3><div class="ruleline yes">ssh service</div><div class="ruleline yes">8080/tcp</div></div><div class="reload pulse">↻</div><div class="state runtime"><h3>新的运行时</h3><div class="ruleline yes">ssh service</div><div class="ruleline yes">8080/tcp</div><small>运行时临时差异被替换</small></div></div><div class="terminal"><b>$</b> sudo firewall-cmd --reload</div></div>';
      if(s.kind==='workflow')return '<div class="board"><div class="loop"><div class="node active">保存基线<br><small>保留控制台</small></div><div class="node active">运行时试验<br><small>Ubuntu验证</small></div><div class="node active">写入永久<br><small>reload</small></div><div class="node active pulse">再次验证<br><small>保存证据</small></div></div><div class="terminal"><span class="hi">先证明规则正确，再让它跨重载保留</span></div></div>';
      return '<div class="board"><div class="grid3"><div class="card active"><strong>状态证据</strong><small>runtime query/list</small></div><div class="card active"><strong>持久证据</strong><small>permanent query/list</small></div><div class="card active pulse"><strong>功能证据</strong><small>Ubuntu nc/curl</small></div></div><div class="terminal"><span class="bad">success只证明命令被接受，不证明端到端业务成功</span></div></div>';
    }
    function richVisual(s){
      if(s.kind==='source')return '<div class="board"><div class="flow"><div class="node blue"><strong>ubuntu-client</strong><small>多个接口/地址</small></div><div class="arrow">→</div><div class="node active pulse"><strong>ip route get Rocky_IP</strong><small>src 192.168.200.30</small></div><div class="arrow">→</div><span class="packet">source /32</span></div><div class="terminal"><b>$</b> ip route get "$ROCKY_SERVER_IP"<br><span class="hi">使用实际选中的源地址，不照抄示例</span></div></div>';
      if(s.kind==='parts')return '<div class="board"><div class="rich"><div class="part active"><strong>family</strong><small>ipv4</small></div><div class="part active"><strong>source</strong><small>Ubuntu_IP/32</small></div><div class="part active"><strong>port</strong><small>8080 tcp</small></div><div class="part active pulse"><strong>action</strong><small>accept</small></div></div><div class="terminal">rule family=ipv4 source address=192.168.200.30/32 port port=8080 protocol=tcp accept</div></div>';
      if(s.kind==='overlap')return '<div class="board"><div class="zone"><h3>同一Zone中的允许规则叠加</h3><div class="grid2"><div class="rule wide pulse"><strong>普通 8080/tcp</strong><small>所有来源均可匹配</small></div><div class="rule match"><strong>Ubuntu /32 rich rule</strong><small>Ubuntu来源可匹配</small></div></div></div><div class="clients"><div class="client allow"><strong>Ubuntu</strong><small>允许</small></div><div class="client allow"><strong>其他来源</strong><small>仍被普通规则允许</small></div></div><div class="warning">窄的允许规则不会自动覆盖或收紧已有的宽允许规则</div></div>';
      if(s.kind==='test')return '<div class="board"><div class="clients"><div class="client allow pulse"><strong>Ubuntu实际源IP</strong><small>curl成功<br>正向验证</small></div><div class="client deny"><strong>另一来源</strong><small>访问失败<br>反向验证</small></div></div><div class="grid2"><div class="card active"><strong>规则证据</strong><small>list-rich-rules</small></div><div class="card active"><strong>不存在宽规则</strong><small>query-port=8080/tcp → no</small></div></div></div>';
      return '<div class="board"><div class="loop"><div class="node active">变更前基线</div><div class="node active">运行时验证</div><div class="node active">永久化/复测</div><div class="node active pulse">精确回滚/终态</div></div><div class="terminal"><b>$</b> firewall-cmd --remove-rich-rule="$RULE"<br><b>$</b> ss -lnt | grep :8080 || echo stopped<br><span class="hi">同时检查运行时、永久配置和客户端结果</span></div></div>';
    }
    function render(){
      const scene=scenes[sceneKey],step=scene.steps[stepIndex];
      byId('visualTitle').textContent=scene.title;byId('conceptTag').textContent=scene.tag;
      byId('counter').textContent='第 '+(stepIndex+1)+' / '+scene.steps.length+' 步';
      byId('stepTitle').textContent=step.title;byId('stepText').textContent=step.text;byId('questionText').textContent=step.q;
      byId('visual').innerHTML=sceneKey==='zone'?zoneVisual(step):sceneKey==='rules'?rulesVisual(step):sceneKey==='states'?statesVisual(step):richVisual(step);
      document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.scene===sceneKey));
    }
    function stop(){if(timer){clearInterval(timer);timer=null}byId('play').textContent='▶ 播放'}
    function next(){const n=scenes[sceneKey].steps.length;stepIndex=stepIndex<n-1?stepIndex+1:0;render()}
    function previous(){const n=scenes[sceneKey].steps.length;stepIndex=(stepIndex-1+n)%n;render()}
    function togglePlay(){if(timer){stop();return}byId('play').textContent='Ⅱ 暂停';timer=setInterval(next,4300)}
    document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{stop();sceneKey=t.dataset.scene;stepIndex=0;render()}));
    byId('prev').addEventListener('click',()=>{stop();previous()});byId('next').addEventListener('click',()=>{stop();next()});byId('restart').addEventListener('click',()=>{stop();stepIndex=0;render()});byId('play').addEventListener('click',togglePlay);
    document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();next()}else if(e.key==='ArrowLeft'){stop();previous()}else if(e.key===' '){e.preventDefault();togglePlay()}else if('1234'.includes(e.key)){stop();sceneKey=['zone','rules','states','rich'][Number(e.key)-1];stepIndex=0;render()}});
    render();
  </script>
</body>
</html>
