<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Socket、TCP、HTTP与TLS端到端访问</title>
  <style>
    :root{color-scheme:dark;--bg:#071019;--panel:rgba(14,27,43,.94);--panel2:#142a40;--text:#eff7ff;--muted:#9fb1c5;--line:#486078;--blue:#61a5ff;--cyan:#65dcf6;--green:#62e6a5;--yellow:#ffd166;--purple:#bd95ff;--red:#ff7180;--shadow:0 22px 58px rgba(0,0,0,.35)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:radial-gradient(circle at 12% 10%,rgba(97,165,255,.19),transparent 30%),radial-gradient(circle at 90% 88%,rgba(189,149,255,.15),transparent 30%),linear-gradient(145deg,#050a11,var(--bg) 56%,#0c1930)}
    button{font:inherit}.app{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;gap:14px;padding:22px clamp(18px,3vw,44px) 18px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.eyebrow{margin:0 0 6px;color:var(--blue);font-size:13px;font-weight:900;letter-spacing:.16em}h1{margin:0;font-size:clamp(26px,3vw,42px);line-height:1.1}.tag{padding:9px 13px;border:1px solid rgba(98,230,165,.3);border-radius:999px;color:var(--green);background:rgba(98,230,165,.08);font-size:13px}
    .tabs{display:flex;gap:9px;padding:9px;border:1px solid rgba(130,155,185,.22);border-radius:16px;background:rgba(7,15,27,.62);box-shadow:var(--shadow)}.tab{min-width:145px;padding:11px 16px;border:1px solid transparent;border-radius:11px;color:var(--muted);background:transparent;cursor:pointer;transition:.2s}.tab:hover{color:var(--text);background:rgba(255,255,255,.05)}.tab.active{color:#06151e;background:var(--blue);font-weight:900;box-shadow:0 8px 22px rgba(97,165,255,.22)}
    main{min-height:0;display:grid;grid-template-columns:minmax(630px,1.67fr) minmax(310px,.72fr);gap:14px}.visual-card,.lesson-card{border:1px solid rgba(130,155,185,.22);border-radius:20px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}.visual-card{min-height:570px;padding:22px}.visual-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.visual-top h2{margin:0;font-size:20px}.concept{padding:7px 10px;border:1px solid rgba(101,220,246,.28);border-radius:999px;color:var(--cyan);background:rgba(101,220,246,.08);font-size:12px;font-weight:800}#visual{min-height:475px;display:grid;align-content:center}
    .lesson-card{display:grid;grid-template-rows:auto auto 1fr auto;padding:22px}.counter{color:var(--blue);font-size:13px;font-weight:900;letter-spacing:.08em}.lesson-card h2{margin:8px 0 10px;font-size:clamp(22px,2.2vw,30px);line-height:1.22}.explain{margin:0;color:#ccd9e7;font-size:16px;line-height:1.72}.question{align-self:end;margin-top:18px;padding:16px;border-left:4px solid var(--yellow);border-radius:0 12px 12px 0;background:rgba(255,209,102,.08)}.question small{display:block;color:var(--yellow);font-weight:900;margin-bottom:5px}.question p{margin:0;color:#f7e8bc;line-height:1.55}
    .controls{display:grid;grid-template-columns:44px 44px 1fr 44px;gap:9px;margin-top:18px}.control{height:44px;border:1px solid rgba(134,158,192,.3);border-radius:11px;color:var(--text);background:var(--panel2);cursor:pointer}.control:hover{border-color:var(--blue)}.control.play{color:#06151e;background:var(--blue);border-color:var(--blue);font-weight:900}footer{display:flex;justify-content:space-between;gap:18px;color:var(--muted);font-size:12px}
    .card{padding:14px;border:2px solid var(--line);border-radius:14px;background:#10243a;text-align:center;transition:.25s}.card strong{display:block;margin-bottom:5px}.card small{color:var(--muted)}.card.active{border-color:var(--green);background:rgba(98,230,165,.1);box-shadow:0 0 24px rgba(98,230,165,.18)}.card.warn{border-color:var(--yellow);background:rgba(255,209,102,.08)}.card.fail{border-color:var(--red);background:rgba(255,113,128,.09)}.card.dim{opacity:.3}.arrow{color:var(--green);font-size:25px;text-align:center;font-weight:900}.arrow.back{color:var(--cyan)}.badge{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:7px;color:#06151e;background:var(--green);font-size:11px;font-weight:900}.badge.warn{background:var(--yellow)}.badge.fail{color:#fff;background:var(--red)}
    .terminal{padding:14px 17px;border:1px solid #293d51;border-radius:12px;background:#03090f;color:#dae7f3;font:13px/1.6 Consolas,monospace;white-space:normal}.terminal b{color:var(--green)}

    /* socket */
    .socket{display:grid;gap:15px}.object-flow{display:grid;grid-template-columns:1fr 65px 1fr 65px 1fr;gap:9px;align-items:center}.socket-box{padding:16px;border:2px solid var(--purple);border-radius:14px;background:rgba(189,149,255,.08);text-align:center}.socket-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.field{padding:10px;border:1px solid var(--line);border-radius:10px}.field b{display:block;color:var(--cyan)}.bind-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.listener{padding:15px;border:2px solid var(--line);border-radius:13px;background:#10243a;text-align:center}.listener.active{border-color:var(--green)}.listener.fail{border-color:var(--red)}.scope{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px}.host{min-width:145px;padding:13px;border:2px solid var(--blue);border-radius:12px;text-align:center;background:#10243a}.host.accept{border-color:var(--green)}.host.warn{border-color:var(--yellow)}.host.reject{border-color:var(--red);opacity:.65}

    /* tcp */
    .tcp{display:grid;gap:15px}.peers{display:grid;grid-template-columns:1fr 110px 1fr;gap:12px;align-items:center}.peer{padding:16px;border:2px solid var(--blue);border-radius:14px;text-align:center;background:#10243a}.peer.server{border-color:var(--purple)}.wire{display:grid;gap:8px}.segment{padding:9px 12px;border:2px solid var(--line);border-radius:999px;text-align:center;background:#10243a}.segment.current{border-color:var(--green);background:rgba(98,230,165,.1)}.segment.fail{border-color:var(--red);color:#ffc2c8}.tuple{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tuple span{padding:11px 6px;border:1px solid var(--line);border-radius:10px;text-align:center}.state-line{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px}.state{padding:10px;border:2px solid var(--line);border-radius:10px}.state.current{border-color:var(--green)}.compare{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

    /* http */
    .http{display:grid;gap:14px}.request-flow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px}.layer{padding:11px;border:2px solid var(--line);border-radius:11px;text-align:center;background:#10243a}.layer.current{border-color:var(--green);background:rgba(98,230,165,.09)}.message{display:grid;grid-template-columns:1fr 65px 1fr;gap:9px;align-items:center}.http-msg{padding:15px;border:2px solid var(--line);border-radius:13px;background:#03090f;font:13px/1.55 Consolas,monospace}.http-msg.request{border-color:var(--blue)}.http-msg.response{border-color:var(--green)}.http-msg .first{color:var(--yellow);font-weight:900}.vhosts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.vhost{padding:13px;border:2px solid var(--line);border-radius:12px;text-align:center}.vhost.active{border-color:var(--green)}.status-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.status{padding:13px;border:2px solid var(--line);border-radius:12px;text-align:center}.status strong{display:block;font-size:22px}.status.ok{border-color:var(--green)}.status.client{border-color:var(--yellow)}.status.server{border-color:var(--red)}

    /* tls */
    .tls{display:grid;gap:14px}.handshake{display:grid;grid-template-columns:1fr 120px 1fr;gap:10px;align-items:center}.endpoint{padding:16px;border:2px solid var(--blue);border-radius:14px;text-align:center;background:#10243a}.endpoint.server{border-color:var(--purple)}.flights{display:grid;gap:8px}.flight{padding:9px;border:2px solid var(--line);border-radius:11px;text-align:center}.flight.current{border-color:var(--green);background:rgba(98,230,165,.09)}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.check{padding:14px;border:2px solid var(--line);border-radius:12px;text-align:center}.check.pass{border-color:var(--green)}.check.fail{border-color:var(--red)}.lock{font-size:48px;text-align:center}.warning{padding:14px;border:1px solid var(--red);border-radius:12px;color:#ffc5ca;background:rgba(255,113,128,.08);text-align:center}
    @keyframes pulse{50%{box-shadow:0 0 28px rgba(98,230,165,.45);transform:scale(1.025)}}.pulse{animation:pulse 1.25s ease-in-out infinite}
    @media(max-width:980px){.app{min-height:auto}header{align-items:flex-start;flex-direction:column}.tabs{flex-wrap:wrap}main{grid-template-columns:1fr}.visual-card{min-height:540px}}
    @media(max-width:680px){.tab{min-width:0;flex:1 1 45%}.object-flow,.peers,.message,.handshake{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.bind-grid,.socket-fields,.vhosts,.checks{grid-template-columns:1fr}.tuple,.status-grid{grid-template-columns:repeat(2,1fr)}.compare{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="app">
    <header><div><p class="eyebrow">模块二 · 第14/16章 · Linux实验9</p><h1>Socket、TCP、HTTP与TLS端到端访问</h1></div><div class="tag">逐层成功，才构成一次完整访问</div></header>
    <nav class="tabs" aria-label="动画主题"><button class="tab active" data-scene="socket">1　Socket与监听</button><button class="tab" data-scene="tcp">2　TCP连接</button><button class="tab" data-scene="http">3　HTTP消息</button><button class="tab" data-scene="tls">4　TLS握手</button></nav>
    <main>
      <section class="visual-card"><div class="visual-top"><h2 id="visualTitle"></h2><span class="concept" id="conceptTag"></span></div><div id="visual" aria-live="polite"></div></section>
      <aside class="lesson-card"><div class="counter" id="counter"></div><div><h2 id="stepTitle"></h2><p class="explain" id="stepText"></p></div><div class="question"><small>先判断，再验证</small><p id="questionText"></p></div><div class="controls"><button class="control" id="prev">←</button><button class="control" id="restart">↺</button><button class="control play" id="play">▶ 播放</button><button class="control" id="next">→</button></div></aside>
    </main>
    <footer><span>客户端错误只是现象；结合服务端进程、监听、日志和抓包才能确认根因</span><span>键盘：←/→ · 空格 · 1/2/3/4切换主题</span></footer>
  </div>
  <script>
    const scenes={
      socket:{title:'进程通过Socket绑定协议、本地地址和端口',tag:'process → socket → protocol/address/port',steps:[
        {title:'端口属于运行中的Socket',text:'端口不是某个软件永远占有的编号。进程创建Socket并绑定协议、本地地址和端口；进程退出或Socket关闭后，监听也随之消失。',q:'只看到配置文件写着8080，能否证明系统当前真的监听8080？',kind:'model'},
        {title:'TCP与UDP的53端口可以同时存在',text:'协议是Socket身份的一部分。TCP 53和UDP 53不是同一个监听；UDP没有TCP三次握手，端口探测必须结合真实应用协议验证。',q:'nc对UDP端口没有报错，是否足以证明DNS服务工作正常？',kind:'protocol'},
        {title:'127.0.0.1只接受本机回环访问',text:'服务绑定127.0.0.1:8080时，只接收发往本机IPv4回环地址的连接。即使同一主机访问自己的网卡地址，也不会命中这个监听。',q:'Rocky本机curl 127.0.0.1成功，Ubuntu客户端为什么仍可能失败？',kind:'loopback'},
        {title:'0.0.0.0表示所有本地IPv4接口',text:'0.0.0.0:8080是通配监听，接受发往本机任一IPv4地址的连接；它不是供客户端访问的目标地址，也不代表防火墙和路由一定允许外部进入。',q:'客户端应访问0.0.0.0:8080，还是服务器实际网卡地址:8080？',kind:'wildcard'},
        {title:'绑定冲突要同时看协议与地址范围',text:'同一网络命名空间中，已有进程占用TCP通配地址8080时，另一个普通Socket通常不能再绑定同一TCP端口。具体行为还受地址、IPv4/IPv6和复用选项影响。',q:'提示Address already in use时，第一条只读检查命令是什么？',kind:'conflict'}
      ]},
      tcp:{title:'一次TCP连接由四元组唯一描述',tag:'source IP:port ↔ destination IP:port',steps:[
        {title:'客户端使用临时源端口连接监听端口',text:'ubuntu-client发起连接时，内核选择一个临时源端口；服务器目标端口为8080。源IP、源端口、目标IP、目标端口共同区分连接。',q:'多名客户端能否同时连接同一服务器的8080端口？',kind:'tuple'},
        {title:'三次握手建立双方初始状态',text:'客户端发送SYN，服务器监听Socket返回SYN-ACK，客户端再发送ACK。只有到达ESTABLISHED，应用层HTTP或SSH数据才开始正常交换。',q:'nc显示succeeded证明了TCP握手还是HTTP页面内容？',kind:'handshake'},
        {title:'监听Socket与已连接Socket并存',text:'服务器保留LISTEN Socket继续接收新连接，每个已接受连接拥有独立四元组并显示ESTAB。不能把“8080只有一个监听”误解成“只能服务一个客户端”。',q:'ss -lnt与ss -nt分别更适合观察哪类Socket？',kind:'accepted'},
        {title:'refused通常表示收到明确拒绝',text:'目标可达但该地址端口无监听时，系统通常返回RST，客户端很快得到Connection refused；防火墙主动reject也可能产生类似现象，仍需服务端ss交叉验证。',q:'出现refused时，优先检查DNS还是目标地址上的监听？',kind:'refused'},
        {title:'timeout表示等待期内没有有效响应',text:'路由不通、目标离线、防火墙静默drop等都可能让SYN得不到有效回答，客户端最终超时。timeout不是单一根因，应结合路由、防火墙和抓包继续定位。',q:'如何用refused与timeout的差异缩小范围，而不把它们当作唯一结论？',kind:'timeout'}
      ]},
      http:{title:'HTTP消息运行在已经建立的TCP连接之上',tag:'request line · headers · body',steps:[
        {title:'先完成解析和TCP，再发送HTTP',text:'使用名称访问时先获得IP，再选择路由并建立目标端口TCP连接。任何前置层失败，服务器都收不到HTTP请求，也不会返回HTTP状态码。',q:'curl提示Could not resolve host时，Web服务器日志里一定有请求记录吗？',kind:'layers'},
        {title:'请求由请求行、Header和可选Body组成',text:'GET /index.html HTTP/1.1描述方法、目标和版本；Host用于选择目标站点；Header结束后才是可选请求体。curl -v能观察请求与响应方向。',q:'同一IP承载多个虚拟主机时，服务器主要根据哪个Header选择站点？',kind:'request'},
        {title:'Host与URI共同影响资源选择',text:'服务器先依据目标地址/端口和Host选择虚拟主机，再根据URI匹配资源或代理规则。DNS只把名称转换成地址，不决定服务器最终返回哪个文件。',q:'hosts指向正确IP但Host写错，是否仍可能进入默认站点？',kind:'host'},
        {title:'响应包含状态行、Header和可选Body',text:'HTTP/1.1 200 OK是协议结果；Content-Type和Content-Length等Header描述响应。TCP成功只说明通道建立，HTTP 404仍是一次成功到达应用的响应。',q:'curl得到404时，应继续检查防火墙还是资源路径和Web配置？',kind:'response'},
        {title:'状态码帮助定位应用层方向',text:'2xx通常表示成功，3xx表示重定向，4xx表示请求或资源侧问题，5xx表示服务器或上游失败。状态码缩小范围，但最终仍要结合配置和日志。',q:'Nginx返回502时，最优先检查静态文件权限还是反向代理上游？',kind:'status'}
      ]},
      tls:{title:'TLS先验证身份并协商密钥，再保护HTTP',tag:'TCP → TLS handshake → encrypted HTTP',steps:[
        {title:'TLS握手建立在TCP连接之上',text:'HTTPS通常先完成TCP三次握手，然后才发送TLS ClientHello。如果TCP端口不可达，不会进入证书验证阶段。',q:'curl提示Connection refused时，应先更换证书还是检查8443监听？',kind:'tcp'},
        {title:'ClientHello提出能力并携带SNI',text:'客户端发送支持的TLS版本、密码套件、随机数、密钥协商材料等；SNI通常携带目标主机名，帮助同一IP上的服务器选择证书。',q:'多个HTTPS站点共用一个IP时，服务端如何在握手阶段选择证书？',kind:'hello'},
        {title:'服务端返回协商结果和证书',text:'ServerHello确认版本和算法，并提供证书链等握手信息。现代客户端主要用证书SAN匹配访问名称，同时检查有效期和信任链。',q:'证书SAN只有training-web.test，用IP地址访问会不会出现名称不匹配？',kind:'certificate'},
        {title:'验证和密钥协商成功后加密HTTP',text:'双方完成证书验证、密钥协商和Finished校验后得到会话密钥。之后HTTP请求与响应被TLS记录层加密，旁路观察者不能直接读取明文内容。',q:'HTTPS是否隐藏服务器IP和TCP端口？',kind:'encrypted'},
        {title:'-k跳过验证，不会让证书变可信',text:'实验自签名证书没有受信任CA链，默认curl应失败。-k只为本实验观察加密服务而关闭身份验证，不安装信任、不修复过期或名称错误，也不应作为生产方案。',q:'curl -k成功能证明“证书配置完全正确”吗？',kind:'selfsigned'}
      ]}
    };
    let sceneKey='socket',stepIndex=0,timer=null;const byId=id=>document.getElementById(id);const esc=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    function socketVisual(s){
      if(s.kind==='model')return '<div class="socket"><div class="object-flow"><div class="card active"><strong>python3进程</strong><small>PID 3250</small></div><div class="arrow">创建 →</div><div class="socket-box pulse"><strong>监听Socket</strong><div class="socket-fields"><div class="field"><b>TCP</b>协议</div><div class="field"><b>0.0.0.0</b>本地地址</div><div class="field"><b>8080</b>本地端口</div></div></div><div class="arrow">由内核维护 →</div><div class="card"><strong>LISTEN</strong><small>等待新连接</small></div></div><div class="terminal"><b>$</b> ss -lntp | grep :8080</div></div>';
      if(s.kind==='protocol')return '<div class="socket"><div class="bind-grid"><div class="listener active pulse"><strong>UDP 53</strong><small>DNS常规查询<br>保留数据报边界</small></div><div class="listener active pulse"><strong>TCP 53</strong><small>大响应/区域传送等<br>连接字节流</small></div><div class="listener"><strong>端口号相同</strong><small>协议不同，所以是不同Socket</small></div></div><div class="terminal"><b>$</b> sudo ss -lntup | grep :53</div></div>';
      if(s.kind==='loopback')return '<div class="socket"><div class="scope"><div class="host accept">Rocky本机<br><small>127.0.0.1:8080</small><span class="badge">接受</span></div><span class="arrow">→</span><div class="listener active pulse"><strong>127.0.0.1:8080</strong><small>回环监听</small></div><span class="arrow back">←</span><div class="host reject">ubuntu-client<br><small>192.168.200.30</small><span class="badge fail">无法命中</span></div></div><div class="terminal"><b>$</b> python3 -m http.server 8080 --bind 127.0.0.1</div></div>';
      if(s.kind==='wildcard')return '<div class="socket"><div class="scope"><div class="host accept">127.0.0.1<br><span class="badge">本机可达</span></div><div class="host accept">192.168.200.10<br><span class="badge">网卡地址可监听</span></div><div class="listener active pulse"><strong>0.0.0.0:8080</strong><small>所有本地IPv4地址</small></div><div class="host warn">外部客户端<br><small>仍检查路由与防火墙</small></div></div><div class="terminal"><b>$</b> python3 -m http.server 8080 --bind 0.0.0.0</div></div>';
      return '<div class="socket"><div class="bind-grid"><div class="listener active"><strong>PID 3250</strong><small>TCP 0.0.0.0:8080<br>已占用范围</small></div><div class="listener fail pulse"><strong>PID 4120</strong><small>再次绑定TCP :8080<br>Address already in use</small></div><div class="listener"><strong>先查占用者</strong><small>确认进程身份后<br>决定换端口或停止</small></div></div><div class="terminal"><b>$</b> sudo ss -lntp | grep :8080<br><b>$</b> sudo lsof -nP -iTCP:8080 -sTCP:LISTEN</div></div>';
    }
    function tcpVisual(s){
      if(s.kind==='tuple')return '<div class="tcp"><div class="tuple"><span><b>源IP</b><br>192.168.200.30</span><span><b>源端口</b><br>49152</span><span><b>目标IP</b><br>192.168.200.10</span><span><b>目标端口</b><br>8080</span></div><div class="peers"><div class="peer">ubuntu-client<br><small>主动打开</small></div><div class="arrow">→</div><div class="peer server">rocky-server<br><small>被动监听</small></div></div><div class="terminal"><b>$</b> ss -ntp</div></div>';
      if(s.kind==='handshake')return '<div class="tcp"><div class="peers"><div class="peer">客户端<br><small>SYN-SENT → ESTABLISHED</small></div><div class="wire"><div class="segment current">SYN →</div><div class="segment current">← SYN-ACK</div><div class="segment current pulse">ACK →</div></div><div class="peer server">服务器<br><small>LISTEN → ESTABLISHED</small></div></div><div class="state-line"><span class="state">SYN-SENT</span><span class="arrow">→</span><span class="state">SYN-RECV</span><span class="arrow">→</span><span class="state current">ESTABLISHED</span></div><div class="terminal"><b>$</b> nc -vz -w 3 192.168.200.10 8080</div></div>';
      if(s.kind==='accepted')return '<div class="tcp"><div class="compare"><div class="card active"><strong>监听Socket</strong><small>0.0.0.0:8080 · LISTEN<br>继续接收新连接</small></div><div class="card active pulse"><strong>已连接Socket</strong><small>192.168.200.10:8080 ↔ 192.168.200.30:49152<br>ESTABLISHED</small></div></div><div class="terminal"><b>$</b> ss -lntp | grep :8080<br><b>$</b> ss -ntp state established</div></div>';
      if(s.kind==='refused')return '<div class="tcp"><div class="peers"><div class="peer">客户端<br><small>发送SYN</small></div><div class="wire"><div class="segment current">SYN →</div><div class="segment fail pulse">← RST</div></div><div class="peer server fail">目标主机<br><small>该地址/端口无监听<br>或策略主动reject</small></div></div><div class="terminal"><b>curl</b>: Connection refused<br><b>服务端检查</b>: ss -lntp</div></div>';
      return '<div class="tcp"><div class="peers"><div class="peer">客户端<br><small>SYN多次重传</small></div><div class="wire"><div class="segment current">SYN →</div><div class="segment fail">… 无有效响应 …</div><div class="segment current pulse">SYN重传 →</div></div><div class="peer server dim">目标/路径<br><small>离线、路由故障或drop等</small></div></div><div class="terminal"><b>curl</b>: Connection timed out<br><b>继续取证</b>: ip route get / firewall / tcpdump</div></div>';
    }
    function httpVisual(s){
      const chain=current=>'<div class="request-flow">'+['名称解析','路由','TCP连接','HTTP请求','HTTP响应'].map((x,i)=>'<span class="layer '+(i===current?'current pulse':'')+'">'+x+'</span>'+(i<4?'<span class="arrow">→</span>':'')).join('')+'</div>';
      if(s.kind==='layers')return '<div class="http">'+chain(0)+'<div class="terminal"><b>$</b> curl -v http://training-web.test:8080/<br>Could not resolve host</div><div class="card fail"><strong>尚未得到目标IP</strong><small>后续TCP与HTTP都没有发生</small></div></div>';
      if(s.kind==='request')return '<div class="http">'+chain(3)+'<div class="message"><div class="http-msg request"><span class="first">GET /index.html HTTP/1.1</span><br>Host: training-web.test:8080<br>User-Agent: curl/8.x<br>Accept: */*<br><br>[可选Body]</div><span class="arrow">→</span><div class="card active"><strong>Web服务器</strong><small>解析请求行和Header</small></div></div></div>';
      if(s.kind==='host')return '<div class="http"><div class="terminal"><b>请求目标IP</b> 192.168.200.20:80<br><b>Host</b> techcorp.test<br><b>URI</b> /api/status</div><div class="vhosts"><div class="vhost">default_server<br><small>默认站点</small></div><div class="vhost active pulse">server_name techcorp.test<br><small>Host命中</small></div><div class="vhost">other.test<br><small>未命中</small></div></div><div class="card active"><strong>location /api/</strong><small>继续读取文件或转发上游</small></div></div>';
      if(s.kind==='response')return '<div class="http">'+chain(4)+'<div class="message"><div class="card"><strong>Web服务器</strong><small>资源查找完成</small></div><span class="arrow back">←</span><div class="http-msg response"><span class="first">HTTP/1.1 404 Not Found</span><br>Content-Type: text/html<br>Content-Length: 153<br><br>&lt;html&gt;...&lt;/html&gt;</div></div><div class="card warn"><strong>TCP已成功，HTTP明确返回404</strong><small>检查URI、root和文件，而不是先改网络</small></div></div>';
      return '<div class="http"><div class="status-grid"><div class="status ok"><strong>2xx</strong>成功</div><div class="status"><strong>3xx</strong>重定向</div><div class="status client"><strong>4xx</strong>请求/资源方向</div><div class="status server"><strong>5xx</strong>服务/上游方向</div></div><div class="compare"><div class="card warn"><strong>404</strong><small>服务可达，资源不存在或URI不匹配</small></div><div class="card fail pulse"><strong>502</strong><small>代理无法获得有效上游响应</small></div></div><div class="terminal"><b>$</b> curl -sS -o /dev/null -w &quot;%{http_code}\\n&quot; URL</div></div>';
    }
    function tlsVisual(s){
      if(s.kind==='tcp')return '<div class="tls"><div class="request-flow"><span class="layer current pulse">TCP三次握手</span><span class="arrow">→</span><span class="layer">TLS握手</span><span class="arrow">→</span><span class="layer">加密HTTP</span></div><div class="peers"><div class="peer">ubuntu-client</div><div class="wire"><div class="segment fail">Connection refused</div></div><div class="peer server fail">8443无监听</div></div><div class="terminal"><b>$</b> nc -vz -w 3 192.168.200.10 8443</div></div>';
      if(s.kind==='hello')return '<div class="tls"><div class="handshake"><div class="endpoint">客户端<br><small>访问training-web.test</small></div><div class="flights"><div class="flight current pulse">ClientHello →</div><div class="flight">TLS版本</div><div class="flight">密码套件/密钥材料</div><div class="flight">SNI=training-web.test</div></div><div class="endpoint server">HTTPS服务器<br><small>按SNI选择证书</small></div></div><div class="terminal"><b>$</b> openssl s_client -connect 目标:8443 -servername training-web.test</div></div>';
      if(s.kind==='certificate')return '<div class="tls"><div class="handshake"><div class="endpoint">客户端</div><div class="flights"><div class="flight current pulse">← ServerHello</div><div class="flight current">← Certificate chain</div></div><div class="endpoint server">服务器</div></div><div class="checks"><div class="check pass"><strong>名称</strong><small>SAN匹配training-web.test</small></div><div class="check pass"><strong>有效期</strong><small>当前时间在范围内</small></div><div class="check fail"><strong>信任链</strong><small>自签名CA不受信任</small></div></div><div class="terminal"><b>$</b> openssl x509 -in training.crt -noout -subject -issuer -dates -ext subjectAltName</div></div>';
      if(s.kind==='encrypted')return '<div class="tls"><div class="request-flow"><span class="layer current">TCP完成</span><span class="arrow">→</span><span class="layer current">证书验证</span><span class="arrow">→</span><span class="layer current">密钥协商/Finished</span><span class="arrow">→</span><span class="layer current pulse">加密HTTP</span></div><div class="lock">🔒</div><div class="compare"><div class="card active"><strong>仍可观察</strong><small>服务器IP、端口、流量大小和时序等元数据</small></div><div class="card active"><strong>受到保护</strong><small>HTTP路径、Header和Body等应用内容</small></div></div></div>';
      return '<div class="tls"><div class="compare"><div class="card fail"><strong>curl https://...</strong><small>默认验证：self-signed certificate<br>连接失败是预期安全行为</small></div><div class="card warn pulse"><strong>curl -k https://...</strong><small>仅跳过身份验证以完成实验观察<br>不建立真实信任</small></div></div><div class="warning">生产环境应修复证书链、名称或有效期，而不是长期使用-k关闭验证。</div><div class="terminal"><b>$</b> curl -I https://training-web.test:8443/<br><b>$</b> curl -kI https://training-web.test:8443/　# 仅实验</div></div>';
    }
    function stop(){if(timer)clearInterval(timer);timer=null;byId('play').textContent='▶ 播放'}function render(){const scene=scenes[sceneKey],s=scene.steps[stepIndex];document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.scene===sceneKey));byId('visualTitle').textContent=scene.title;byId('conceptTag').textContent=scene.tag;byId('counter').textContent='第 '+(stepIndex+1)+' / '+scene.steps.length+' 步';byId('stepTitle').textContent=s.title;byId('stepText').textContent=s.text;byId('questionText').textContent=s.q;byId('visual').innerHTML=sceneKey==='socket'?socketVisual(s):sceneKey==='tcp'?tcpVisual(s):sceneKey==='http'?httpVisual(s):tlsVisual(s)}
    function next(){stepIndex=(stepIndex+1)%scenes[sceneKey].steps.length;render()}function prev(){stepIndex=(stepIndex-1+scenes[sceneKey].steps.length)%scenes[sceneKey].steps.length;render()}function togglePlay(){if(timer)return stop();byId('play').textContent='❚❚ 暂停';next();timer=setInterval(next,5800)}
    document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{stop();sceneKey=t.dataset.scene;stepIndex=0;render()}));byId('prev').addEventListener('click',()=>{stop();prev()});byId('next').addEventListener('click',()=>{stop();next()});byId('restart').addEventListener('click',()=>{stop();stepIndex=0;render()});byId('play').addEventListener('click',togglePlay);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();next()}if(e.key==='ArrowLeft'){stop();prev()}if(e.key===' '){e.preventDefault();togglePlay()}if(['1','2','3','4'].includes(e.key)){stop();sceneKey=['socket','tcp','http','tls'][Number(e.key)-1];stepIndex=0;render()}});render();
  </script>
</body>
