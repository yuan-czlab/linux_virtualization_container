  <style>
    :root{color-scheme:dark;--bg:#071019;--panel:rgba(14,27,43,.95);--panel2:#142a40;--text:#eff7ff;--muted:#9fb1c5;--line:#486078;--blue:#61a5ff;--cyan:#65dcf6;--green:#62e6a5;--yellow:#ffd166;--purple:#bd95ff;--red:#ff7180;--shadow:0 22px 58px rgba(0,0,0,.35)}

    .tabs{display:flex;gap:9px;padding:9px;border:1px solid rgba(130,155,185,.22);border-radius:16px;background:rgba(7,15,27,.62);box-shadow:var(--shadow)}.tab{min-width:145px;padding:11px 16px;border:1px solid transparent;border-radius:11px;color:var(--muted);background:transparent;cursor:pointer;transition:.2s}.tab:hover{color:var(--text);background:rgba(255,255,255,.05)}.tab.active{color:#06151e;background:var(--blue);font-weight:900;box-shadow:0 8px 22px rgba(97,165,255,.22)}
    main{min-height:0;display:grid;grid-template-columns:minmax(630px,1.67fr) minmax(310px,.72fr);gap:14px}.visual-card,.lesson-card{border:1px solid rgba(130,155,185,.22);border-radius:20px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}.visual-card{min-height:570px;padding:22px}.visual-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.visual-top h2{margin:0;font-size:20px}.concept{padding:7px 10px;border:1px solid rgba(101,220,246,.28);border-radius:999px;color:var(--cyan);background:rgba(101,220,246,.08);font-size:12px;font-weight:800}#visual{min-height:475px;display:grid;align-content:center}
    .lesson-card{display:grid;grid-template-rows:auto auto 1fr auto;padding:22px}.counter{color:var(--blue);font-size:13px;font-weight:900;letter-spacing:.08em}.lesson-card h2{margin:8px 0 10px;font-size:clamp(22px,2.2vw,30px);line-height:1.22}.explain{margin:0;color:#ccd9e7;font-size:16px;line-height:1.72}.question{align-self:end;margin-top:18px;padding:16px;border-left:4px solid var(--yellow);border-radius:0 12px 12px 0;background:rgba(255,209,102,.08)}.question small{display:block;color:var(--yellow);font-weight:900;margin-bottom:5px}.question p{margin:0;color:#f7e8bc;line-height:1.55}

    .board{display:grid;gap:15px}.row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:9px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card{padding:15px;border:2px solid var(--line);border-radius:14px;background:#10243a;text-align:center;transition:.25s}.card strong{display:block;margin-bottom:5px}.card small{color:var(--muted)}.card.active{border-color:var(--green);background:rgba(98,230,165,.1);box-shadow:0 0 24px rgba(98,230,165,.18)}.card.blue{border-color:var(--blue)}.card.purple{border-color:var(--purple)}.card.warn{border-color:var(--yellow);background:rgba(255,209,102,.08)}.card.fail{border-color:var(--red);background:rgba(255,113,128,.09)}.card.dim{opacity:.32}.arrow{color:var(--green);font-size:25px;text-align:center;font-weight:900}.badge{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:7px;color:#06151e;background:var(--green);font-size:11px;font-weight:900}.badge.warn{background:var(--yellow)}.badge.fail{color:#fff;background:var(--red)}.terminal{padding:14px 17px;background:#03090f;border:1px solid #293d51;border-radius:12px;color:#dae7f3;font:13px/1.6 Consolas,monospace;white-space:normal}.terminal b{color:var(--green)}.terminal .hi{color:var(--yellow)}.terminal .bad{color:var(--red)}
    .request{display:grid;grid-template-columns:1fr 90px 1fr 90px 1fr;gap:9px;align-items:center}.subject,.object{padding:16px;border:2px solid var(--blue);border-radius:14px;text-align:center;background:#10243a}.object{border-color:var(--purple)}.gate{padding:16px 8px;border:3px solid var(--line);border-radius:13px;text-align:center}.gate.pass{border-color:var(--green);background:rgba(98,230,165,.08)}.gate.deny{border-color:var(--red);background:rgba(255,113,128,.08)}.gate strong{display:block}.truth{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.truth div{padding:12px;border:2px solid var(--line);border-radius:10px;text-align:center}.truth .yes{border-color:var(--green)}.truth .no{border-color:var(--red)}
    .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mode{padding:16px;border:3px solid var(--line);border-radius:14px;text-align:center}.mode strong{display:block;font-size:19px}.mode.enforcing{border-color:var(--green)}.mode.permissive{border-color:var(--yellow)}.mode.disabled{border-color:var(--red);opacity:.7}.context{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font:13px Consolas,monospace}.field{padding:13px 6px;border:2px solid var(--line);border-radius:10px;text-align:center}.field.type{border-color:var(--green);background:rgba(98,230,165,.08)}.pair{display:grid;grid-template-columns:1fr 90px 1fr;gap:10px;align-items:center}.domain,.typebox{padding:17px;border:2px solid var(--blue);border-radius:13px;text-align:center}.typebox{border-color:var(--purple)}.policy{padding:12px;border:2px solid var(--green);border-radius:999px;text-align:center}
    .labelstack{display:grid;grid-template-columns:1fr 80px 1fr;gap:10px;align-items:center}.pathmap{padding:15px;border:2px solid var(--blue);border-radius:13px;background:#10243a}.pathmap strong{display:block;color:var(--cyan);margin-bottom:7px}.filelabel{padding:15px;border:2px solid var(--purple);border-radius:13px;text-align:center}.filelabel.good{border-color:var(--green)}.filelabel.bad{border-color:var(--red)}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tool{padding:14px;border:2px solid var(--line);border-radius:12px;text-align:center}.tool.active{border-color:var(--green)}.tool.warn{border-color:var(--yellow)}.tool code{display:block;color:var(--cyan);margin-bottom:6px}.timeline{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}.step{min-width:105px;padding:12px;border:2px solid var(--line);border-radius:11px;text-align:center}.step.active{border-color:var(--green)}.step.fail{border-color:var(--red)}
    .avc{display:grid;gap:7px;padding:14px;border:1px solid #293d51;border-radius:12px;background:#03090f;font:12px/1.55 Consolas,monospace}.avc span{color:var(--muted)}.avc b{color:var(--cyan)}.avc .denied{color:var(--red);font-weight:900}.evidence{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.evidence div{padding:13px;border:2px solid var(--line);border-radius:11px;text-align:center}.evidence .active{border-color:var(--green)}.fixes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.fix{padding:12px 6px;border:2px solid var(--line);border-radius:10px;text-align:center}.fix.good{border-color:var(--green)}.fix.bad{border-color:var(--red)}.warning{padding:13px;border:1px solid var(--red);border-radius:11px;color:#ffc5ca;background:rgba(255,113,128,.08);text-align:center}
    @keyframes pulse{50%{box-shadow:0 0 28px rgba(98,230,165,.45);transform:scale(1.025)}}.pulse{animation:pulse 1.25s ease-in-out infinite}
    @media(max-width:980px){.app{min-height:auto}header{align-items:flex-start;flex-direction:column}.tabs{flex-wrap:wrap}main{grid-template-columns:1fr}.visual-card{min-height:540px}}
    @media(max-width:680px){.tab{min-width:0;flex:1 1 45%}.grid2,.grid3,.truth,.modes,.context,.tools,.evidence,.fixes{grid-template-columns:1fr}.request,.pair,.labelstack{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
  <div class="app">
    <header><div><p class="eyebrow">模块二 · 第23章 · Linux实验12/14</p><h1>SELinux双重判定、上下文与AVC排障</h1></div><div class="tag">DAC允许之后，MAC仍需允许</div></header>
    <nav class="tabs" aria-label="动画主题"><button class="tab active" data-scene="gates">1　DAC与MAC</button><button class="tab" data-scene="context">2　模式与上下文</button><button class="tab" data-scene="labels">3　标签持久化</button><button class="tab" data-scene="avc">4　AVC排障</button></nav>
    <main>
      <section class="visual-card"><div class="visual-top"><h2 id="visualTitle"></h2><span class="concept" id="conceptTag"></span></div><div id="visual" aria-live="polite"></div></section>
      <aside class="lesson-card"><div class="counter" id="counter"></div><div><h2 id="stepTitle"></h2><p class="explain" id="stepText"></p></div><div class="question"><small>先判断，再验证</small><p id="questionText"></p></div><div class="controls"><button class="control" id="prev">←</button><button class="control" id="restart">↺</button><button class="control play" id="play">▶ 播放</button><button class="control" id="next">→</button></div></aside>
    </main>
    <footer><span>概念模型：两类控制都必须允许；具体拒绝以应用日志和AVC证据为准</span><span>键盘：←/→ · 空格 · 1/2/3/4切换主题</span></footer>
  </div>
  <script>
    const scenes={
      gates:{title:'Linux访问需要传统权限与SELinux策略共同允许',tag:'DAC allow ∧ SELinux allow',steps:[
        {title:'访问请求包含主体、对象和操作',text:'例如httpd进程尝试读取/srv/techcorp/www/index.html。判断不能只看文件路径，还要识别发起访问的进程身份、目标对象以及read、write或name_connect等具体操作。',q:'只看到文件权限644，是否已经知道哪个进程正在以什么方式访问它？',kind:'request'},
        {title:'DAC依据UID、GID、rwx和ACL判断',text:'传统自主访问控制先解决Linux账号是否具有目录遍历和文件读取权限。目录每一级都可能需要x，文件通常需要r；ACL也可能参与结果。',q:'文件是644，但父目录没有给服务进程执行权限，读取能否成功？',kind:'dac'},
        {title:'SELinux依据域、类型和策略进一步判断',text:'SELinux类型强制把进程域与文件类型、端口类型等策略关系纳入控制。即使DAC允许，httpd_t也未必被允许读取错误标记为user_tmp_t的内容。',q:'chmod 777为什么不能证明SELinux一定允许httpd读取文件？',kind:'mac'},
        {title:'任意一道控制拒绝，访问就会失败',text:'DAC和SELinux是独立条件。两者都允许才成功；改变其中一层不会自动修复另一层。课堂图按两道门展示逻辑条件，不代表所有内核检查都必须按固定可见顺序发生。',q:'DAC拒绝时还需要把SELinux改为Permissive才能排障吗？',kind:'matrix'},
        {title:'先定位控制层，再做最小修复',text:'网络防火墙控制数据包，DAC控制账号对路径的访问，SELinux控制安全域与对象类型。看到403或Permission denied时，应通过路径权限、上下文、应用日志和AVC缩小范围。',q:'同时关闭firewalld、SELinux并chmod 777，会丢失哪些根因证据？',kind:'layers'}
      ]},
      context:{title:'模式决定是否执行策略，上下文描述安全身份',tag:'mode + user:role:type:level',steps:[
        {title:'Enforcing执行拒绝并记录策略事件',text:'Enforcing是课程正常状态。策略不允许的访问会被阻止，相关事件通常进入审计日志；合法访问照常进行。最终修复必须在Enforcing下复测。',q:'服务在Enforcing下工作正常，是关闭SELinux得到的吗？',kind:'enforcing'},
        {title:'Permissive允许访问但记录本应发生的拒绝',text:'Permissive可用于短时间、受控的对照诊断：策略不再执行拒绝，但仍产生提示证据。它不是完成配置后的长期答案，诊断后要恢复Enforcing。',q:'切到Permissive后访问成功，是否已经说明正确修复是什么？',kind:'permissive'},
        {title:'Disabled不是更彻底的排障模式',text:'Disabled停止SELinux策略执行，并可能导致标签维护不完整；启停通常还涉及配置和重启。课程不通过Disabled解决问题，而是在启用状态下收集证据和修复。',q:'为了消除一条403直接禁用SELinux，会带来什么诊断和安全问题？',kind:'disabled'},
        {title:'安全上下文通常包含四个字段',text:'system_u:object_r:httpd_sys_content_t:s0依次表示SELinux用户、角色、类型和级别。本课程以类型字段为重点，但不能把整串上下文误认为传统所有者和组。',q:'ls -lZ中的httpd_sys_content_t属于UID、GID还是SELinux类型？',kind:'fields'},
        {title:'策略匹配进程域、对象类型与操作',text:'Nginx/httpd进程通常运行在httpd_t域；站点只读内容使用httpd_sys_content_t。策略再结合对象类别和所请求权限决定是否允许。',q:'同一个文件类型对所有进程、所有操作都会自动允许吗？',kind:'policy'}
      ]},
      labels:{title:'持久标签需要先定义路径规则，再把标签应用到对象',tag:'semanage fcontext → restorecon',steps:[
        {title:'默认路径已有策略期望的标签',text:'系统策略包含路径到默认上下文的映射。restorecon读取这些映射并把实际对象恢复到期望标签；在标准Web目录中通常已有合适规则。',q:'restorecon是根据文件扩展名，还是根据策略中的路径映射决定标签？',kind:'default'},
        {title:'非标准目录需要持久路径规则',text:'把站点放在/srv/techcorp/www时，应使用semanage fcontext增加该路径及其后代的httpd_sys_content_t规则，再用restorecon实际应用。',q:'只执行semanage fcontext后立即ls -Z，现有文件标签一定已经改变吗？',kind:'mapping'},
        {title:'chcon只改当前对象标签',text:'chcon能立即改变文件当前标签，适合实验制造故障或短期验证，但没有修改策略的路径映射。以后执行restorecon或系统重新标记时，标签可能恢复为策略期望值。',q:'用chcon修好一次后，为什么仍不算非标准目录的持久方案？',kind:'chcon'},
        {title:'restorecon让实际标签回到期望状态',text:'定义持久路径规则后，restorecon -Rv递归应用；随后用ls -ldZ和ls -lZ分别检查目录及文件。只看到命令执行完成不能代替结果检查。',q:'restorecon没有改变类型时，应该先检查哪项持久路径规则？',kind:'restorecon'},
        {title:'移动与复制可能产生不同标签结果',text:'新建或复制到目标目录的文件通常按目标环境获得标签，而移动对象可能保留原标签，具体还受工具和文件系统影响。部署后应执行restorecon并验证，不能凭来源路径猜测。',q:'把/tmp中的文件mv到Web目录后，为什么应再次检查ls -Z？',kind:'move'}
      ]},
      avc:{title:'从现象和审计证据选择已有策略支持的最小修复',tag:'symptom → context → AVC → supported fix → retest',steps:[
        {title:'先建立可重复现象并记录正常基线',text:'确认目标名称、端口、服务、监听和firewalld正常，再重复一次失败请求并记录准确时间。这样才能把应用日志和AVC事件与本次访问对应起来。',q:'连TCP端口都无法建立时，是否应先修改SELinux文件标签？',kind:'baseline'},
        {title:'同时检查DAC、上下文和应用日志',text:'使用namei或ls检查路径权限，用ls -Z与ps -eZ查看对象类型和进程域，再读取Nginx、sshd等应用日志。不能只依赖某一条最终错误信息。',q:'看到应用日志Permission denied时，怎样区分DAC和SELinux方向？',kind:'evidence'},
        {title:'AVC说明谁对什么对象申请了什么权限',text:'ausearch中的scontext表示源进程安全上下文，tcontext表示目标对象上下文，tclass表示对象类别，denied花括号内是被拒绝的权限。时间、进程和路径应与故障对应。',q:'AVC里出现httpd_t、user_tmp_t和read时，优先怀疑哪个关系？',kind:'record'},
        {title:'根据业务意图选择已有的正确机制',text:'标签错误用restorecon；非标准路径用semanage fcontext加restorecon；服务访问网络上游可能使用已有布尔值；非标准端口还需正确端口类型。不要看到AVC就直接生成自定义策略。',q:'Nginx反向代理被阻止时，为什么先检查httpd_can_network_connect而非立即audit2allow？',kind:'fix'},
        {title:'恢复Enforcing并沿原路径完整复测',text:'诊断中若临时使用Permissive，最终必须恢复Enforcing；再次从原客户端执行原请求，检查功能、应用日志和新的AVC。保存故障前、拒绝证据、修复命令和复测结果。',q:'Permissive下成功、恢复Enforcing后没有复测，能否判定故障已修复？',kind:'retest'}
      ]}
    };
    let sceneKey='gates',stepIndex=0,timer=null;
    const byId=id=>document.getElementById(id);
    function gatesVisual(s){
      if(s.kind==='request')return '<div class="board"><div class="request"><div class="subject"><strong>主体</strong><small>httpd_t域中的Nginx进程</small></div><div class="arrow">→</div><div class="card active pulse"><strong>操作</strong><small>read</small></div><div class="arrow">→</div><div class="object"><strong>对象</strong><small>/srv/.../index.html</small></div></div><div class="terminal"><span class="hi">先识别：谁，要对什么，执行哪种操作</span></div></div>';
      if(s.kind==='dac')return '<div class="board"><div class="request"><div class="subject"><strong>nginx账号</strong><small>UID / GID / 补充组</small></div><div class="arrow">→</div><div class="gate pass pulse"><strong>DAC</strong><small>目录x + 文件r + ACL</small></div><div class="arrow">→</div><div class="object"><strong>index.html</strong><small>644并且父目录可遍历</small></div></div><div class="terminal"><b>$</b> namei -l /srv/techcorp/www/index.html</div></div>';
      if(s.kind==='mac')return '<div class="board"><div class="request"><div class="subject"><strong>httpd_t</strong><small>进程域</small></div><div class="arrow">→</div><div class="gate deny pulse"><strong>SELinux</strong><small>策略拒绝read</small></div><div class="arrow">→</div><div class="object"><strong>user_tmp_t</strong><small>错误文件类型</small></div></div><div class="terminal"><span class="bad">DAC=允许，但MAC=拒绝 → 访问失败</span></div></div>';
      if(s.kind==='matrix')return '<div class="board"><div class="truth"><div class="yes"><strong>DAC ✓　MAC ✓</strong><small>允许</small></div><div class="no"><strong>DAC ✕　MAC ✓</strong><small>拒绝</small></div><div class="no"><strong>DAC ✓　MAC ✕</strong><small>拒绝</small></div><div class="no"><strong>DAC ✕　MAC ✕</strong><small>拒绝</small></div></div><div class="row"><span class="badge pulse">逻辑条件：两者必须都允许</span></div></div>';
      return '<div class="board"><div class="grid3"><div class="card blue"><strong>网络入口</strong><small>firewalld<br>数据包是否进入</small></div><div class="card warn"><strong>传统路径权限</strong><small>UID/GID/rwx/ACL</small></div><div class="card purple pulse"><strong>强制访问控制</strong><small>域/类型/策略</small></div></div><div class="warning">关闭全部控制层只能扩大权限，不能定位根因</div></div>';
    }
    function contextVisual(s){
      if(s.kind==='enforcing')return '<div class="board"><div class="modes"><div class="mode enforcing pulse"><strong>Enforcing</strong><small>执行允许与拒绝<br>记录相关AVC</small></div><div class="mode permissive"><strong>Permissive</strong><small>不执行拒绝<br>记录本应拒绝</small></div><div class="mode disabled"><strong>Disabled</strong><small>不执行策略<br>标签维护可能不完整</small></div></div><div class="terminal"><b>$</b> getenforce　<span class="hi">Enforcing</span></div></div>';
      if(s.kind==='permissive')return '<div class="board"><div class="pair"><div class="domain"><strong>httpd_t请求</strong><small>原本不允许</small></div><div class="arrow">→</div><div class="mode permissive pulse"><strong>Permissive</strong><small>访问放行<br>产生would-be denial证据</small></div></div><div class="terminal"><span class="hi">只用于受控对照；不能作为最终修复</span></div></div>';
      if(s.kind==='disabled')return '<div class="board"><div class="mode disabled pulse"><strong>Disabled</strong><small>策略不加载、不执行<br>可能失去正常标签维护和拒绝证据</small></div><div class="warning">课程不以禁用SELinux解决业务访问问题</div></div>';
      if(s.kind==='fields')return '<div class="board"><div class="context"><div class="field"><strong>system_u</strong><small>SELinux用户</small></div><div class="field"><strong>object_r</strong><small>角色</small></div><div class="field type pulse"><strong>httpd_sys_content_t</strong><small>类型：本课重点</small></div><div class="field"><strong>s0</strong><small>级别</small></div></div><div class="terminal"><b>$</b> ls -lZ /srv/techcorp/www/index.html</div></div>';
      return '<div class="board"><div class="pair"><div class="domain"><strong>httpd_t</strong><small>源进程域</small></div><div><div class="policy pulse">策略允许<br>file:read</div></div><div class="typebox"><strong>httpd_sys_content_t</strong><small>目标文件类型</small></div></div><div class="terminal"><span class="hi">域 + 类型 + 对象类别 + 操作 → 策略结果</span></div></div>';
    }
    function labelsVisual(s){
      if(s.kind==='default')return '<div class="board"><div class="labelstack"><div class="pathmap"><strong>策略路径映射</strong>/var/www(/.*)?<br>→ httpd_sys_content_t</div><div class="arrow">→</div><div class="filelabel good pulse"><strong>实际文件标签</strong><br>httpd_sys_content_t</div></div><div class="terminal"><b>$</b> restorecon -Rv /var/www</div></div>';
      if(s.kind==='mapping')return '<div class="board"><div class="timeline"><div class="step active pulse">semanage fcontext<br><small>定义路径→类型</small></div><div class="arrow">→</div><div class="step">restorecon<br><small>应用到现有对象</small></div><div class="arrow">→</div><div class="step">ls -Z<br><small>验证实际标签</small></div></div><div class="terminal"><b>#</b> semanage fcontext -a -t httpd_sys_content_t \'/srv/techcorp/www(/.*)?\'</div></div>';
      if(s.kind==='chcon')return '<div class="board"><div class="labelstack"><div class="filelabel bad pulse"><strong>chcon当前标签</strong><br>user_tmp_t</div><div class="arrow">≠</div><div class="pathmap"><strong>持久路径规则未改变</strong>/srv/selinux-lab(/.*)?<br>→ httpd_sys_content_t</div></div><div class="terminal"><b>#</b> chcon -t user_tmp_t /srv/selinux-lab/index.html</div></div>';
      if(s.kind==='restorecon')return '<div class="board"><div class="timeline"><div class="step fail">当前标签<br><small>user_tmp_t</small></div><div class="arrow">→</div><div class="step active pulse">restorecon -v</div><div class="arrow">→</div><div class="step active">期望标签<br><small>httpd_sys_content_t</small></div></div><div class="terminal"><b>#</b> restorecon -v /srv/selinux-lab/index.html<br><b>#</b> ls -lZ /srv/selinux-lab/index.html</div></div>';
      return '<div class="board"><div class="grid2"><div class="card active"><strong>复制/新建到目标</strong><small>通常结合目标环境获得标签</small></div><div class="card warn pulse"><strong>移动到目标</strong><small>可能保留来源对象的旧标签</small></div></div><div class="timeline"><div class="step active">部署文件</div><div class="arrow">→</div><div class="step active">restorecon</div><div class="arrow">→</div><div class="step active">ls -Z验证</div></div></div>';
    }
    function avcVisual(s){
      if(s.kind==='baseline')return '<div class="board"><div class="timeline"><div class="step active">名称/IP</div><div class="step active">TCP端口</div><div class="step active">服务/监听</div><div class="step active">firewalld</div><div class="step fail pulse">应用访问失败</div></div><div class="terminal"><b>$</b> date -Iseconds<br><b>$</b> curl -H \'Host: techcorp.test\' http://rocky-web/<br><span class="hi">记录可重复现象的准确时间</span></div></div>';
      if(s.kind==='evidence')return '<div class="board"><div class="evidence"><div class="active"><strong>DAC路径</strong><small>namei -l<br>ls -l</small></div><div class="active pulse"><strong>安全上下文</strong><small>ls -Z<br>ps -eZ</small></div><div class="active"><strong>服务证据</strong><small>应用日志<br>journal</small></div></div><div class="terminal"><span class="hi">先收集并关联证据，不先扩大权限</span></div></div>';
      if(s.kind==='record')return '<div class="board"><div class="avc"><span>type=AVC msg=audit(...):</span><span class="denied">avc: denied { read }</span><span><b>scontext=</b>system_u:system_r:httpd_t:s0</span><span><b>tcontext=</b>unconfined_u:object_r:user_tmp_t:s0</span><span><b>tclass=</b>file　comm="nginx"　name="index.html"</span></div><div class="row"><span class="badge pulse">主体域 + 目标类型 + 类别 + 被拒绝权限</span></div></div>';
      if(s.kind==='fix')return '<div class="board"><div class="fixes"><div class="fix good"><strong>标签错误</strong><small>restorecon</small></div><div class="fix good"><strong>非标准路径</strong><small>semanage fcontext</small></div><div class="fix good"><strong>已有能力开关</strong><small>检查布尔值</small></div><div class="fix bad pulse"><strong>直接自定义策略</strong><small>不作为第一步</small></div></div><div class="terminal"><b>$</b> getsebool httpd_can_network_connect<br><span class="bad">不要未经分析就把所有AVC交给audit2allow</span></div></div>';
      return '<div class="board"><div class="timeline"><div class="step active">恢复Enforcing</div><div class="arrow">→</div><div class="step active">原客户端/原请求</div><div class="arrow">→</div><div class="step active">功能成功</div><div class="arrow">→</div><div class="step active pulse">日志无新增拒绝</div></div><div class="terminal"><b>#</b> setenforce 1<br><b>$</b> getenforce　<span class="hi">Enforcing</span><br><b>$</b> ausearch -m AVC -ts recent</div></div>';
    }
    function render(){
      const scene=scenes[sceneKey],step=scene.steps[stepIndex];
      byId('visualTitle').textContent=scene.title;byId('conceptTag').textContent=scene.tag;
      byId('counter').textContent='第 '+(stepIndex+1)+' / '+scene.steps.length+' 步';
      byId('stepTitle').textContent=step.title;byId('stepText').textContent=step.text;byId('questionText').textContent=step.q;
      byId('visual').innerHTML=sceneKey==='gates'?gatesVisual(step):sceneKey==='context'?contextVisual(step):sceneKey==='labels'?labelsVisual(step):avcVisual(step);
      document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.scene===sceneKey));
    }
    function stop(){if(timer){clearInterval(timer);timer=null}byId('play').textContent='▶ 播放'}
    function next(){const n=scenes[sceneKey].steps.length;stepIndex=stepIndex<n-1?stepIndex+1:0;render()}
    function previous(){const n=scenes[sceneKey].steps.length;stepIndex=(stepIndex-1+n)%n;render()}
    function togglePlay(){if(timer){stop();return}byId('play').textContent='Ⅱ 暂停';timer=setInterval(next,4300)}
    document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{stop();sceneKey=t.dataset.scene;stepIndex=0;render()}));
    byId('prev').addEventListener('click',()=>{stop();previous()});byId('next').addEventListener('click',()=>{stop();next()});byId('restart').addEventListener('click',()=>{stop();stepIndex=0;render()});byId('play').addEventListener('click',togglePlay);
    document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();next()}else if(e.key==='ArrowLeft'){stop();previous()}else if(e.key===' '){e.preventDefault();togglePlay()}else if('1234'.includes(e.key)){stop();sceneKey=['gates','context','labels','avc'][Number(e.key)-1];stepIndex=0;render()}});
    render();
  </script>
</body>
</html>
